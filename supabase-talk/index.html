<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A practical engineering talk about what runs where in Supabase.">
  <title>Supabase as a Backend: What Runs Where</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button class="brand" id="homeBtn" aria-label="Go to first slide">SUPABASE <span>/ WHAT RUNS WHERE</span></button>
      <span class="chapter-name" id="chapterName"></span>
      <div class="toolbar-actions">
        <button class="overview-trigger" id="overviewBtn" type="button" aria-haspopup="dialog" aria-controls="overviewDialog" aria-expanded="false">Overview</button>
        <span class="session-name">ENGINEERING TALK · FS-03</span>
      </div>
    </header>
    <main id="stage" tabindex="-1" aria-label="Presentation slide"></main>
    <footer class="transport">
      <span class="transport-label" id="sectionLabel"></span>
      <div class="transport-right"><span class="talk-time" id="talkTime"></span><button id="prevBtn" aria-label="Previous slide">←</button><span id="counter"></span><button id="nextBtn" aria-label="Next slide">→</button></div>
      <div class="progress"><span id="progressFill"></span></div>
    </footer>
    <dialog class="overview-dialog" id="overviewDialog" aria-labelledby="overviewTitle">
      <div class="overview-head">
        <div>
          <p class="overview-kicker">SUPABASE / WHAT RUNS WHERE</p>
          <h2 id="overviewTitle">Talk overview</h2>
          <p class="overview-summary" id="overviewSummary"></p>
        </div>
        <button class="overview-close" id="overviewClose" type="button" aria-label="Close overview">Close ×</button>
      </div>
      <div class="overview-groups" id="overviewGroups"></div>
    </dialog>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
