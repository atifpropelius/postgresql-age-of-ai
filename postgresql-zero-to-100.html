<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F6">
<title>PostgreSQL Zero to 100</title>

<script>
/* Anti-FOUC: restore the saved theme before first paint. */
(function () {
  try {
    var t = localStorage.getItem('pgcc.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    var l = localStorage.getItem('pgcc.language');
    if (l === 'en' || l === 'hi') {
      document.documentElement.dataset.lang = l;
      document.documentElement.lang = l === 'hi' ? 'hi-Latn' : 'en';
    }
  } catch (e) {}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1 · DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;

  /* surfaces */
  --c-bg:        #E8ECF3;
  --c-surface:   #FFFFFF;
  --c-surface-2: #F3F5F9;
  --c-surface-3: #E7EBF2;
  --c-border:    #D8DEE9;
  --c-border-2:  #C3CBDA;

  /* text */
  --c-text:      #0F172A;
  --c-text-2:    #475569;
  --c-muted:     #64748B;

  /* accents */
  --c-accent:    #2563EB;
  --c-accent-2:  #0EA5E9;
  --c-good:      #059669;
  --c-warn:      #B45309;
  --c-bad:       #DC2626;
  --c-violet:    #7C3AED;

  /* tints */
  --c-accent-soft: color-mix(in srgb, var(--c-accent) 9%,  var(--c-surface));
  --c-good-soft:   color-mix(in srgb, var(--c-good)   11%, var(--c-surface));
  --c-warn-soft:   color-mix(in srgb, var(--c-warn)   11%, var(--c-surface));
  --c-bad-soft:    color-mix(in srgb, var(--c-bad)    10%, var(--c-surface));
  --c-violet-soft: color-mix(in srgb, var(--c-violet) 10%, var(--c-surface));

  /* type — no webfonts: nothing may be fetched from file:// */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
               Menlo, Consolas, "Liberation Mono", monospace;

  /* motion + elevation */
  --ease: cubic-bezier(.22,.72,.28,1);
  --dur: 260ms;
  --sh-1: 0 1px 2px rgb(15 23 42 / .06), 0 4px 12px rgb(15 23 42 / .05);
  --sh-2: 0 2px 6px rgb(15 23 42 / .08), 0 16px 40px rgb(15 23 42 / .10);

  --z-chrome: 20; --z-scrim: 30; --z-drawer: 40; --z-help: 50; --z-toast: 60;

  /* All chrome lives in two side rails. The stage is sized from what is left,
     so no control can ever sit on top of a slide. */
  --rail: 4.5rem;
  --vgap: 1.25rem;

  /* u = 1% of the 16:9 stage width. */
  --u: min(calc((100vw - 2 * var(--rail)) / 100), calc((100vh - var(--vgap)) / 56.25));

  --sp-1: calc(var(--u) * .55);
  --sp-2: calc(var(--u) * 1.1);
  --sp-3: calc(var(--u) * 1.9);
  --sp-4: calc(var(--u) * 3.0);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --c-bg:        #05080F;
  --c-surface:   #0F172A;
  --c-surface-2: #1A2436;
  --c-surface-3: #243043;
  --c-border:    #2C3A50;
  --c-border-2:  #40506B;
  --c-text:      #E9EEF7;
  --c-text-2:    #B4C1D4;
  --c-muted:     #8B9BB2;
  --c-accent:    #60A5FA;
  --c-accent-2:  #38BDF8;
  --c-good:      #34D399;
  --c-warn:      #FBBF24;
  --c-bad:       #F87171;
  --c-violet:    #A78BFA;
  --sh-1: 0 1px 2px rgb(0 0 0 / .5), 0 4px 14px rgb(0 0 0 / .35);
  --sh-2: 0 2px 8px rgb(0 0 0 / .55), 0 18px 46px rgb(0 0 0 / .45);
}

/* ═══════════════════════════════════════════════════════════════════════════
   2 · RESET + BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
/* Author `display` rules beat the UA stylesheet's [hidden] rule, so any element
   we both style and toggle with `hidden` needs this to actually stay hidden. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  background: var(--c-bg);
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
code, pre, kbd { font-family: var(--font-mono); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 3px; border-radius: 4px; }
.slide:focus { outline: none; }
.slide:focus-visible { outline: 3px solid var(--c-accent); outline-offset: -6px; }

.skip-link {
  position: fixed; top: 8px; left: 8px; z-index: 90;
  padding: .6rem 1rem; border-radius: 8px;
  background: var(--c-accent); color: #fff; font-weight: 600;
  transform: translateY(-160%); transition: transform .18s var(--ease);
}
.skip-link:focus { transform: none; }

.svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
/* NOT display:none — some engines drop marker refs from a display:none subtree. */

/* ═══════════════════════════════════════════════════════════════════════════
   3 · STAGE + SLIDE GRID
   ═══════════════════════════════════════════════════════════════════════════ */
.viewport {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  overflow: hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--c-accent) 5%, var(--c-bg)), var(--c-bg));
}
.stage {
  position: relative;
  width:  calc(var(--u) * 100);
  height: calc(var(--u) * 56.25);
  background: var(--c-surface);
  overflow: hidden;
  border-radius: calc(var(--u) * .9);
  box-shadow: 0 0 0 1px var(--c-border), var(--sh-2);
}

.slide {
  --fit: 1;
  --su: calc(var(--u) * var(--fit));
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;   /* minmax(0,·), not 1fr */
  gap: calc(var(--su) * 1.9);
  padding: calc(var(--su) * 4.6) calc(var(--su) * 6) calc(var(--su) * 3.8);
  font-size: calc(var(--su) * 1.82);
  line-height: 1.5;
  color: var(--c-text);
  opacity: 0;
  transform: translate3d(calc(var(--dir, 1) * 2%), 0, 0);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  pointer-events: none;
}
.slide.is-active  { opacity: 1; transform: none; pointer-events: auto; }
.slide.is-leaving { opacity: 0; transform: translate3d(calc(var(--dir, 1) * -2%), 0, 0); }

.s-head { display: grid; gap: calc(var(--su) * .7); }
.s-kicker {
  font-size: .6em; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 700; color: var(--c-accent);
}
.s-title {
  font-size: 2.15em; line-height: 1.1; letter-spacing: -.025em;
  font-weight: 700; text-wrap: balance;
}
.s-body {
  min-height: 0;
  overflow: hidden;                 /* the autofit sensor */
  display: flex; flex-direction: column; gap: calc(var(--su) * 1.6);
  justify-content: center;
}
.s-foot {
  font-size: .74em; color: var(--c-muted);
  border-top: 1px solid var(--c-border);
  padding-top: calc(var(--su) * 1.1);
  display: flex; gap: .6em; align-items: baseline;
}
.s-foot::before { content: "→"; color: var(--c-accent); font-weight: 700; }

/* --- layout: title slide --- */
.slide[data-layout="title"] {
  grid-template-rows: 1fr auto;
  place-content: center;
  padding-inline: calc(var(--su) * 9);
  background:
    radial-gradient(80% 120% at 12% 0%, var(--c-accent-soft), transparent 60%),
    var(--c-surface);
}
.slide[data-layout="title"] .s-head { align-self: end; gap: calc(var(--su) * 1.4); }
.slide[data-layout="title"] .s-title { font-size: 3.5em; }
.slide[data-layout="title"] .s-kicker { font-size: .72em; }
.slide[data-layout="title"] .s-body { justify-content: start; }

/* --- layout: section divider --- */
.slide[data-layout="section"] {
  grid-template-rows: 1fr auto;
  place-content: center;
  background:
    linear-gradient(140deg, var(--c-accent-soft), var(--c-surface) 55%);
}
.slide[data-layout="section"] .s-head { align-self: end; }
.slide[data-layout="section"] .s-title { font-size: 3em; }

/* --- layout: code-led — a long listing needs the header band back --- */
.slide[data-layout="code"] {
  /* Top padding stays clear of the fixed topbar; the room comes from a
     smaller title, tighter gap and slimmer side/bottom margins instead. */
  padding: calc(var(--su) * 4.3) calc(var(--su) * 4.6) calc(var(--su) * 2.8);
  gap: calc(var(--su) * 1.05);
}
.slide[data-layout="code"] .s-title { font-size: 1.62em; }
.slide[data-layout="code"] .s-body { gap: calc(var(--su) * 1.1); }

/* --- layout: diagram-led (body gets maximum room) --- */
.slide[data-layout="diagram"] { padding-bottom: calc(var(--su) * 2.8); }
.slide[data-layout="diagram"] .s-body { gap: calc(var(--su) * 1.1); }

/* ═══════════════════════════════════════════════════════════════════════════
   4 · BLOCKS
   ═══════════════════════════════════════════════════════════════════════════ */
.b-h { font-size: 1.06em; font-weight: 700; letter-spacing: -.01em; }
.b-p { font-size: .92em; color: var(--c-text-2); max-width: 62ch; }
.b-p.is-lead  { font-size: 1.05em; color: var(--c-text); max-width: 56ch; }
.b-p.is-muted { color: var(--c-muted); font-size: .82em; }

strong { font-weight: 700; color: var(--c-text); }
em { font-style: italic; }
code.ic {
  font-size: .86em; padding: .12em .42em; border-radius: .32em;
  background: var(--c-surface-2); border: 1px solid var(--c-border);
  color: var(--c-text); white-space: nowrap;
}

.b-ul, .b-ol { display: grid; gap: calc(var(--su) * 1.15); font-size: .94em; }
.b-ul.is-tight, .b-ol.is-tight { gap: calc(var(--su) * .7); }
.b-ul.is-2col, .b-ol.is-2col {
  grid-template-columns: 1fr 1fr; column-gap: calc(var(--su) * 3.4);
}
.b-ul > li {
  position: relative; padding-left: 1.55em;
  color: var(--c-text-2);
}
.b-ul > li::before {
  content: ""; position: absolute; left: .28em; top: .58em;
  width: .46em; height: .46em; border-radius: 50%;
  background: var(--c-accent);
}
.b-ul > li.i-ok::before,
.b-ul > li.i-no::before { border-radius: 0; background: none; }
.b-ul > li.i-ok::before { content: "✓"; color: var(--c-good); font-weight: 800;
  left: .1em; top: 0; width: auto; height: auto; }
.b-ul > li.i-no::before { content: "✕"; color: var(--c-bad); font-weight: 800;
  left: .1em; top: 0; width: auto; height: auto; }
.b-ol { counter-reset: n; }
.b-ol > li {
  position: relative; padding-left: 1.9em; color: var(--c-text-2);
  counter-increment: n;
}
.b-ol > li::before {
  content: counter(n); position: absolute; left: 0; top: .06em;
  font-size: .78em; font-weight: 800; color: var(--c-accent);
  font-variant-numeric: tabular-nums;
}
.li-sub { display: block; font-size: .84em; color: var(--c-muted); margin-top: .16em; }

.b-steps { display: grid; gap: calc(var(--su) * .95); font-size: .88em; counter-reset: s; }
.b-steps > li {
  display: grid; grid-template-columns: auto auto 1fr; gap: .75em;
  align-items: baseline; counter-increment: s;
}
.step-n {
  display: inline-grid; place-items: center; min-width: 1.75em; height: 1.75em;
  border-radius: 50%; background: var(--c-accent-soft); color: var(--c-accent);
  font-size: .78em; font-weight: 800; font-variant-numeric: tabular-nums;
  align-self: start;
}
.step-k { font-weight: 700; color: var(--c-text); }
.step-t { color: var(--c-text-2); }

.b-defs {
  display: grid; grid-template-columns: auto 1fr;
  gap: calc(var(--su) * .85) calc(var(--su) * 1.8);
  font-size: .88em; align-items: baseline;
}
.b-defs dt { font-weight: 700; color: var(--c-text); white-space: nowrap; }
.b-defs dd { color: var(--c-text-2); }

.scroll-x {
  overflow-x: auto; overflow-y: hidden; min-width: 0;
  overscroll-behavior-x: contain; scrollbar-width: thin;
}
.b-table {
  width: 100%; border-collapse: collapse; font-size: .84em;
}
.b-table.is-compact { font-size: .76em; }
.b-table th, .b-table td {
  padding: calc(var(--su) * .82) calc(var(--su) * 1.1);
  border-bottom: 1px solid var(--c-border);
  vertical-align: top; text-align: left; overflow-wrap: anywhere;
}
.b-table thead th {
  background: var(--c-surface-2); font-weight: 700; font-size: .92em;
  letter-spacing: .05em; text-transform: uppercase; color: var(--c-muted);
  border-bottom: 2px solid var(--c-border-2);
}
.b-table tbody tr:last-child td { border-bottom: 0; }
.b-table td:first-child { font-weight: 600; color: var(--c-text); }
.b-table .a-c { text-align: center; }
.b-table .a-r { text-align: right; font-variant-numeric: tabular-nums; }

/* The figure must NOT be a scroll container: a scrollable flex item can shrink
   below its content and silently clip long listings, which also hides the
   overflow from autofit. The inner div takes the horizontal scroll instead. */
.b-code {
  background: var(--c-surface-2); border: 1px solid var(--c-border);
  border-radius: calc(var(--su) * .8);
  padding: calc(var(--su) * 1.3) calc(var(--su) * 1.6);
  min-width: 0;
}
.b-code .code-scroll { overflow-x: auto; overflow-y: hidden; min-width: 0; }
.b-code pre { margin: 0; }
.b-code pre code {
  font-size: .75em; line-height: 1.45; white-space: pre;
  color: var(--c-text); display: block;
}
.b-code figcaption {
  margin-top: calc(var(--su) * .7); font-size: .72em; color: var(--c-muted);
}

.b-callout {
  display: grid; grid-template-columns: auto 1fr; gap: calc(var(--su) * 1.1);
  padding: calc(var(--su) * 1.25) calc(var(--su) * 1.6);
  border-radius: calc(var(--su) * .8);
  border: 1px solid var(--c-border-2);
  border-left: calc(var(--su) * .42) solid var(--c-accent);
  background: var(--c-accent-soft);
  font-size: .86em;
}
.b-callout.is-tip  { border-left-color: var(--c-good);   background: var(--c-good-soft); }
.b-callout.is-warn { border-left-color: var(--c-warn);   background: var(--c-warn-soft); }
.b-callout.is-trap { border-left-color: var(--c-bad);    background: var(--c-bad-soft); }
.callout-ico { font-size: 1.05em; line-height: 1.4; }
.callout-t { font-weight: 700; margin-bottom: .18em; color: var(--c-text); }
.callout-b { color: var(--c-text-2); }

.b-stats {
  display: grid; grid-template-columns: repeat(var(--n, 3), 1fr);
  gap: calc(var(--su) * 1.4);
}
.stat {
  padding: calc(var(--su) * 1.3) calc(var(--su) * 1.4);
  border-radius: calc(var(--su) * .8);
  background: var(--c-surface-2); border: 1px solid var(--c-border);
}
.stat-v {
  font-size: 1.62em; font-weight: 800; letter-spacing: -.03em;
  color: var(--c-accent); font-variant-numeric: tabular-nums; line-height: 1.1;
}
.stat-l { font-size: .74em; color: var(--c-muted); margin-top: .3em; }
.stat.is-good .stat-v { color: var(--c-good); }
.stat.is-warn .stat-v { color: var(--c-warn); }
.stat.is-bad  .stat-v { color: var(--c-bad); }

.b-cols {
  display: grid; grid-template-columns: var(--ratio, 1fr 1fr);
  gap: calc(var(--su) * 2.6); align-items: start; min-height: 0;
}
.b-cols > .col { min-width: 0; min-height: 0; display: grid; gap: calc(var(--su) * 1.2); }

.b-quote {
  border-left: calc(var(--su) * .42) solid var(--c-accent);
  padding-left: calc(var(--su) * 1.8);
  font-size: 1.1em; color: var(--c-text);
}
.b-quote cite { display: block; margin-top: .5em; font-size: .68em;
  color: var(--c-muted); font-style: normal; }

/* A diagram is bounded by the HEIGHT left over in the slide body, not by width.
   Sizing it by width would be self-defeating: autofit shrinks --su, which shrinks
   the slide padding, which makes the body wider — which makes a width-driven SVG
   taller. Letting it fill a flex-shrinkable box and relying on the SVG's own
   preserveAspectRatio="xMidYMid meet" makes it scale down cleanly instead. */
.b-diagram {
  margin: 0; min-height: 0;
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  gap: calc(var(--su) * .7);
}
.s-body > .b-diagram { flex: 1 1 auto; }
.b-diagram .diagram-host {
  min-height: 0; display: flex; align-items: center; justify-content: center;
}
.b-diagram .diagram { width: 100%; height: 100%; max-height: 100%; }
/* Inside a column the diagram has no definite height to fill, so fall back to
   natural width-driven sizing. */
.b-cols .b-diagram { grid-template-rows: auto auto; }
.b-cols .b-diagram .diagram { height: auto; }
.b-cap { font-size: .74em; color: var(--c-muted); text-align: center; }

/* ═══════════════════════════════════════════════════════════════════════════
   5 · DIAGRAMS
   ═══════════════════════════════════════════════════════════════════════════ */
.diagram {
  display: block; width: 100%; height: auto;
  font-family: var(--font-ui); color: var(--c-text);
}
.diagram .n-bg { fill: var(--c-surface-2); stroke: var(--c-border-2); stroke-width: 1.6; }
.diagram .n-t  { fill: var(--c-text); font-size: 21px; font-weight: 640;
                 text-anchor: middle; letter-spacing: .1px; }
.diagram .n-s  { fill: var(--c-muted); font-size: 15px; font-weight: 500; text-anchor: middle; }

.diagram .n--accent .n-bg { fill: var(--c-accent-soft); stroke: var(--c-accent); }
.diagram .n--accent .n-t  { fill: var(--c-accent); }
.diagram .n--db     .n-bg { fill: var(--c-surface-3); stroke: var(--c-border-2); }
.diagram .n--warm   .n-bg { fill: var(--c-warn-soft); stroke: var(--c-warn); }
.diagram .n--warm   .n-t  { fill: var(--c-warn); }
.diagram .n--good   .n-bg { fill: var(--c-good-soft); stroke: var(--c-good); }
.diagram .n--good   .n-t  { fill: var(--c-good); }
.diagram .n--bad    .n-bg { fill: var(--c-bad-soft);  stroke: var(--c-bad); }
.diagram .n--bad    .n-t  { fill: var(--c-bad); }
.diagram .n--violet .n-bg { fill: var(--c-violet-soft); stroke: var(--c-violet); }
.diagram .n--violet .n-t  { fill: var(--c-violet); }
.diagram .n--ghost  .n-bg { fill: none; stroke: var(--c-border-2); stroke-dasharray: 6 5; }
.diagram .n--ghost  .n-t  { fill: var(--c-muted); }
.diagram .n--dim { opacity: .32; }

.diagram .e-l {
  fill: none; stroke: var(--c-muted); stroke-width: 2.4;
  stroke-linecap: round; stroke-linejoin: round; marker-end: url(#ar-mut);
}
.diagram .e--acc  .e-l { stroke: var(--c-accent); marker-end: url(#ar-acc); }
.diagram .e--good .e-l { stroke: var(--c-good);   marker-end: url(#ar-good); }
.diagram .e--warn .e-l { stroke: var(--c-warn);   marker-end: url(#ar-warn); }
.diagram .e--bad  .e-l { stroke: var(--c-bad);    marker-end: url(#ar-bad); }
.diagram .e--violet .e-l { stroke: var(--c-violet); marker-end: url(#ar-violet); }
.diagram .e--dash .e-l { stroke-dasharray: 7 6; }
.diagram .e--thin .e-l { stroke-width: 1.5; opacity: .5; }
.diagram .e--bold .e-l { stroke-width: 4; }
.diagram .e--none .e-l { marker-end: none; }

.diagram .e-t {
  font-size: 16px; font-weight: 560; text-anchor: middle; fill: var(--c-text-2);
  paint-order: stroke fill; stroke: var(--c-surface); stroke-width: 6px;
  stroke-linejoin: round;
}
.diagram .e-t.t--good { fill: var(--c-good); }
.diagram .e-t.t--warn { fill: var(--c-warn); }
.diagram .e-t.t--bad  { fill: var(--c-bad); }
.diagram .e-t.t--acc  { fill: var(--c-accent); }

.diagram .anno { font-size: 15px; fill: var(--c-muted); }
.diagram .anno.a--bad  { fill: var(--c-bad); }
.diagram .anno.a--good { fill: var(--c-good); }
.diagram .lbl {
  font-size: 14px; font-weight: 800; fill: var(--c-muted);
  letter-spacing: .11em; text-transform: uppercase;
}
.diagram .zone {
  fill: color-mix(in srgb, var(--c-accent) 4%, transparent);
  stroke: var(--c-border-2); stroke-dasharray: 5 5;
}
.diagram .zone.z--bad  { fill: color-mix(in srgb, var(--c-bad) 5%, transparent);
                         stroke: var(--c-bad); }
.diagram .zone.z--good { fill: color-mix(in srgb, var(--c-good) 5%, transparent);
                         stroke: var(--c-good); }
.diagram .cyl-top { fill: var(--c-surface-3); stroke: var(--c-border-2); stroke-width: 1.6; }
.diagram .divider { stroke: var(--c-border); stroke-width: 1.5; stroke-dasharray: 4 5; }

.mk-mut  path, .mk-mut  circle { fill: var(--c-muted); }
.mk-acc    path { fill: var(--c-accent); }
.mk-good   path { fill: var(--c-good); }
.mk-warn   path { fill: var(--c-warn); }
.mk-bad    path { fill: var(--c-bad); }
.mk-violet path { fill: var(--c-violet); }

/* ═══════════════════════════════════════════════════════════════════════════
   6 · CHROME
   ═══════════════════════════════════════════════════════════════════════════ */
/* Right rail — every control, stacked beside the slide. */
.topbar {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-chrome);
  width: var(--rail);
  display: flex; flex-direction: column; align-items: center; gap: .45rem;
  padding: .9rem 0 1rem;
}
.topbar-spacer { flex: 1; }
.rail-sep { width: 1.6rem; height: 1px; background: var(--c-border-2); margin: .3rem 0; }

/* Left rail — brand at the top, position at the bottom. */
.brand {
  position: fixed; top: 1.1rem; left: calc(var(--rail) / 2); z-index: var(--z-chrome);
  transform: translateX(-50%);
  writing-mode: vertical-rl; white-space: nowrap;
  font-size: .72rem; font-weight: 700; letter-spacing: .08em;
  color: var(--c-muted);
}

.icon-btn {
  display: grid; place-items: center;
  width: 2.3rem; height: 2.3rem; border-radius: .6rem;
  color: var(--c-text-2);
  border: 1px solid transparent;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.icon-btn:hover { background: var(--c-surface); color: var(--c-text); border-color: var(--c-border); }
.icon-btn[aria-expanded="true"] {
  background: var(--c-accent); color: #fff; border-color: var(--c-accent);
}
.icon-btn svg { width: 1.25rem; height: 1.25rem; }

.lang-switch {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  width: 3.75rem;
  padding: 3px; border-radius: .6rem;
  background: var(--c-surface); border: 1px solid var(--c-border);
}
.lang-switch button {
  padding: .42rem 0; border-radius: .42rem; text-align: center;
  font-size: .64rem; font-weight: 700; letter-spacing: .02em;
  color: var(--c-muted);
  transition: background .15s ease, color .15s ease;
}
.lang-switch button[aria-pressed="true"] { background: var(--c-accent); color: #fff; }
.lang-switch button:not([aria-pressed="true"]):hover { color: var(--c-text); }

.progress {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-chrome);
  height: 3px; background: var(--c-border);
}
.progress > i {
  display: block; height: 100%; transform-origin: 0 50%;
  transform: scaleX(var(--p, 0));
  background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2));
  transition: transform var(--dur) var(--ease);
}
.counter {
  position: fixed; left: calc(var(--rail) / 2); bottom: 1rem; z-index: var(--z-chrome);
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: .5rem;
  font-variant-numeric: tabular-nums; font-size: .74rem;
  color: var(--c-muted); transition: opacity .25s ease;
}
.counter .c-part {
  padding: .16rem .5rem; border-radius: .35rem;
  background: var(--c-surface); border: 1px solid var(--c-border);
  writing-mode: vertical-rl; max-inline-size: 26ch;
  padding: .5rem .16rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Chrome sits in the rails, so idle mode only hides the cursor. */
body.chrome-idle { cursor: none; }
.topbar:focus-within { opacity: 1 !important; }

.toast {
  position: fixed; right: calc(var(--rail) / 2); top: 50%; transform: translate(50%, -50%);
  writing-mode: vertical-rl;
  z-index: var(--z-toast);
  padding: .55rem 1.1rem; border-radius: .6rem;
  background: var(--c-text); color: var(--c-surface);
  font-size: .82rem; font-weight: 650; letter-spacing: .02em;
  box-shadow: var(--sh-2);
}

/* blank-screen mode (presenter "b") */
body.is-blank .viewport { visibility: hidden; }
body.is-blank { background: #000; }

/* ═══════════════════════════════════════════════════════════════════════════
   7 · DRAWERS + HELP
   ═══════════════════════════════════════════════════════════════════════════ */
.drawer {
  position: fixed; inset: 0 var(--rail) 0 auto; z-index: var(--z-drawer);
  width: min(42rem, 40vw, 100vw);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--c-surface);
  border-left: 1px solid var(--c-border);
  box-shadow: -1.4rem 0 4rem rgb(15 23 42 / .16);
  visibility: hidden;
  transform: translateX(100%);
  transition: transform 320ms var(--ease), visibility 0s linear 320ms;
}
.drawer.is-open {
  visibility: visible; transform: none;
  transition: transform 320ms var(--ease), visibility 0s;
}
.drawer-head {
  display: flex; align-items: center; gap: .75rem;
  padding: 1.1rem 1.25rem 1.1rem 1.75rem;
  border-bottom: 1px solid var(--c-border);
}
.drawer-head h2 {
  flex: 1; font-size: .78rem; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase; color: var(--c-muted);
}
.drawer-head h2:focus { outline: none; }
.drawer-body {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 1.6rem 1.75rem 3rem;
  scrollbar-gutter: stable;
}
.drawer-foot {
  padding: .7rem 1.75rem; border-top: 1px solid var(--c-border);
  font-size: .72rem; color: var(--c-muted);
}
kbd {
  display: inline-block; padding: .08em .38em; margin: 0 .1em;
  border-radius: .3em; border: 1px solid var(--c-border-2);
  border-bottom-width: 2px; background: var(--c-surface-2);
  font-size: .88em; color: var(--c-text-2);
}

/* deep-dive drawer typography — sized for the reader, in rem not --u */
.dd-slide {
  font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--c-accent); margin-bottom: .4rem;
}
.dd-title {
  font-size: 1.32rem; font-weight: 700; line-height: 1.24;
  letter-spacing: -.02em; margin-bottom: 1.3rem;
}
.dd-body { font-size: .93rem; line-height: 1.68; color: var(--c-text-2); }
.dd-body > * + * { margin-top: 1.05rem; }
.dd-body p { max-width: none; }
.dd-body .b-h { font-size: 1.02rem; color: var(--c-text); margin-top: 1.6rem; }
.dd-body .b-p { font-size: 1em; }
.dd-body .b-ul, .dd-body .b-ol { gap: .6rem; font-size: 1em; }
.dd-body .b-ul.is-2col, .dd-body .b-ol.is-2col { grid-template-columns: 1fr; }
.dd-body .b-defs { font-size: .95em; gap: .55rem 1.1rem; }
.dd-body .b-table { font-size: .84em; }
.dd-body .b-table th, .dd-body .b-table td { padding: .5rem .7rem; }
.dd-body .b-code { padding: .9rem 1.1rem; border-radius: .55rem; }
.dd-body .b-code pre code { font-size: .8rem; }
.dd-body .b-callout { font-size: .95em; padding: .9rem 1.1rem; border-radius: .55rem;
                      border-left-width: 4px; gap: .75rem; }
.dd-body .b-stats { gap: .8rem; }
.dd-body .stat { padding: .8rem .9rem; border-radius: .55rem; }
.dd-body .stat-v { font-size: 1.3rem; }
.dd-body .stat-l { font-size: .72rem; }
.dd-body .b-cols { grid-template-columns: 1fr; gap: 1rem; }
.dd-body .b-quote { font-size: 1em; padding-left: 1rem; border-left-width: 4px; }

/* index drawer */
.idx-sec {
  display: flex; align-items: baseline; gap: .6rem;
  font-size: .72rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase;
  color: var(--c-muted); margin: 1.7rem 0 .55rem;
}
.idx-sec:first-child { margin-top: 0; }
.idx-sec-n {
  display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem;
  border-radius: .4rem; background: var(--c-surface-2); border: 1px solid var(--c-border);
  color: var(--c-accent); font-size: .68rem;
}
.idx-list { display: grid; gap: 1px; }
.idx-item {
  display: grid; grid-template-columns: 2.1rem 1fr; align-items: baseline;
  gap: .5rem; width: 100%; text-align: left;
  padding: .48rem .6rem; border-radius: .45rem;
  font-size: .88rem; color: var(--c-text-2);
  transition: background .12s ease, color .12s ease;
}
.idx-item:hover { background: var(--c-surface-2); color: var(--c-text); }
.idx-item[aria-current] {
  background: var(--c-accent-soft); color: var(--c-accent); font-weight: 650;
}
.idx-n { font-size: .74rem; color: var(--c-muted); font-variant-numeric: tabular-nums; }
.idx-item[aria-current] .idx-n { color: var(--c-accent); }

.scrim {
  position: fixed; inset: 0; z-index: var(--z-scrim);
  background: rgb(2 6 23 / .45);
  opacity: 0; transition: opacity .28s ease;
}
.scrim.is-on { opacity: 1; }

/* help overlay */
.help {
  position: fixed; inset: 0; z-index: var(--z-help);
  display: grid; place-items: center;
  background: rgb(2 6 23 / .55);
  padding: 2rem;
}
.help-panel {
  width: min(38rem, 100%); max-height: 84vh; overflow-y: auto;
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: 1rem; box-shadow: var(--sh-2);
  padding: 1.75rem 2rem 2rem;
}
.help-panel h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.2rem; }
.help-grid {
  display: grid; grid-template-columns: auto 1fr; gap: .6rem 1.4rem;
  font-size: .88rem; align-items: baseline;
}
.help-grid dt { white-space: nowrap; }
.help-grid dd { color: var(--c-text-2); }
.help-close { margin-top: 1.6rem; display: flex; justify-content: flex-end; }
.btn {
  padding: .5rem 1.1rem; border-radius: .55rem;
  background: var(--c-accent); color: #fff; font-size: .86rem; font-weight: 650;
}

#print-root { display: none; }

/* ═══════════════════════════════════════════════════════════════════════════
   8 · NARROW SCREENS — stop being a deck, become a readable document
   ═══════════════════════════════════════════════════════════════════════════ */
@media (max-width: 860px), (max-height: 420px) {
  body { overflow: auto; }
  :root { --u: 3.55px; }
  .viewport { position: static; display: block; overflow: visible; background: var(--c-bg); }
  .stage {
    width: 100%; height: auto; min-height: 100svh;
    border-radius: 0; box-shadow: none;
  }
  .slide {
    position: relative; inset: auto;
    opacity: 1 !important; transform: none !important; pointer-events: auto;
    display: block; padding: 5rem 1.15rem 5rem; font-size: 1rem;
  }
  .slide[data-layout="title"], .slide[data-layout="section"] { padding-inline: 1.15rem; }
  .slide[data-layout="title"] .s-title { font-size: 2.1rem; }
  .slide[data-layout="section"] .s-title { font-size: 1.9rem; }
  .s-head { margin-bottom: 1.4rem; }
  .s-title { font-size: 1.6rem; }
  .s-body { overflow: visible; display: block; }
  .s-body > * + * { margin-top: 1.25rem; }
  .s-foot { margin-top: 1.6rem; padding-top: .9rem; font-size: .8rem; }
  .b-cols, .b-ul.is-2col, .b-ol.is-2col, .b-stats { grid-template-columns: 1fr; }
  /* No definite body height here, so diagrams go back to width-driven sizing. */
  .b-diagram { grid-template-rows: auto auto; }
  .b-diagram .diagram { height: auto; max-height: none; }
  .drawer { width: 100%; }
  :root { --rail: 0px; }
  .topbar { bottom: auto; left: 0; width: auto; height: auto;
            flex-direction: row; justify-content: flex-end; padding: .6rem .8rem;
            background: color-mix(in srgb, var(--c-bg) 88%, transparent);
            backdrop-filter: blur(8px); }
  .topbar-spacer, .rail-sep { display: none; }
  .lang-switch { flex-direction: row; width: auto; }
  .lang-switch button { padding: .3rem .6rem; font-size: .72rem; }
  .brand { display: none; }
  .counter { left: auto; right: 1rem; bottom: .85rem; transform: none; flex-direction: row; }
  .counter .c-part { writing-mode: horizontal-tb; max-inline-size: 22ch; padding: .16rem .5rem; }
  .toast { right: auto; left: 50%; top: auto; bottom: 2.4rem; transform: translateX(-50%);
           writing-mode: horizontal-tb; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   9 · PRINT — one slide per page
   ═══════════════════════════════════════════════════════════════════════════ */
@media print {
  @page { size: 297mm 167mm; margin: 0; }
  :root { --rail: 0px; --vgap: 0px; }

  .topbar, .brand, .drawer, .scrim, .help, .progress, .counter,
  .toast, .skip-link, #live { display: none !important; }

  html, body { background: #fff; overflow: visible; height: auto; }
  .viewport { position: static; display: block; overflow: visible; background: #fff; }
  .stage { display: none; }
  #print-root { display: block; }

  .print-slide {
    position: relative; inset: auto;
    width: 100vw; height: 100vh;
    opacity: 1 !important; transform: none !important;
    display: grid; overflow: hidden;
    break-after: page; page-break-after: always; break-inside: avoid;
    box-shadow: none; border: 0; border-radius: 0;
    background: #fff;
  }
  .print-slide:last-child { break-after: auto; page-break-after: auto; }
  .b-callout, .b-table, .b-code, .b-diagram, .b-stats { break-inside: avoid; }

  .print-slide, .b-callout, .b-code, .b-table thead th,
  .stat, .diagram .n-bg, .diagram .zone, .b-diagram {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  :root[data-theme="dark"] { color-scheme: light; }
}

@media (prefers-reduced-motion: reduce) {
  .slide { transition-duration: 1ms; transform: none !important; }
  .drawer, .scrim, .progress > i { transition-duration: 1ms; }
}
</style>

/* ═══════════════════════════════════════════════════════════════════════════
   A · UTILITIES

/** Hyperscript. Text children go in via textContent — no escaping surface. */
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  var kids = Array.prototype.slice.call(arguments, 2);

    { type: 'p', text: x('There\'s a hidden story in this order. First you learn to *talk* to Postgres (SQL). Then you learn to give it *correct data* (types, constraints, modeling). Then you learn to make it *fast* (indexes, EXPLAIN). Then you learn to keep it *correct* (transactions, MVCC). Then you learn to keep it *alive* (WAL, backup, replication, vacuum). And finally you make it do *new things* (JSONB, search, vectors).', 'Is order mein ek chhupi hui kahani hai. Pehle tum Postgres se *baat karna* seekhte ho (SQL). Phir tum use *sahi data* dena seekhte ho (types, constraints, modeling). Phir tum use *tez* karna seekhte ho (index, EXPLAIN). Phir tum use *sahi* rakhna seekhte ho (transactions, MVCC). Phir tum use *zinda* rakhna seekhte ho (WAL, backup, replication, vacuum). Aur aakhir mein tum usse *nayi cheezein* karwaate ho (JSONB, search, vectors).') },

{
  id: 'why-db-problem', section: 'why', layout: 'diagram',
  kicker: x('The very first question', 'Sabse pehla sawaal'),
  title: x('Why do databases exist at all?', 'Database exist hi kyun karta hai?'),
  blocks: [
    { type: 'diagram', id: 'whyDb', caption: x('A kirana store\'s bookkeeping: a register, then Excel, and everything works — until two people start writing at the same time.', 'Ek kirana store ka hisaab-kitaab: register se Excel tak sab chalta hai — jab tak do log ek saath likhne na lagein.') }
  ],
  takeaway: x('A database is not a file. It is a *program* that enforces rules and order on top of files.', 'Database ek file nahi hai. Wo ek *program* hai jo file par rules aur order enforce karta hai.'),
  info: [
    { type: 'p', text: x('Picture a kirana store in Surat. At first a paper register is enough. Then the owner moves to Excel. Then two people start entering data at once — one opens the file, the other opens it too, both save, and one person\'s work is lost. Then "final_final2.xlsx" appears. Then the power cuts out halfway through an entry. Then someone types "pending" into the amount column. Those four problems — concurrency, a single source of truth, crash safety and data validity — are exactly the four things databases were built for.', 'Socho Surat ka ek kirana store. Shuru mein ek register kaafi hai. Phir malik Excel par aa jaata hai. Phir do log ek saath entry karne lagte hain — ek ne file kholi, doosre ne bhi kholi, dono ne save kiya, ek ka kaam gum. Phir "final_final2.xlsx" ban jaata hai. Phir bijli chali jaati hai aadhi entry par. Phir kisi ne amount mein "pending" likh diya. Ye chaaron dikkatein — concurrency, ek hi sach, crash safety, aur data validity — hi wo chaar cheezein hain jinke liye database bana hai.') },
    { type: 'p', text: x('So the most accurate definition of a database is: **a program that imposes discipline on your data, on your behalf**. It says: "amount will always be a number", "every order will have a customer", "either both entries happen or neither does", "whatever was committed survives a crash", "a hundred people can write at once and nothing breaks".', 'Isliye database ki sabse sahi definition ye hai: **ek aisa program jo tumhare data par tumhare liye discipline lagata hai**. Wo kehta hai: "amount hamesha number hoga", "har order ka ek customer hoga", "ya dono entries hongi ya ek bhi nahi", "crash ke baad bhi jo commit ho chuka wo rahega", "sau log ek saath likhein to bhi kuchh kharaab nahi hoga".') },
    { type: 'callout', tone: 'trap', title: x('The beginner\'s misconception', 'Beginner ki galatfehmi'), text: x('That a database is "a place to keep data". No — the place is the disk. The database is the *rules and guarantees* that run on top of that place. That\'s why two databases can treat the same data completely differently.', 'Ki database "data rakhne ki jagah" hai. Nahi — jagah to disk hai. Database wo *rules aur guarantees* hai jo us jagah ke upar chalte hain. Isiliye do database ek hi data ko bilkul alag tarah se sambhalte hain.') }
  ]
},
{
  id: 'rdbms', section: 'why', layout: 'default',
  kicker: x('Core vocabulary', 'Buniyaadi shabd'),
  title: x('Relational databases and SQL — what they actually mean', 'Relational database aur SQL — matlab kya hai'),
  blocks: [
    { type: 'defs', items: [
      { k: 'Relation', v: x('A maths word, not "relationship". One relation = one **table**.', 'Maths wala shabd hai, "relationship" nahi. Ek relation = ek **table**.') },
      { k: 'Table', v: x('A set of rows and columns. Like an Excel sheet, but every column has a fixed type.', 'Rows aur columns ka set. Jaise ek Excel sheet, par har column ka type fix.') },
      { k: 'Row (tuple)', v: x('One real thing — a customer, an order, a payment.', 'Ek asli cheez — ek customer, ek order, ek payment.') },
      { k: 'Column (attribute)', v: x('One property of that thing, with a fixed type.', 'Us cheez ki ek property, ek fixed type ke saath.') },
      { k: 'RDBMS', v: x('Relational Database Management System — the software that runs all this. PostgreSQL, MySQL, Oracle, SQL Server.', 'Relational Database Management System — wo software jo ye sab chalata hai. PostgreSQL, MySQL, Oracle, SQL Server.') },
      { k: 'SQL', v: x('Structured Query Language — the language for talking to a database. Often pronounced "sequel".', 'Structured Query Language — database se baat karne ki bhasha. "Sequel" bolte hain.') },
      { k: 'Declarative', v: x('You say **what you want**; the database decides **how to get it**.', 'Tum batate ho **kya chahiye**, **kaise laana hai** wo database decide karta hai.') }
    ] },
    { type: 'callout', tone: 'key', text: x('"Relational" does not mean "the tables are connected to each other" — that\'s a side effect. It means data is stored as a mathematical *relation* (a set of rows), and set-theory operations (join, union, filter) apply to it.', '"Relational" ka matlab "tables aapas mein jude hain" nahi hai — wo ek side-effect hai. Matlab hai ki data ek gaNitiya *relation* (rows ka set) ke roop mein rakha jaata hai, aur us par set-theory ke operations (join, union, filter) lagte hain.') }
  ],
  takeaway: x('SQL is declarative — that is its power, and it\'s why you must understand the planner.', 'SQL declarative hai — yahi uski taakat hai aur yahi wajah hai ki planner samajhna zaroori hai.'),
  info: [
    { type: 'p', text: x('In practice, declarative means: you write `SELECT * FROM orders WHERE customer_id = 5`. You don\'t say "open the index, walk to the leaf, then fetch the row from the heap". Postgres decides. That\'s why two people can write completely different-looking queries that produce the same execution plan — and why a tiny change can sometimes flip the plan and make a query 1000x slower.', 'Declarative hone ka matlab practical zindagi mein ye hai: tum `SELECT * FROM orders WHERE customer_id = 5` likhte ho. Tum ye nahi batate ki "pehle index kholo, phir leaf tak jao, phir heap se row uthao". Postgres khud decide karta hai. Isi wajah se do log bilkul alag dikhne wali queries likh sakte hain aur dono ka execution plan same ho sakta hai — aur isi wajah se kabhi-kabhi ek chhota sa badlav plan ko bilkul badal deta hai aur query 1000x slow ho jaati hai.') },
    { type: 'p', text: x('That\'s why EXPLAIN gets a whole section in this course. In a declarative language you don\'t control performance directly — you can only give the planner better information and better paths (indexes, statistics). Not understanding the planner is like shooting arrows in the dark.', 'Yahi wajah hai ki is course mein **EXPLAIN** ek poora section hai. Declarative bhasha mein performance ka control tumhare paas seedha nahi hota — tum sirf planner ko behtar information aur behtar raaste (indexes, statistics) de sakte ho. Planner ko na samajhna matlab andhere mein teer chalana.') },
    { type: 'p', text: x('One more thing: SQL is an ANSI standard, but every database adds its own flavour. `LIMIT` exists in Postgres/MySQL; Oracle used `FETCH FIRST`. So "I know SQL" and "I know PostgreSQL" are different claims — about 70% is shared, 30% is database-specific.', 'Ek aur baat: SQL ek ANSI standard hai, par har database usme apna tadka daalta hai. `LIMIT` Postgres/MySQL mein hai, Oracle mein `FETCH FIRST` tha. Isiliye "SQL aata hai" aur "PostgreSQL aata hai" alag cheezein hain — 70% common hai, 30% database-specific.') }
  ]
},
{
  id: 'pg-history', section: 'why', layout: 'default',
  kicker: x('A little history — the useful kind', 'Thodi kahani — kaam ki kahani'),
  title: x('Where PostgreSQL came from, and what its character is', 'PostgreSQL kahan se aaya, aur uska character kya hai'),
  blocks: [
    { type: 'steps', items: [
      { label: '1973 · Ingres', text: x('Michael Stonebraker\'s first relational DB project at UC Berkeley', 'UC Berkeley mein Michael Stonebraker ka pehla relational DB project') },
      { label: '1986 · POSTGRES', text: x('"Post-Ingres" — the goal was extensibility: add your own data types and index types', '"Post-Ingres" — maqsad tha extensibility: naye data types, naye index types khud add kar sako') },
      { label: '1994 · Postgres95', text: x('The old query language was replaced with SQL', 'Purani query language hatakar SQL daala gaya') },
      { label: '1996 · PostgreSQL', text: x('Renamed; became a community-driven open-source project. No single company owns it.', 'Naam badla, community-driven open source project bana. Koi ek company maalik nahi.') },
      { label: '2010 · Streaming replication', text: 'Serious production HA' },
      { label: '2014 · JSONB', text: x('Postgres became "it can do NoSQL too"', 'Postgres "NoSQL bhi kar leta hai" ban gaya') },
      { label: x('2021 onwards · Vectors, logical replication, partitioning', '2021 se · Vectors, logical replication, partitioning'), text: x('And now, thanks to pgvector, the default database of the AI stack', 'Aur ab pgvector ki wajah se AI stack ka default database') }
    ] },
    { type: 'callout', tone: 'tip', title: 'Wait... really?', text: x('It\'s pronounced "post-gres-cue-el", not "post-gray-ess-cue-el" — the core team spells this out officially. And its true character is still the 1986 one — **extensibility**. PostGIS, pgvector, TimescaleDB all exist because back in 1986 someone decided users should be able to add their own types and index methods.', 'Naam ka uchcharan "post-gres-cue-el" hai, "post-gray-ess-cue-el" nahi. Core team ne ise officially likha hai. Aur asli character wahi 1986 wala hai — **extensibility**. PostGIS, pgvector, TimescaleDB — ye sab isiliye possible hain kyunki 1986 mein kisi ne socha tha ki users apne types aur index methods khud daalenge.') }
  ],
  takeaway: x('Postgres\'s DNA = "extensible correctness". That\'s why it changes slowly but doesn\'t break.', 'Postgres ka DNA = "extensible correctness". Isiliye wo dheere badalta hai par tootta nahi.'),
  info: [
    { type: 'p', text: x('This history is useful because it explains Postgres\'s *behaviour*. Postgres has a reputation for being "correct by default" — it doesn\'t silently accept bad data (MySQL historically did), it doesn\'t silently truncate, and it takes standards seriously. The flip side is that Postgres sometimes feels strict: "ERROR: column X must appear in the GROUP BY clause". That strictness is a feature, not a bug.', 'Ye itihaas isliye kaam ka hai kyunki isse Postgres ke *behaviour* ki wajah samajh aati hai. Postgres ki reputation "correct-by-default" ki hai — wo chupchaap galat data accept nahi karta (MySQL historically karta tha), wo silently truncate nahi karta, aur wo standards ko seriously leta hai. Iska ulta side ye hai ki Postgres kabhi-kabhi strict lagta hai: "ERROR: column X must appear in the GROUP BY clause". Wo strictness feature hai, bug nahi.') },
    { type: 'p', text: x('Second: Postgres is not any one company\'s product. There is no "PostgreSQL Inc.". A global community develops it, under the PostgreSQL License (MIT-like, very liberal). That\'s why AWS (RDS/Aurora), Google (Cloud SQL/AlloyDB), Microsoft, Supabase, Neon and Crunchy can all build products on the same engine. Vendor lock-in risk is lower here than anywhere else.', 'Doosri baat: Postgres kisi ek company ka product nahi hai. Koi "PostgreSQL Inc." nahi hai. Development ek global community karti hai, license PostgreSQL License hai (MIT jaisi, bahut liberal). Isi wajah se AWS (RDS/Aurora), Google (Cloud SQL/AlloyDB), Microsoft, Supabase, Neon, Crunchy — sab isi engine par apne products bana paate hain. Vendor lock-in ka risk sabse kam yahin hai.') },
    { type: 'p', text: x('Third, the thing people miss: Postgres version numbers matter. A major version ships every year (usually September–October) — 14, 15, 16, 17, 18... Each one improves the planner and adds features. Each major version is supported for about 5 years. Staying 3–4 years behind in production slowly becomes performance and security debt.', 'Teesri baat jo log miss karte hain: Postgres ka version number matlab rakhta hai. Har saal (usually September–October) ek major version aata hai — 14, 15, 16, 17, 18... Har major version ke saath planner behtar hota hai, naye features aate hain. Har major version ~5 saal support milti hai. Production mein 3-4 saal purane version par rehna dheere-dheere ek performance aur security debt ban jaata hai.') }
  ]
},

  takeaway: x('If you don\'t know which database to choose — choose Postgres. It is a very safe default.', 'Agar tumhein pata nahi ki kaunsa database chunein — Postgres chuno. Ye ek bahut safe default hai.'),
  info: [
    { type: 'p', text: x('A practical lesson senior engineers learn early: every new datastore puts a permanent tax on your team — backups, monitoring, upgrades, expertise, failure modes. One Redis + one Elasticsearch + one MongoDB + one Postgres = four backup strategies and four on-call playbooks. Postgres\'s "does everything reasonably well" often delivers more value than "does one thing extremely well".', 'Ek practical baat jo senior engineers jaldi seekh jaate hain: har naya datastore tumhari team par ek permanent tax lagata hai — backup, monitoring, upgrades, expertise, failure modes. Ek Redis + ek Elasticsearch + ek MongoDB + ek Postgres = chaar alag backup strategies, chaar alag on-call playbooks. Postgres ki "sab kuchh theek-thaak kar leta hai" wali khoobi aksar "ek cheez bahut acchhi karta hai" se zyada value deti hai.') },
    { type: 'p', text: x('The opposite is also true: Postgres is not the best at everything. For very heavy analytics (complex aggregation over hundreds of millions of rows), ClickHouse or BigQuery is better. For ultra-low-latency caching, Redis is better. For very large full-text search with facets, Elasticsearch is better. But make those decisions when Postgres actually breaks, not in advance.', 'Iska ulta bhi sach hai: Postgres har cheez ka best nahi hai. Bahut heavy analytics (crore rows par complex aggregation) ke liye ClickHouse ya BigQuery behtar hai. Ultra-low-latency caching ke liye Redis behtar hai. Bahut bade full-text search + facets ke liye Elasticsearch behtar hai. Par ye faisle tab lene chahiye jab Postgres asal mein phat jaaye, pehle se nahi.') }
  ]
},

  takeaway: x('Every tool has a pain point. Postgres\'s is *predictable* — and this deck teaches it.', 'Har auzaar ka ek dard hota hai. Postgres ka dard *predictable* hai — aur ye is deck mein padha rahe hain.'),
  info: [
    { type: 'p', text: x('This is the most honest slide in the deck. Every tutorial tells you how great Postgres is. Nobody tells you what will wake you up at 3 a.m. In practice, 90% of Postgres incidents are one of these: (1) a long-running transaction blocked autovacuum and the table bloated, (2) connections ran out because there was no pooler, (3) someone ran `ALTER TABLE` in production and locked the whole table, (4) a query\'s plan changed because statistics were stale.', 'Ye slide is deck ki sabse imaandaar slide hai. Har tutorial tumhe batata hai ki Postgres kitna badhiya hai. Koi ye nahi batata ki 3 baje raat ko tumhe kaunsi cheez uthaegi. Practical taur par 90% Postgres incidents inme se ek hote hain: (1) ek lambi chalti transaction ne autovacuum rok diya aur table bloat ho gaya, (2) connections khatam ho gaye kyunki pooler nahi tha, (3) kisi ne production mein `ALTER TABLE` maara aur poore table par lock lag gaya, (4) ek query ka plan badal gaya kyunki statistics purani thi.') },

{
  id: 'pg-arch', section: 'setup', layout: 'diagram',
  kicker: x('What\'s happening inside', 'Andar kya chal raha hai'),
  title: x('Postgres\'s process model — a mental picture', 'Postgres ka process model — ek mental picture'),
  blocks: [
    { type: 'diagram', id: 'pgArch' }
  ],
  takeaway: x('One connection = one OS process. That one line explains the whole connection-pooling story.', 'Ek connection = ek OS process. Ye ek line poori connection-pooling ki kahani samjha deti hai.'),
  info: [
    { type: 'p', text: x('Postgres uses a "process per connection" model, not "thread per connection". When your app connects, the postmaster `fork`s a new OS process. That process has its own memory (work_mem, temp buffers) and shares memory (shared_buffers, WAL buffers, locks) with everyone else.', 'Postgres "process per connection" model use karta hai, "thread per connection" nahi. Jab tumhara app connect karta hai, postmaster ek naya OS process `fork` karta hai. Us process ke paas apni memory hoti hai (work_mem, temp buffers) aur wo shared memory (shared_buffers, WAL buffers, locks) sabke saath share karta hai.') },
    { type: 'p', text: x('This has three big consequences. **One**: opening a connection is expensive (~1–5 ms plus memory), so apps need a connection pool. **Two**: at 500+ connections, context switching and memory overhead kill the server — hence PgBouncer. **Three**: one query runs in one process, so by default a query uses one CPU core (parallel query relaxes this somewhat, but default parallelism is limited).', 'Iske teen bade natije hain. **Ek**: connection banana mehnga hai (~1-5 ms + memory). Isiliye app ko connection pool chahiye. **Do**: 500+ connections par context switching aur memory overhead server ko maar dete hain — isiliye PgBouncer. **Teen**: ek query ek hi process mein chalti hai, isiliye ek query by default ek CPU core use karti hai (parallel query is limitation ko thoda tod deti hai, par default parallelism seemit hai).') },
    { type: 'p', text: x('Remember the background processes too, because every production problem is linked to one of them: **checkpointer** (writes dirty pages to disk, can cause spikes), **background writer** (writes gradually), **WAL writer** (durability), **autovacuum launcher** (cleans dead tuples — the hero of section 18), and the **stats collector / logger**.', 'Background processes bhi yaad rakho, kyunki har production problem inmein se kisi se judi hoti hai: **checkpointer** (dirty pages disk par likhta hai, spike la sakta hai), **background writer** (dheere-dheere likhta hai), **WAL writer** (durability), **autovacuum launcher** (dead tuples saaf karta hai — section 18 ka hero), aur **stats collector / logger**.') },
    { type: 'callout', tone: 'tip', title: x('See it yourself', 'Khud dekho'), text: x('On Linux, run `ps aux | grep postgres`. You\'ll see the postmaster, checkpointer, walwriter, autovacuum launcher, and one backend process per active connection. This diagram is live on your machine.', 'Linux par `ps aux | grep postgres` chalao. Tumhe postmaster, checkpointer, walwriter, autovacuum launcher, aur har active connection ka backend process dikhega. Ye diagram tumhare machine par live hai.') }
  ]
},

{

  takeaway: x('One connection = one database. That\'s why "multi-tenant" setups usually use schemas, not separate databases.', 'Ek connection = ek database. Isiliye "multi-tenant" ke liye aksar schema use hota hai, alag database nahi.'),
  info: [
    { type: 'p', text: x('This hierarchy is like an apartment complex in Surat. **Cluster** = the whole society (one gate, one watchman). **Database** = one building — a resident of building A can\'t walk straight into a flat in building B. **Schema** = one floor of that building. **Table** = one flat on that floor. `search_path` = the list given to the watchman: "if someone only says a flat number, check these floors".', 'Ye hierarchy ek Surat ke apartment complex jaisi hai. **Cluster** = poori society (ek hi gate, ek hi watchman). **Database** = ek building — building A ka koi resident building B ke flat mein seedha nahi ja sakta. **Schema** = us building ka ek floor. **Table** = us floor ka ek flat. `search_path` = watchman ko di gayi list ki "agar koi sirf flat number bole to kaunse floor par dhoondho".') },
    { type: 'p', text: x('A decision that comes up often: in a multi-tenant SaaS, a separate database per customer, a separate schema, or one schema with a `tenant_id` column? Answer: **a `tenant_id` column in most cases** (shared schema) — because 5,000 schemas means 5,000 × every table in the catalog, and migration hell. Separate schemas are fine when tenants are few (say < 100) and genuinely need different structures. Separate databases when you need legal/compliance isolation.', 'Practical faisla jo aksar aata hai: multi-tenant SaaS mein har customer ke liye alag database, alag schema, ya ek hi schema mein `tenant_id` column? Jawab: **zyadatar cases mein `tenant_id` column** (shared schema) — kyunki 5000 schemas ka matlab hai 5000 × har table ka catalog entry, aur migrations ka narak. Alag schema tab theek hai jab tenants kam hon (say < 100) aur unhe sachmuch alag structure chahiye ho. Alag database tab jab legal/compliance isolation chahiye.') },
    { type: 'callout', tone: 'trap', title: x('A dangerous default', 'Ek khatarnaak default'), text: x('Before Postgres 15, every user had CREATE rights on the `public` schema. From 15 onwards that\'s off — which is why following old tutorials gives "permission denied for schema public". Fix: `GRANT CREATE ON SCHEMA public TO app;` or create your own schema.', 'Postgres 15 se pehle `public` schema par har user ko CREATE ka haq tha. 15 ke baad ye band ho gaya — isiliye purane tutorials follow karte waqt "permission denied for schema public" aata hai. Fix: `GRANT CREATE ON SCHEMA public TO app;` ya apna schema banao.') }
  ]
},
{
  id: 'table-anatomy', section: 'basics', layout: 'diagram',
  kicker: x('Foundations', 'Buniyaad'),
  title: x('What a table really is', 'Ek table asal mein kya hai'),
  blocks: [
    { type: 'diagram', id: 'tableAnatomy' }
  ],
  takeaway: x('Rows have no order. The order you happen to see is coincidence — only `ORDER BY` is a guarantee.', 'Rows ka koi order nahi hota. Jo order tumhe dikhta hai wo ittefaaq hai — `ORDER BY` hi guarantee hai.'),
  info: [
    { type: 'p', text: x('This slide breaks a very deep misconception. Beginners think a table is a list of rows sitting in order, and a new INSERT goes "at the bottom". Wrong. Postgres keeps rows in a **heap** — an unordered pile. When a row is UPDATEd it leaves its spot and moves somewhere else (MVCC, section 17). When VACUUM runs, freed space gets reused.', 'Ye slide ek bahut gehri galatfehmi todti hai. Beginners sochte hain ki table ek list hai jismein rows ek kram mein pari hain, aur naya INSERT "neeche" jaata hai. Ye galat hai. Postgres rows ko **heap** mein rakhta hai — ek bin-tarteeb dher. Jab koi row UPDATE hoti hai to wo apni jagah chhod kar kahin aur chali jaati hai (MVCC, section 17). Jab VACUUM chalta hai to khaali jagah dobara bhar jaati hai.') },
    { type: 'p', text: x('The direct consequence: if you didn\'t write `ORDER BY` and the query happened to come back in the right order, that was **pure coincidence**. Add an index, get a new plan, or a parallel scan — and the order changes. This causes lots of production bugs: "but it was working before".', 'Iska seedha natija: agar tumne `ORDER BY` nahi likha aur query kabhi sahi order mein aa gayi, to wo **sirf ittefaaq** tha. Ek index ban gaya, ya plan badal gaya, ya parallel scan ho gaya — order badal jaayega. Production mein iske kaaran bahut bugs aate hain: "pehle to theek chal raha tha".') },
    { type: 'callout', tone: 'trap', title: x('Another myth', 'Ek aur myth'), text: x('`SELECT *` is not "faster". It fetches more columns, sends more over the network, and makes index-only scans impossible. Name your columns in production code.', '`SELECT *` "tez" nahi hota. Wo zyada columns laata hai, zyada network bhejta hai, aur index-only scan ko na-mumkin bana deta hai. Production code mein columns ka naam likho.') }
  ]
},
{

  title: x('SQL\'s four families — DDL, DML, DCL, TCL', 'SQL ke chaar parivaar — DDL, DML, DCL, TCL'),
  blocks: [
    { type: 'table', compact: true,

      rows: [

        ['**DML**', 'Data Manipulation — data', 'INSERT, UPDATE, DELETE, SELECT*, MERGE', x('The app\'s everyday work', 'Rozana app ka kaam')],
        ['**DCL**', 'Data Control — permissions', 'GRANT, REVOKE', 'Security setup'],
        ['**TCL**', 'Transaction Control', 'BEGIN, COMMIT, ROLLBACK, SAVEPOINT', x('To make several steps into one unit', 'Kai steps ko ek banane ke liye')]
      ] },
    { type: 'callout', tone: 'key', title: x('A big Postgres strength', 'Postgres ki ek badi khoobi'), text: x('In Postgres, **DDL is transactional too**. So `BEGIN; ALTER TABLE ...; CREATE INDEX ...; ROLLBACK;` — and nothing happened. MySQL can\'t do this (DDL causes an implicit commit). That makes Postgres migrations quite safe: if a migration fails halfway, it all rolls back.', 'Postgres mein **DDL bhi transactional hai**. Matlab `BEGIN; ALTER TABLE ...; CREATE INDEX ...; ROLLBACK;` — aur kuchh nahi hua. MySQL mein ye nahi hota (DDL implicit commit karta hai). Isiliye Postgres migrations kaafi safe hote hain: migration beech mein fail ho to poora rollback.') },
    { type: 'p', tone: 'muted', text: x('*SELECT is sometimes called DQL (Data Query Language) separately. The name doesn\'t matter — understanding the job does.', '*SELECT ko kabhi-kabhi DQL (Data Query Language) alag se bhi kehte hain. Naam se farak nahi padta — kaam samajhna zaroori hai.') }
  ],
  takeaway: x('Transactional DDL is one of Postgres\'s big hidden gifts — it makes migrations far safer.', 'Transactional DDL Postgres ka ek bada chhupa hua tohfa hai — migrations isse bahut surakshit ho jaate hain.')
},

{
  id: 'identifiers-case', section: 'basics', layout: 'default',
  kicker: x('A hidden trap', 'Ek chhupa hua jaal'),
  title: x('Naming rules — and the danger of double quotes', 'Naam rakhne ke niyam — aur double quotes ka khatra'),
  blocks: [
    { type: 'ul', items: [
      x('Postgres folds unquoted identifiers to **lowercase**. `CREATE TABLE Users` actually creates `users`.', 'Postgres bina quote wale identifiers ko **lowercase** bana deta hai. `CREATE TABLE Users` asal mein `users` banata hai.'),
      x('But `CREATE TABLE "Users"` creates a different table literally named `Users` — and now you must **always** write `"Users"`.', 'Lekin `CREATE TABLE "Users"` ek alag table banata hai jiska naam sachmuch `Users` hai — aur ab **hamesha** `"Users"` likhna padega.'),
      x('ORMs (like TypeORM, some Prisma configs) create quoted CamelCase names — that\'s why `SELECT * FROM users` in psql says "relation does not exist".', 'ORMs (jaise TypeORM, Prisma ke kuchh configs) quoted CamelCase naam bana dete hain — yahi wajah hai ki psql mein `SELECT * FROM users` "relation does not exist" deta hai.'),
      x('Don\'t use reserved words (`user`, `order`, `group`, `table`) as column/table names. `order` is especially painful — write `orders`.', 'Reserved words (`user`, `order`, `group`, `table`) column/table ka naam mat banao. `order` khaas taur par bahut sataata hai — `orders` likho.')
    ] },
    { type: 'code', lang: 'sql', lines: [
      x('CREATE TABLE Users (id int);      -- creates: users', "CREATE TABLE Users (id int);      -- banta hai: users"),
      x('SELECT * FROM USERS;              -- works (users)', 'SELECT * FROM USERS;              -- chalega (users)'),
      '',
      x('CREATE TABLE "Users" (id int);    -- creates: Users (a different table!)', 'CREATE TABLE "Users" (id int);    -- banta hai: Users (alag table!)'),
      'SELECT * FROM Users;              -- ERROR: relation "users" does not exist',
      x('SELECT * FROM "Users";            -- works', 'SELECT * FROM "Users";            -- chalega')
    ] },
    { type: 'callout', tone: 'warn', title: x('The golden rule', 'Sunehra niyam'), text: x('Always use lowercase `snake_case`: `order_items`, `created_at`, `customer_id`. Never use double quotes. This one decision saves you a lifetime of pain.', 'Hamesha `snake_case` lowercase use karo: `order_items`, `created_at`, `customer_id`. Kabhi double quotes mat use karo. Ye ek faisla tumhe zindagi bhar ke dard se bacha dega.') }

  takeaway: x('lowercase snake_case. Plural table names, singular column names. That\'s it.', 'lowercase snake_case. Table ke naam bahuvachan (plural), column ke naam ekvachan. Bas.')

{
  id: 'query-pipeline', section: 'basics', layout: 'diagram',
  kicker: x('What happens inside', 'Andar kya hota hai'),
  title: x('When you press Enter — a query\'s full journey', 'Jab tum Enter dabate ho — query ka poora safar'),
  blocks: [
    { type: 'diagram', id: 'queryPipeline' }
  ],
  takeaway: x('The planner is where queries that "look the same" end up 1000x apart in time.', 'Planner hi wo jagah hai jahan "ek jaisi dikhti" queries ka time 1000x alag ho jaata hai.'),
  info: [
    { type: 'p', text: x('In detail: the **Parser** turns SQL text into a syntax tree; syntax errors are caught here. The **Analyzer** links names to real tables/columns (this is where "column does not exist" comes from). The **Rewriter** replaces views with their definitions and applies rules. The **Planner/Optimizer** builds many possible plans, estimates each one\'s cost from statistics, and picks the cheapest. The **Executor** runs that plan.', 'Detail mein: **Parser** SQL text ko syntax tree banata hai aur syntax errors yahin pakde jaate hain. **Analyzer** naamon ko asli tables/columns se jodta hai (yahan "column does not exist" aata hai). **Rewriter** views ko unki definition se badalta hai aur rules lagata hai. **Planner/Optimizer** kai possible plans banata hai, har ek ki cost estimate karta hai statistics se, aur sabse sasta chunta hai. **Executor** us plan ko chalata hai.') },
    { type: 'p', text: x('A practical point: parsing and planning also take time (typically 0.1–2 ms). For small queries that run very often, that overhead matters — which is why **prepared statements** exist; they reuse the plan. Most drivers (JDBC, node-postgres with named queries, psycopg) do this automatically.', 'Ek practical baat: parse aur plan karne mein bhi time lagta hai (typically 0.1–2 ms). Chhoti, bahut baar chalne wali queries ke liye ye overhead matter karta hai — isi liye **prepared statements** exist karte hain, jo plan ko reuse karte hain. Zyadatar drivers (JDBC, node-postgres with named queries, psycopg) ye automatically karte hain.') },
    { type: 'p', text: x('And a deeper point that will matter a lot later: the planner decides based on **statistics**, not the actual data. If `ANALYZE` hasn\'t run, or the data distribution suddenly changes, the planner can pick a bad plan — and a query that took 5 ms yesterday takes 5 seconds today. This "plan flip" is a classic production incident.', 'Aur ek gehri baat jo aage bahut kaam aayegi: planner ka faisla **statistics** par based hai, actual data par nahi. Agar `ANALYZE` nahi chala, ya data ka distribution achanak badal gaya, to planner galat plan chun sakta hai — aur query jo kal 5 ms mein chal rahi thi wo aaj 5 second legi. Ye "plan flip" production ka ek classic incident hai.') }
  ]
},
{
  id: 'catalog', section: 'basics', layout: 'default',
  kicker: x('What people miss', 'Jo log miss karte hain'),
  title: x('Postgres stores itself in tables — the system catalog', 'Postgres khud ko tables mein rakhta hai — system catalog'),
  blocks: [
    { type: 'cols', ratio: '1-1', cols: [
      [ { type: 'p', text: x('Every table, column, index, constraint and function is a row in Postgres\'s own tables. These live in the `pg_catalog` schema and you can read them with ordinary SQL.', 'Har table, column, index, constraint, function — sab kuchh Postgres ke apne tables mein rows hain. Ye tables `pg_catalog` schema mein hain aur tum inhe normal SQL se padh sakte ho.') },
        { type: 'defs', items: [
          { k: 'pg_class', v: x('one row per table, index, view', 'har table, index, view ki ek row') },
          { k: 'pg_attribute', v: x('one row per column', 'har column ki ek row') },
          { k: 'pg_index', v: x('details of each index', 'har index ki detail') },
          { k: 'pg_constraint', v: 'PK, FK, CHECK, UNIQUE' },
          { k: 'pg_stat_*', v: 'live statistics — activity, tables, indexes' },
          { k: 'information_schema', v: x('SQL-standard, portable version (slower, but the same in every DB)', 'SQL-standard, portable version (dheema par har DB mein same)') }
        ] } ],
      [ { type: 'code', lang: 'sql', lines: [
          x('-- largest tables', '-- sabse bade tables'),
          'SELECT relname,',
          '       pg_size_pretty(pg_total_relation_size(oid)) AS size',
          'FROM pg_class',
          "WHERE relkind = 'r'",
          'ORDER BY pg_total_relation_size(oid) DESC',
          'LIMIT 10;',
          '',
          x('-- who is running what right now', '-- abhi kaun kya chala raha hai'),
          'SELECT pid, state, query_start, left(query, 60)',
          'FROM pg_stat_activity',
          "WHERE state <> 'idle';"
        ] } ]
    ] }
  ],
  takeaway: x('The catalog = Postgres\'s mirror. Every debugging session starts here.', 'Catalog = Postgres ka aaina. Har debugging session yahin se shuru hoti hai.'),
  info: [
    { type: 'p', text: x('At first this feels like trivia, but in production it\'s your biggest weapon. When someone says "the database is slow", your first step isn\'t opening a GUI — it\'s checking `pg_stat_activity` (who\'s running what, for how long), `pg_stat_user_tables` (which table is scanned how much, when it was vacuumed), `pg_stat_user_indexes` (which index has never been used), and `pg_locks` (who is stuck on whom).', 'Ye cheez pehli baar mein trivia lagti hai, par ye production mein tumhara sabse bada hathiyaar hai. Jab koi kahe "database slow hai", tumhara pehla kadam GUI kholna nahi hota — `pg_stat_activity` dekhna hota hai (kaun kya chala raha hai, kitni der se), `pg_stat_user_tables` (kaunsa table kitna scan ho raha hai, kab vacuum hua), `pg_stat_user_indexes` (kaunsa index kabhi use hi nahi hua), aur `pg_locks` (kaun kis par atka hai).') },
    { type: 'p', text: x('A "wait, really?" moment: `pg_class` contains a row describing `pg_class` itself. Postgres describes itself in its own format — a beautiful bootstrap, and the reason extensions can add new types and index methods.', 'Ek "wait, really?" moment: `pg_class` khud `pg_class` mein ek row rakhta hai. Postgres apne aap ko apne hi format mein describe karta hai — ye bootstrap ek khoobsurat design hai, aur isi wajah se extensions naye types aur index methods add kar paate hain.') }
  ]
},

  info: [
    { type: 'p', text: x('Short answers: (1) concurrency, a single source of truth, crash safety, data validity. (2) You say "what", Postgres decides "how" — the problem is that performance isn\'t under your direct control, so you have to learn EXPLAIN. (3) `\\d orders` shows the table\'s structure; `\\x` lays output out column by column. (4) Society → building → floor → flat. (5) No — `CREATE TABLE Orders` without quotes creates `orders`, and no table named `"Orders"` exists. (6) Parse → analyze → rewrite → **plan** → execute; performance is decided at the plan stage.', 'Jawab, chhote roop mein: (1) concurrency, single source of truth, crash safety, data validity. (2) Tum "kya" batate ho, Postgres "kaise" decide karta hai — dikkat ye ki performance tumhare seedhe control mein nahi, isiliye EXPLAIN seekhna padta hai. (3) `\\d orders` table ka dhaancha dikhata hai; `\\x` output ko column-wise laga deta hai. (4) Society → building → floor → flat. (5) Nahi chalega — `CREATE TABLE Orders` bina quotes ke `orders` banata hai, aur `"Orders"` naam ki koi table hai hi nahi. (6) Parse → analyze → rewrite → **plan** → execute; performance plan stage par.') }
