/* ═══════════════ 4 · DATA TYPES ═══════════════════════════════════════════ */
{
  id: 'types-why', section: 'types', layout: 'default',
  kicker: 'Big Idea',
  title: x('Choosing a type = half of design', 'Type chunna = design ka aadha kaam'),
  blocks: [
    { type: 'p', tone: 'lead', text: x('A column\'s type doesn\'t just say "what gets stored". It also decides **what cannot be stored**, how much space it takes, which comparisons work, and whether indexes work.', 'Column ka type sirf "kya store hoga" nahi batata. Wo ye bhi tay karta hai ki **kya store nahi ho sakta**, kitni jagah lagegi, kaunsi comparisons chalengi, aur index kaam karega ya nahi.') },
    { type: 'ul', items: [
      { text: x('**Blocks bad data** — "abc" simply cannot go into an `integer` column', '**Galat data rokta hai** — `integer` column mein "abc" ja hi nahi sakta'), icon: 'ok' },
      { text: x('**Saves space** — `smallint` is 2 bytes, `bigint` 8 bytes. Over 100 million rows that\'s a 600 MB difference', '**Jagah bachata hai** — `smallint` 2 byte, `bigint` 8 byte. 10 crore rows par ye 600 MB ka farak hai'), icon: 'ok' },
      { text: x('**Unlocks operations** — `+ interval` works on a `date`, not on `text`', '**Operations kholta hai** — `date` par `+ interval` chalega, `text` par nahi'), icon: 'ok' },
      { text: x('**Expensive to change later** — changing the type on a big table = full table rewrite + lock', '**Baad mein badalna mehnga hai** — bade table par type change = poora table rewrite + lock'), icon: 'no' }
    ] },
    { type: 'callout', tone: 'key', text: x('Postgres has 80+ built-in types, and you can create your own. But **10 types are enough** for daily work. Know those well; look up the rest when needed.', 'Postgres mein 80+ built-in types hain, aur tum apne bhi bana sakte ho. Par rozana kaam ke liye **10 types kaafi hain**. Unhe achhe se jaano, baaki zaroorat par dekhna.') }
  ],
  takeaway: x('A type = a constraint you get for free. It\'s the cheapest validation there is.', 'Type = ek constraint jo free mein milta hai. Sabse sasti validation yahi hai.')
},
{
  id: 'types-numeric', section: 'types', layout: 'default',
  kicker: 'Numbers',
  title: x('Numeric types — and the biggest money trap', 'Numeric types — aur paise ka sabse bada jaal'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Type', 'Size', 'Range / Precision', x('When used', 'Kab use')],
      rows: [
        ['smallint', '2 B', '−32,768 … 32,767', x('Small counts, age, rating', 'Chhoti ginti, age, rating')],
        ['integer / int', '4 B', '±2.1 billion', 'Default choice for counts'],
        ['bigint', '8 B', '±9.2 quintillion', x('IDs — always', 'IDs — hamesha')],
        ['numeric(p,s)', 'variable', x('Exact, up to 131072 digits', 'Exact, 131072 digits tak'), x('**Money, quantities, any exact value**', '**Paisa, quantity, koi bhi exact value**')],
        ['real / float4', '4 B', '~6 digits, approximate', 'Science, sensor data'],
        ['double precision', '8 B', '~15 digits, approximate', 'Science, ML features'],
        ['serial / bigserial', '—', x('Old-style auto-increment', 'Purana auto-increment'), x('Legacy — use `IDENTITY` now', 'Legacy — ab `IDENTITY` use karo')]
      ] },
    { type: 'callout', tone: 'trap', title: x('Never store money as float', 'Paise ko kabhi float mat banao'), text: x('In floating point, `0.1 + 0.2` is `0.30000000000000004`. After a hundred thousand transactions your ledger won\'t reconcile and nobody will know why. **Always use `numeric(12,2)` for money** — or store it as an integer number of paise.', '`0.1 + 0.2` float mein `0.30000000000000004` hota hai. Ek lakh transactions ke baad tumhara ledger mismatch karega aur koi nahi samjhega kyun. **Paise ke liye hamesha `numeric(12,2)`** — ya paise (integer) mein store karo.') }
  ],
  takeaway: x('ID = bigint. Money = numeric. Counts = integer. Science = double precision.', 'ID = bigint. Paisa = numeric. Ginti = integer. Science = double precision.'),
  info: [
    { type: 'p', text: x('Why float is wrong, in one line: a computer can\'t represent 0.1 exactly in binary, just as we can\'t write 1/3 exactly in decimal (0.3333...). Every calculation accumulates a little error. `numeric` stores decimal digits, so it stays exact — the price is speed (it\'s not a native CPU type; it\'s computed in software).', 'Float kyun galat hai, ek line mein: computer 0.1 ko binary mein theek-theek nahi likh sakta, jaise hum 1/3 ko decimal mein theek-theek nahi likh sakte (0.3333...). Har calculation mein thoda error jamta jaata hai. `numeric` ise decimal digits mein store karta hai, isliye exact rehta hai — keemat ye ki wo dheema hai (CPU ka native type nahi hai, software mein calculate hota hai).') },
    { type: 'p', text: x('`bigint` vs `integer` for IDs — a real story that keeps repeating. The integer limit is 2.1 billion. Sounds like a lot. But IDs leave gaps (failed transactions don\'t give sequence values back), and a busy table can get there in 3–4 years. The day it does, you have to rewrite the whole table — hours of downtime on a big table. **Use `bigint` from day one.** 4 extra bytes cost nothing.', '`bigint` vs `integer` for IDs — ek asli kahani jo bar-bar dohraayi jaati hai. Integer ki limit 2.1 billion hai. Sunne mein bahut lagta hai. Par IDs gaps chhodte hain (failed transactions sequence value waapas nahi karte), aur ek busy table 3-4 saal mein wahan pahunch sakta hai. Jis din pahunchti hai, us din poora table rewrite karna padta hai — jo ek bade table par ghanton ka downtime hai. **Shuru se `bigint` lo.** 4 extra bytes ki keemat kuchh bhi nahi hai.') },
    { type: 'p', text: x('`numeric(10,2)` means: 10 digits in total, 2 of them after the decimal point. So the max is 99,999,999.99. If your business deals in crores, use `numeric(14,2)`. And plain `numeric` with no precision has no limit — flexible, but a bit slower and it can\'t block bad data.', '`numeric(10,2)` ka matlab: kul 10 digits, jinme 2 decimal ke baad. Matlab max 99,999,999.99. Agar tumhara business crore-crore ka hai to `numeric(14,2)` lo. Aur agar tum bina precision ke sirf `numeric` likho, to koi limit nahi hoti — flexible par thoda dheema aur galat data ko rok nahi paata.') }
  ]
},
{
  id: 'types-text', section: 'types', layout: 'default',
  kicker: 'Text',
  title: x('text, varchar, char — and a surprise', 'text, varchar, char — aur ek surprise'),
  blocks: [
    { type: 'cols', ratio: '3-2', cols: [
      [ { type: 'defs', items: [
          { k: 'text', v: x('A string with no limit. **The default choice.**', 'Bina limit ka string. **Default choice.**') },
          { k: 'varchar(n)', v: x('At most n characters. Go over the limit and you get an error.', 'Max n characters. Limit cross karo to error.') },
          { k: 'varchar', v: x('Exactly the same as `text`.', '`text` ke bilkul barabar.') },
          { k: 'char(n)', v: x('Always n characters — pads with spaces if shorter. **Never use it.**', 'Hamesha n characters — chhota ho to space se bhar deta hai. **Kabhi use mat karo.**') },
          { k: 'citext', v: x('Extension — case-insensitive text (great for emails)', 'Extension — case-insensitive text (email ke liye badhiya)') }
        ] },
        { type: 'callout', tone: 'tip', title: 'Wait... really?', text: x('In Postgres, `text` and `varchar(500)` have **exactly the same performance**. Internally both use the same storage. `varchar(n)` is just like a CHECK constraint. This differs from MySQL — there it mattered, which is why people write varchar without thinking.', 'Postgres mein `text` aur `varchar(500)` ki **performance bilkul same hai**. Andar dono ek hi storage use karte hain. `varchar(n)` sirf ek CHECK constraint jaisa hai. Ye MySQL se alag hai — wahan farak padta tha, aur isi wajah se log bina soche varchar likhte hain.') } ],
      [ { type: 'code', lang: 'sql', lines: [
          x('-- Best', '-- Behtareen'),
          'name  text NOT NULL,',
          '',
          x('-- Fine, if it\'s a business rule', '-- Theek, agar business rule hai'),
          'gst_no varchar(15),',
          '',
          x('-- For business rules, CHECK is better', '-- Business rule ke liye CHECK behtar hai'),
          'phone text NOT NULL',
          "  CHECK (phone ~ '^[0-9]{10}$'),",
          '',
          x('-- Never write this', '-- Ye kabhi mat likhna'),
          "code char(10)  -- 'AB' -> 'AB        '"
        ] } ]
    ] }
  ],
  takeaway: x('`text` + a `CHECK` constraint > `varchar(n)`. And never `char(n)`.', '`text` + `CHECK` constraint > `varchar(n)`. Aur `char(n)` kabhi nahi.'),
  info: [
    { type: 'p', text: x('A real-world issue: changing `varchar(50)` to `varchar(100)` is cheap in Postgres 9.2+ (just a catalog update), but changing `varchar(100)` to `varchar(50)` requires scanning the whole table. And in most cases the business rule keeps changing ("names up to 50 characters" — why? who said so?). So taking `text` and writing the real business rules as `CHECK` is the more honest design.', 'Ek asli-duniya ki dikkat: `varchar(50)` ko `varchar(100)` karna Postgres 9.2+ mein sasta hai (sirf catalog update), par `varchar(100)` ko `varchar(50)` karna poora table scan maangta hai. Aur zyadatar cases mein business rule badalta rehta hai ("naam 50 characters tak" — kyun? kisne kaha?). Isiliye `text` lena aur asli business rules ko `CHECK` mein likhna zyada honest design hai.') },
    { type: 'p', text: x('`char(n)` padding causes real bugs. Put "AB" into `char(10)` and you get back "AB        ". Then comparisons break, `||` concatenation breaks, JSON gets extra spaces. It has no benefit — it\'s a leftover from the COBOL era.', '`char(n)` ka padding asli bugs banata hai. `char(10)` mein "AB" daalo aur wapas nikaalo to "AB        " milta hai. Phir comparison mein gadbad, phir `||` concatenation mein gadbad, phir JSON mein extra spaces. Iska koi faayda nahi hai — ye COBOL-era ka bacha hua type hai.') },
    { type: 'p', text: x('For email: string comparison in Postgres is case-sensitive, so `Rahul@x.com` and `rahul@x.com` are two different values and a UNIQUE constraint will allow both. Two fixes: (a) use the `citext` extension, or (b) keep `text` and create `CREATE UNIQUE INDEX ON users (lower(email))`. The second is more common and more portable.', 'Email ke liye: Postgres mein string comparison case-sensitive hai, isliye `Rahul@x.com` aur `rahul@x.com` do alag values hain aur UNIQUE constraint dono allow kar dega. Do hal hain: (a) `citext` extension use karo, ya (b) `text` rakho aur `CREATE UNIQUE INDEX ON users (lower(email))` banao. Doosra tareeka zyada common aur portable hai.') }
  ]
},
{
  id: 'types-datetime', section: 'types', layout: 'default',
  kicker: x('Date and time — where most mistakes happen', 'Date aur time — sabse zyada galtiyan yahan hoti hain'),
  title: x('timestamptz is the right answer (almost always)', 'timestamptz hi sahi jawab hai (lagbhag hamesha)'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Type', x('What it stores', 'Kya rakhta hai'), 'Verdict'],
      rows: [
        ['`date`', x('Just the date (2026-09-21)', 'Sirf taareekh (2026-09-21)'), x('Birthdays, invoice dates — fine', 'Birthday, invoice date — theek')],
        ['`time`', x('Just the time, no date', 'Sirf samay, bina date'), x('Rarely useful', 'Kam kaam ka')],
        ['`timestamp`', x('Date + time, **no time zone**', 'Date + time, **bina timezone**'), x('⚠ Dangerous — "3 o\'clock where?"', '⚠ Khatarnaak — "kaunsa 3 baje?"')],
        ['`timestamptz`', 'Date + time, **timezone-aware**', x('✓ Default — use this', '✓ Default — yahi use karo')],
        ['`interval`', x('A span of time (3 days 4 hours)', 'Samay ka tukda (3 days 4 hours)'), x('Excellent for calculations', 'Calculations ke liye shaandaar')]
      ] },
    { type: 'code', lang: 'sql', lines: [
      "SET timezone = 'Asia/Kolkata';",
      'SELECT now();                        -- 2026-09-21 14:30:00+05:30',
      x('SELECT now() - interval \'7 days\';    -- one week ago', "SELECT now() - interval '7 days';    -- ek hafta pehle"),
      x('SELECT age(now(), birthdate);        -- age', 'SELECT age(now(), birthdate);        -- umar'),
      x('SELECT date_trunc(\'month\', placed_at);  -- first day of the month', "SELECT date_trunc('month', placed_at);  -- mahine ki pehli taareekh"),
      x('SELECT extract(dow FROM placed_at);     -- day of week (0=Sunday)', "SELECT extract(dow FROM placed_at);     -- hafte ka din (0=Sunday)"),
      '',
      x('-- One day\'s data — the right way', '-- Ek din ka data — sahi tareeka'),
      "WHERE placed_at >= '2026-09-21' AND placed_at < '2026-09-22'"
    ] },
    { type: 'callout', tone: 'trap', title: x('The biggest trap', 'Sabse bada jaal'), text: x('`timestamptz` does **not store** a time zone! It stores the value in UTC and shows it in your session\'s time zone when read. `timestamp` (without tz) does no UTC conversion at all — it\'s just an ambiguous number. That\'s why `timestamptz` is better: it always points to one real instant.', '`timestamptz` timezone **store nahi** karta! Wo value ko UTC mein rakhta hai aur padhte waqt tumhare session ke timezone mein dikhata hai. `timestamp` (bina tz) UTC conversion bilkul nahi karta — wo sirf ek dhundhla number hai. Isiliye `timestamptz` behtar hai: wo hamesha ek asli kshan (instant) ko point karta hai.') }
  ],
  takeaway: x('Always `timestamptz` in apps. Keep the server time zone in UTC. Convert at display time.', 'App mein hamesha `timestamptz`. Server ka timezone UTC rakho. Display ke waqt convert karo.'),
  info: [
    { type: 'p', text: x('Think of it with a Surat example. You wrote "meeting at 3 o\'clock". Someone in Surat came at 3, someone in London came at 3 — at two different instants. That is `timestamp without time zone`: it just says "3 o\'clock", not where. `timestamptz` says "the instant that was 3 o\'clock in Surat" — i.e. 09:30 UTC. Look at it from anywhere in the world and it is the same instant.', 'Ise ek Surat wali misaal se samjho. Tumne likha "meeting 3 baje". Ab Surat wala 3 baje aaya, London wala 3 baje aaya — dono alag kshan par. Ye `timestamp without time zone` hai: sirf "3 baje" likha hai, kis jagah ka nahi. `timestamptz` ye kehta hai "wo kshan jo Surat mein 3 baje tha" — matlab 09:30 UTC. Ab duniya mein kahin se bhi dekho, wo ek hi kshan hai.') },
    { type: 'p', text: x('Practical rules: (1) `created_at timestamptz NOT NULL DEFAULT now()` — in every table. (2) Keep the server and database time zone in UTC. (3) Convert to the user\'s time zone in the **display layer**, not the database. (4) Only use `timestamp` (without tz) when time zones genuinely don\'t apply — like "an alarm at 9 a.m. every day", which only means something in local time.', 'Practical rules: (1) `created_at timestamptz NOT NULL DEFAULT now()` — har table mein. (2) Server aur database ka timezone UTC rakho. (3) User ke timezone mein conversion **display layer** par karo, database mein nahi. (4) Sirf tab `timestamp` (bina tz) use karo jab timezone ka concept hi na ho — jaise "har din subah 9 baje alarm" jo local time mein hi matlab rakhta hai.') },
    { type: 'p', text: x('A performance point that will matter later: `WHERE date_trunc(\'day\', placed_at) = \'2026-09-21\'` will **not** use an index, because a function is applied to the column. Write a range instead: `placed_at >= \'2026-09-21\' AND placed_at < \'2026-09-22\'`. This tiny change can make a 100x difference.', 'Ek performance baat jo aage kaam aayegi: `WHERE date_trunc(\'day\', placed_at) = \'2026-09-21\'` index use **nahi** karegi kyunki column par function laga hai. Uski jagah range likho: `placed_at >= \'2026-09-21\' AND placed_at < \'2026-09-22\'`. Ye ek chhota sa badlav 100x farak la sakta hai.') }
  ]
},
{
  id: 'types-ids', section: 'types', layout: 'default',
  kicker: 'IDs',
  title: x('What type should a primary key be — serial, identity or UUID?', 'Primary key kis type ki ho — serial, identity, ya UUID?'),
  blocks: [
    { type: 'table', compact: true,
      head: [x('Approach', 'Tareeka'), 'Syntax', x('Upside', 'Fayda'), x('Downside', 'Nuksaan')],
      rows: [
        ['serial', '`id serial PRIMARY KEY`', x('Old, seen everywhere', 'Purana, sab jagah dikhta hai'), x('Sequence-ownership quirks, not standard', 'Sequence ownership ka jhol, standard nahi')],
        ['IDENTITY', '`id bigint GENERATED ALWAYS AS IDENTITY`', x('**SQL standard, clean, recommended**', '**SQL standard, saaf, recommended**'), x('A bit longer to write', 'Thoda lamba likhna padta hai')],
        ['UUID v4', '`id uuid DEFAULT gen_random_uuid()`', x('Client can generate it, unguessable, merge-friendly', 'Client bana sakta hai, guess-proof, merge-friendly'), x('Random = poor index locality, 16 bytes', 'Random = index locality kharab, 16 bytes')],
        ['UUID v7', x('`uuidv7()` (PG 18) or an extension', '`uuidv7()` (PG 18) ya extension'), x('Time-ordered — UUID + good locality', 'Time-ordered — UUID + achhi locality'), x('New, not available everywhere', 'Naya, sab jagah available nahi')],
        ['Natural key', '`gst_no text PRIMARY KEY`', x('No extra column', 'Extra column nahi'), x('The business value changes — dangerous', 'Business value badalti hai — khatarnaak')]
      ] },
    { type: 'callout', tone: 'key', title: 'Default salaah', text: x('`bigint GENERATED ALWAYS AS IDENTITY` — 90% of cases. Use UUIDs when: distributed systems, the ID is exposed in URLs, or you need client-side ID generation. And if you use UUIDs, use **v7**, not v4.', '`bigint GENERATED ALWAYS AS IDENTITY` — 90% cases. UUID tab jab: distributed systems, ID ko URL mein expose karna hai, ya client-side ID generation chahiye. Aur UUID lo to **v7** lo, v4 nahi.') }
  ],
  takeaway: x('A surrogate key (a meaningless ID) is always safe. A natural key is fine until the business changes — and it will.', 'Surrogate key (meaningless ID) hamesha safe hai. Natural key tab tak theek jab tak business use badalta nahi — aur wo badalta hai.'),
  info: [
    { type: 'p', text: x('Understand UUID v4\'s "index locality" problem. A B-tree index is sorted. Sequential IDs (1, 2, 3...) always go to the last page of the index — that page stays hot in RAM and inserts are cheap. Random UUIDs land on a random page every time — so each insert may need to pull a page from disk, and there are more page splits. At high write volume that\'s a 2–3x difference. UUID v7 puts a timestamp at the front, so it behaves like a sequential ID — the best of both worlds.', 'UUID v4 ka "index locality" wala nuksaan samjho. B-tree index sorted hota hai. Sequential IDs (1, 2, 3...) hamesha index ke aakhri page par jaate hain — wo page RAM mein garam rehta hai, insert sasta hota hai. Random UUIDs har baar index ke kisi bhi random page par jaate hain — matlab har insert par ek naya page disk se laana pad sakta hai, aur page splits zyada hote hain. Bade write volume par ye 2-3x ka farak hai. UUID v7 mein timestamp shuru mein hota hai, isliye wo sequential jaisa behave karta hai — dono duniya ka best.') },
    { type: 'p', text: x('`GENERATED ALWAYS` vs `GENERATED BY DEFAULT`: `ALWAYS` means you can\'t insert an ID manually (to override you must write `OVERRIDING SYSTEM VALUE`). `BY DEFAULT` allows manual inserts. `ALWAYS` is safer, but a little painful during data migrations. Most teams take `ALWAYS` and override during migrations.', '`GENERATED ALWAYS` vs `GENERATED BY DEFAULT`: `ALWAYS` ka matlab tum manually ID nahi daal sakte (override karne ke liye `OVERRIDING SYSTEM VALUE` likhna padega). `BY DEFAULT` manual insert allow karta hai. `ALWAYS` zyada safe hai, par data migration ke waqt thoda dard deta hai. Zyadatar teams `ALWAYS` lekar migration mein override kar leti hain.') },
    { type: 'callout', tone: 'trap', title: x('A common misconception', 'Ek aam ghalatfehmi'), text: x('That sequence gaps are a "bug". They aren\'t. If a transaction rolls back, its ID number is not returned — sequences are non-transactional (deliberately, otherwise every insert would take a lock). So never read an ID as "how many records exist".', 'Ki sequence gaps "bug" hain. Nahi. Agar ek transaction rollback ho jaaye to us ID ka number waapas nahi milta — sequence non-transactional hai (jaan-boojhkar, warna har insert ek lock lega). Isiliye ID ka matlab "kitne records hain" kabhi mat samjho.') }
  ]
},
{
  id: 'types-bool-enum', section: 'types', layout: 'default',
  kicker: 'Boolean, enum, lookup',
  title: x('How to build a status column — three ways', 'Status column kaise banaoge — teen raaste'),
  blocks: [
    { type: 'cols', ratio: '1-1', cols: [

      [ { type: 'table', compact: true,
          head: ['', 'CHECK', 'ENUM', 'Lookup'],
          rows: [
            [x('Adding a value', 'Value add karna'), 'ALTER (lock)', x('ADD VALUE (easy)', 'ADD VALUE (aasan)'), 'INSERT (trivial)'],
            [x('Removing a value', 'Value hatana'), 'ALTER', x('**Very hard**', '**Bahut mushkil**'), 'DELETE'],
            [x('Extra data (label, colour)', 'Extra data (label, rang)'), x('No', 'Nahi'), x('No', 'Nahi'), x('✓ Yes', '✓ Haan')],
            ['Storage', '~8 B', x('4 B (smallest)', '4 B (sabse chhota)'), '~8 B'],
            [x('Populate a UI dropdown', 'UI dropdown se populate'), x('No', 'Nahi'), x('Hard', 'Mushkil'), x('✓ Easy', '✓ Aasan')]

        { type: 'callout', tone: 'tip', title: 'Rule of thumb', text: x('Values will never change and carry no extra data → **ENUM**. Values change occasionally → **CHECK**. Values need a label/order/colour or are managed from a UI → **lookup table**.', 'Values kabhi nahi badlengi aur unke saath koi extra data nahi → **ENUM**. Values kabhi-kabhi badlengi → **CHECK**. Values ke saath label/order/color chahiye ya UI se manage hongi → **lookup table**.') } ]

},
{
  id: 'types-arrays', section: 'types', layout: 'default',
  kicker: x('Postgres\'s own flavour', 'Postgres ka apna tadka'),
  title: x('Arrays — useful, but with traps', 'Arrays — kaam ke hain, par jaal bhi hain'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      'CREATE TABLE posts (',
      '  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,',
      '  title text NOT NULL,',
      '  tags  text[] NOT NULL DEFAULT \'{}\'',
      ');',
      '',
      "INSERT INTO posts (title, tags) VALUES",

      "  ('Surat food',    '{travel,food}');",
      '',

      "SELECT * FROM posts WHERE tags @> ARRAY['db'];     -- contains",

      'SELECT unnest(tags) AS tag, count(*) FROM posts GROUP BY 1;',

    { type: 'callout', tone: 'warn', title: x('When *not* to use an array', 'Kab array *nahi*'), text: x('When you need more data about the item (when it was added, by whom), when you need an FK on it, or when you want to join on it. Then it needs a **separate table**, not an array. An array is denormalization — use it deliberately.', 'Jab us cheez ke saath aur data chahiye (kab jud gaya, kisne joda), jab tumhe us par FK chahiye, ya jab tum usi cheez se relate karke join karna chahte ho. Tab wo ek **alag table** chahiye, array nahi. Array ek denormalization hai — soch-samajhkar lo.') }

{
  id: 'types-misc', section: 'types', layout: 'default',

{
  id: 'types-checkpoint', section: 'types', layout: 'section',
  kicker: 'Checkpoint 2 · Stop & Think',
  title: x('Review this schema — there are at least 6 mistakes', 'Ye schema review karo — kam se kam 6 galtiyan hain'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      'CREATE TABLE Payments (',
      '  id          serial PRIMARY KEY,',
      '  user_id     int,',
      '  amount      float,',
      '  currency    char(3),',
      '  status      varchar(20),',
      '  paid_at     timestamp,',
      '  card_number varchar(16),',
      '  notes       varchar(255)',
      ');'
    ] },
    { type: 'p', tone: 'muted', text: x('Write your answer before looking. Then press `i` to compare.', 'Jawab dekhne se pehle likho. Phir `i` dabakar milao.') }
  ],
  info: [
    { type: 'p', text: x('**Mistakes:** (1) `Payments` — CamelCase table name; should be lowercase `payments`. (2) `bigint GENERATED ALWAYS AS IDENTITY` instead of `serial` — and an `int` ID runs out at 2.1 billion. (3) `user_id int` — missing FK (`REFERENCES users(id)`), missing `NOT NULL`, and should be `bigint`. (4) `amount float` — **never store money as float**; `numeric(12,2) NOT NULL CHECK (amount >= 0)`. (5) `char(3)` — a padding type; `text` + `CHECK (currency ~ \'^[A-Z]{3}$\')`. (6) `status varchar(20)` — missing CHECK constraint or enum, and missing NOT NULL + DEFAULT. (7) `timestamp` — should be `timestamptz`. (8) `card_number` — **this should not be in the database at all** (PCI compliance); keep only the last 4 digits + a token. (9) `notes varchar(255)` — `text` is better; 255 has no business meaning (it\'s an old MySQL habit).', '**Galtiyan:** (1) `Payments` — CamelCase table naam; lowercase `payments` hona chahiye. (2) `serial` ki jagah `bigint GENERATED ALWAYS AS IDENTITY` — aur `int` ID 2.1 billion par khatam ho jaayega. (3) `user_id int` — FK missing (`REFERENCES users(id)`) aur `NOT NULL` missing, aur `bigint` hona chahiye. (4) `amount float` — **paisa float mein kabhi nahi**; `numeric(12,2) NOT NULL CHECK (amount >= 0)`. (5) `char(3)` — padding wala type; `text` + `CHECK (currency ~ \'^[A-Z]{3}$\')`. (6) `status varchar(20)` — CHECK constraint ya enum missing, aur NOT NULL + DEFAULT missing. (7) `timestamp` — `timestamptz` hona chahiye. (8) `card_number` — **ye database mein hona hi nahi chahiye** (PCI compliance); sirf last 4 digits + token rakho. (9) `notes varchar(255)` — `text` behtar; 255 ka koi business matlab nahi (ye MySQL ki purani aadat hai).') },
    { type: 'p', text: x('If you caught 5 or more — excellent, you own the types section. Fewer than 3 — revisit this section\'s slides, especially numeric and timestamptz.', 'Agar tumne 5 ya zyada pakde — bahut badhiya, types ka section tumhara ho gaya. Agar 3 se kam — is section ke slides dobara dekho, khaas taur par numeric aur timestamptz wale.') }
  ]
},

{

},
{
  id: 'ddl-constraints', section: 'ddl', layout: 'default',
  kicker: 'Constraints',
  title: x('Five constraints — and what each one protects against', 'Paanch constraints — aur har ek kis cheez se bachata hai'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Constraint', x('What it blocks', 'Kya rokta hai'), x('Example', 'Misaal')],
      rows: [
        ['`NOT NULL`', x('Missing values', 'Khaali value'), '`email text NOT NULL`'],
        ['`UNIQUE`', 'Duplicate', x('`email text UNIQUE` — no two customers share an email', '`email text UNIQUE` — do customers ek email par nahi')],
        ['`PRIMARY KEY`', x('NOT NULL + UNIQUE, only one per table', 'NOT NULL + UNIQUE, ek hi per table'), '`PRIMARY KEY (id)`'],

      ] },
    { type: 'callout', tone: 'key', title: x('The biggest lesson', 'Sabse bada sabak'), text: x('Validation in application code **is not enough**. Because: another service will write too, a migration script will write, someone will run a manual UPDATE from psql, and the app will have bugs. The database is the last wall — and it never forgets.', 'Application code mein validation **kaafi nahi hai**. Kyunki: doosri service bhi likhegi, migration script bhi likhegi, koi psql se manual UPDATE bhi maarega, aur app mein bug bhi hoga. Database aakhri deewar hai — aur wo kabhi bhoolti nahi.') },

{
  id: 'ddl-fk', section: 'ddl', layout: 'default',
  kicker: 'Foreign keys',
  title: x('The ON DELETE decision — this needs thought', 'ON DELETE ka faisla — ye sochna padta hai'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Option', x('When the parent is deleted', 'Parent delete hone par'), x('When', 'Kab')],
      rows: [
        ['`NO ACTION` (default)', x('Error if child rows exist (deferred check)', 'Error, agar child rows hain (deferred check)'), 'Safe default'],
        ['`RESTRICT`', x('Error, immediately', 'Error, turant'), x('When deletion should never happen', 'Jab delete hona hi nahi chahiye')],
        ['`CASCADE`', x('Children are deleted too', 'Children bhi delete ho jaate hain'), x('When a child means nothing without its parent (order_items)', 'Jab child ka bina parent koi matlab nahi (order_items)')],
        ['`SET NULL`', x('The child\'s FK column becomes NULL', 'Child ka FK column NULL ho jaata hai'), 'Optional relationship (assigned_to)'],
        ['`SET DEFAULT`', x('The child\'s FK takes its default value', 'Child ka FK default value le leta hai'), x('Rarely', 'Bahut kam')]
      ] },
    { type: 'code', lang: 'sql', lines: [
      x('-- if the order is deleted, its items are meaningless', '-- order delete hua to uske items ka koi matlab nahi'),
      'order_id bigint NOT NULL REFERENCES orders(id) ON DELETE CASCADE',
      '',

      '',
      x('-- if the employee leaves, the task becomes unassigned', '-- employee gaya to task unassigned ho jaaye'),
      'assigned_to bigint REFERENCES employees(id) ON DELETE SET NULL'
    ] },
    { type: 'callout', tone: 'warn', title: x('The hidden danger of CASCADE', 'CASCADE ka chhupa khatra'), text: x('`ON DELETE CASCADE` can chain: delete one customer → 50,000 orders → 300,000 order_items. It all runs in one transaction, holds locks for ages and floods the WAL. On big tables, consider soft deletes or batched deletes instead of cascade.', '`ON DELETE CASCADE` chain ban sakti hai: ek customer delete karo → 50,000 orders → 300,000 order_items. Ye ek hi transaction mein chalega, ghanton lock lega, aur WAL bhar dega. Bade tables par cascade ke bajaye soft delete ya batched delete socho.') }
  ],
  takeaway: x('CASCADE when the child has no existence of its own. Elsewhere, RESTRICT or SET NULL.', 'CASCADE tab jab child ka apna koi wajood na ho. Baaki jagah RESTRICT ya SET NULL.'),
  info: [
    { type: 'p', text: x('A performance detail many people miss: **the parent side of an FK has an index automatically (the PK), but the child side does not**. So you must `CREATE INDEX` on `orders.customer_id` yourself. Otherwise every `DELETE FROM customers` has to scan the whole `orders` table to check for children. This is a very common production slowdown.', 'Ek performance detail jo bahut log miss karte hain: **FK ka parent side par index automatic hai (PK), par child side par nahi**. Matlab `orders.customer_id` par tum khud `CREATE INDEX` karo. Agar nahi karoge to har `DELETE FROM customers` ko poora `orders` table scan karna padega ye check karne ke liye ki koi child to nahi. Ye ek bahut common production slowdown hai.') },
    { type: 'p', text: x('Second: an FK takes a lock (`FOR KEY SHARE`) on the parent table on every INSERT/UPDATE. In very high-throughput systems this can become contention, which is why some large systems drop FKs and manage integrity in the application. **But that\'s an advanced trade-off** — in 99% of projects the benefit of FKs far outweighs the cost. Without FKs, orphan rows are guaranteed.', 'Doosri baat: FK har INSERT/UPDATE par parent table par ek lock (`FOR KEY SHARE`) leta hai. Bahut high-throughput systems mein ye contention ban sakta hai, aur isiliye kuchh bade systems FK hata dete hain aur application level par integrity manage karte hain. **Par ye ek advanced trade-off hai** — 99% projects mein FK rakhne ka faayda nuksaan se kahin zyada hai. Bina FK ke orphan rows guaranteed hain.') }
  ]
},
{

  ],
  takeaway: x('Before any production migration, always ask: "will this rewrite the table, and how long will the lock be held?"', 'Production migration se pehle hamesha poochho: "isse table rewrite hoga kya, aur lock kitni der rahega?"')
},
{
  id: 'ddl-safe-migration', section: 'ddl', layout: 'default',

  title: x('The zero-downtime migration pattern', 'Zero-downtime migration ka pattern'),

      '',

{
  id: 'ddl-drop', section: 'ddl', layout: 'default',
  kicker: x('Removing', 'Hatana'),
  title: x('DROP, TRUNCATE, DELETE — all three are different', 'DROP, TRUNCATE, DELETE — teenon alag hain'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Command', x('What it does', 'Kya karta hai'), 'Speed', x('Can it roll back?', 'Rollback ho sakta?')],
      rows: [
        ['`DELETE FROM t`', x('Removes rows, table stays', 'Rows hatata hai, table rehta hai'), x('Slow (row by row, WAL, dead tuples)', 'Dheema (row by row, WAL, dead tuples)'), x('✓ Yes', '✓ Haan')],
        ['`TRUNCATE t`', x('Empties the whole table, new file', 'Poora table khaali, file naya'), x('**Very fast** (instant)', '**Bahut tez** (instant)'), x('✓ Yes (in Postgres!)', '✓ Haan (Postgres mein!)')],
        ['`DROP TABLE t`', x('The table itself is gone', 'Table hi khatam'), x('Fast', 'Tez'), x('✓ Yes (inside a transaction)', '✓ Haan (transaction ke andar)')],
        ['`DROP TABLE t CASCADE`', x('Table + everything that depends on it', 'Table + uspar depend karne wali cheezein'), x('Fast', 'Tez'), x('✓ Yes — but be careful', '✓ Haan — par dhyaan se')]
      ] },
    { type: 'callout', tone: 'key', title: x('A Postgres gift', 'Postgres ka tohfa'), text: x('In Postgres both `TRUNCATE` and `DROP` are **transactional**. So: `BEGIN; TRUNCATE big_table; -- oh no; ROLLBACK;` and the data is back. MySQL/Oracle can\'t do this. Still, build the habit of typing `BEGIN` first in production.', 'Postgres mein `TRUNCATE` aur `DROP` dono **transactional** hain. Matlab: `BEGIN; TRUNCATE big_table; -- oh no; ROLLBACK;` aur data wapas. MySQL/Oracle mein ye nahi hota. Phir bhi production mein pehle `BEGIN` likhne ki aadat daalo.') },
    { type: 'callout', tone: 'trap', title: x('TRUNCATE\'s hidden side effects', 'TRUNCATE ke chhupe side effects'), text: x('TRUNCATE takes an `ACCESS EXCLUSIVE` lock on the whole table, and `ON DELETE` triggers don\'t fire. If there are FK children you need `TRUNCATE ... CASCADE` — which empties them too. The "I was only cleaning test data" stories come from here.', 'TRUNCATE poore table par `ACCESS EXCLUSIVE` lock leta hai, aur `ON DELETE` triggers nahi chalate. Agar FK children hain to `TRUNCATE ... CASCADE` chahiye — aur wo unhe bhi khaali kar dega. "Sirf test data saaf kar raha tha" wali kahaniyan yahin se aati hain.') }
  ],
  takeaway: x('Clearing test data = TRUNCATE. Removing some rows = DELETE. Removing the whole thing = DROP. And always start with BEGIN.', 'Test data saaf karna = TRUNCATE. Kuchh rows hatana = DELETE. Poori cheez hatana = DROP. Aur hamesha BEGIN se shuru.')
},

  info: [
    { type: 'p', text: x('Understand why the "check first, then insert" pattern breaks. Two requests arrive together. Both run `SELECT ... WHERE email = \'a@x.com\'`, both find nothing, both INSERT. One gets a duplicate key error (if there\'s a UNIQUE constraint), or both get inserted (if there isn\'t). This is a **TOCTOU** (time-of-check to time-of-use) bug, and it only shows up in production when traffic grows — i.e. at the worst possible moment.', 'Wo "pehle check karo phir insert karo" wala pattern kyun toot-ta hai, ye samjho. Do requests ek saath aayi. Dono ne `SELECT ... WHERE email = \'a@x.com\'` chalaya, dono ko kuchh nahi mila, dono ne INSERT maara. Ek ko duplicate key error mila (agar UNIQUE hai) ya dono insert ho gaye (agar UNIQUE nahi hai). Ye ek **TOCTOU** (time-of-check to time-of-use) bug hai, aur ye production mein tabhi dikhta hai jab traffic badhta hai — matlab sabse bure waqt par.') },
    { type: 'p', text: x('`ON CONFLICT` is handled atomically inside Postgres: it does a speculative insert through the index and turns it into an update on conflict — nobody can sneak in between. The same idea applies to `MERGE` (PG 15+), though `MERGE` isn\'t as strong as `ON CONFLICT` under concurrent inserts — so for a simple upsert, `ON CONFLICT` is the better choice.', '`ON CONFLICT` Postgres ke andar atomically handle hota hai: wo index ke through ek speculative insert karta hai aur conflict par turant update mein badal deta hai — beech mein koi doosra ghus nahi sakta. Yahi baat `MERGE` (PG 15+) par bhi lagoo hoti hai, halaanki `MERGE` concurrent inserts par utna strong nahi hai jitna `ON CONFLICT` — isliye simple upsert ke liye `ON CONFLICT` hi behtar hai.') }

/* ═══════════════ 7 · SELECT ═══════════════════════════════════════════════ */
{
  id: 'select-anatomy', section: 'select', layout: 'default',
  kicker: 'SELECT',
  title: x('Every part of a SELECT', 'Ek SELECT ke saare hisse'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('SELECT   c.city, count(*) AS orders, sum(o.total) AS revenue  -- 5. what to show', 'SELECT   c.city, count(*) AS orders, sum(o.total) AS revenue  -- 5. kya dikhana hai'),
      x('FROM     orders o                                             -- 1. from where', 'FROM     orders o                                             -- 1. kahan se'),
      x('JOIN     customers c ON c.id = o.customer_id                  -- 2. join with what', 'JOIN     customers c ON c.id = o.customer_id                  -- 2. kisse jodna hai'),
      x('WHERE    o.status = \'paid\'                                    -- 3. which rows', "WHERE    o.status = 'paid'                                    -- 3. kaunsi rows"),
      x('GROUP BY c.city                                               -- 4. how to group', 'GROUP BY c.city                                               -- 4. kaise group'),
      x('HAVING   count(*) > 10                                        -- 6. which groups', 'HAVING   count(*) > 10                                        -- 6. kaunse groups'),
      x('ORDER BY revenue DESC                                         -- 7. in what order', 'ORDER BY revenue DESC                                         -- 7. kis kram mein'),
      x('LIMIT    10;                                                  -- 8. how many', 'LIMIT    10;                                                  -- 8. kitni')
    ], caption: x('The numbers show the **execution order**, not the writing order.', 'Numbers likhne ka kram nahi, **chalne ka kram** batate hain.') },
    { type: 'callout', tone: 'key', title: x('This one idea unlocks everything', 'Yahi ek cheez sab kuchh khol deti hai'), text: x('SELECT is written first but runs **almost last**. That\'s why you can\'t use a column alias in `WHERE` (`WHERE revenue > 100` — error), but you can in `ORDER BY`. People who grasp this lose half their SQL confusion.', 'SELECT sabse pehle likha jaata hai par lagbhag **sabse aakhir mein chalta hai**. Isiliye tum `WHERE` mein column alias use nahi kar sakte (`WHERE revenue > 100` — error), par `ORDER BY` mein kar sakte ho. Jo log ye samajh lete hain, unki aadhi SQL confusion khatam ho jaati hai.') }
  ],
  takeaway: x('Writing order: SELECT, FROM, WHERE... Execution order: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.', 'Likhne ka kram: SELECT, FROM, WHERE... Chalne ka kram: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.'),
  info: [
    { type: 'p', text: x('The full logical execution order: **FROM/JOIN** (fetch and combine rows) → **WHERE** (filter rows) → **GROUP BY** (form groups) → **HAVING** (filter groups) → **SELECT** (build columns and expressions; aliases are created here) → **DISTINCT** → **ORDER BY** (aliases now available) → **LIMIT/OFFSET**.', 'Poora logical execution order: **FROM/JOIN** (rows laao aur jodo) → **WHERE** (rows chhaanto) → **GROUP BY** (dher banao) → **HAVING** (dheron ko chhaanto) → **SELECT** (columns aur expressions banao, alias yahan bante hain) → **DISTINCT** → **ORDER BY** (ab alias available hai) → **LIMIT/OFFSET**.') },
    { type: 'p', text: x('This order explains two common errors. (1) "column \'revenue\' does not exist" in WHERE — because WHERE runs before SELECT, so the alias doesn\'t exist yet. (2) "aggregate functions are not allowed in WHERE" — because aggregates are computed after GROUP BY, and WHERE comes before that; that\'s why `HAVING` exists.', 'Is order se do aam errors samajh aate hain. (1) "column \'revenue\' does not exist" in WHERE — kyunki WHERE, SELECT se pehle chalta hai, alias abhi bana hi nahi. (2) "aggregate functions are not allowed in WHERE" — kyunki aggregate GROUP BY ke baad bante hain, aur WHERE usse pehle hai; isiliye `HAVING` exist karta hai.') },
    { type: 'callout', tone: 'tip', title: x('An important caveat', 'Zaroori chetavni'), text: x('This is the **logical** order, not the physical one. In reality the planner completely reorders things — it may push WHERE into a join, or change the whole plan because of a LIMIT. The logical order explains semantics, not performance.', 'Ye **logical** order hai, physical nahi. Asal mein planner is order ko poori tarah tod deta hai — wo WHERE ko join ke andar push kar sakta hai, ya LIMIT ko dekhkar poora plan badal sakta hai. Logical order semantics samjhane ke liye hai, performance ke liye nahi.') }
  ]
},

{

  blocks: [

  info: [
    { type: 'p', text: x('A Surat example: you ask two friends "what\'s your salary?" Both stay silent. Now the question: "do both of them earn the same?" The right answer isn\'t "yes", it\'s "unknown". That is `NULL = NULL` → NULL. SQL is honest about this, and that honesty is what confuses people at first.', 'Ek Surat wali misaal: tum do doston se poochhte ho "tumhari salary kitni hai?" Dono chup rah jaate hain. Ab sawaal: "kya dono ki salary barabar hai?" Sahi jawab "haan" nahi hai, "pata nahi" hai. Yahi `NULL = NULL` → NULL hai. SQL is baat mein imaandaar hai, aur shuru mein yahi imaandaari pareshan karti hai.') },
    { type: 'p', text: x('Another very important exception people don\'t know: **a UNIQUE constraint doesn\'t treat NULLs as duplicates**. So a column declared `email text UNIQUE` can hold 10 rows with a NULL email. Since NULL = NULL is unknown rather than false, Postgres treats them as "different". PG 15 added `UNIQUE NULLS NOT DISTINCT`, which changes this.', 'Ek aur bahut important exception jo log nahi jaante: **UNIQUE constraint NULLs ko duplicate nahi maanta**. Matlab `email text UNIQUE` wale column mein tum 10 rows NULL email ke saath daal sakte ho. Kyunki NULL = NULL false nahi, unknown hai, isliye Postgres unhe "alag" maanta hai. PG 15 se `UNIQUE NULLS NOT DISTINCT` option aaya hai jo ise badal deta hai.') },
    { type: 'p', text: x('And in `GROUP BY`, NULLs are grouped **together**, while UNIQUE treats them as different. Two places, two behaviours — deliberate, per the standard, but something you have to remember.', 'Aur `GROUP BY` mein NULLs **ek saath** group ho jaate hain, jabki UNIQUE unhe alag maanta hai. Ye do jagah alag behaviour hai — jaan-boojhkar, standard ke hisaab se, par yaad rakhna padta hai.') }

/* ═══════════════ 9 · JOINS ════════════════════════════════════════════════ */
{
  id: 'join-why', section: 'joins', layout: 'diagram',
  kicker: 'Join',
  title: x('Why joins exist — and what they actually do', 'Join kyun exist karta hai — aur asal mein kya karta hai'),
  blocks: [
    { type: 'diagram', id: 'joinVisual' }
  ],
  takeaway: x('A join means: "combine rows from these two tables on this condition". The number of result rows can go up.', 'Join ka matlab: "in do tables ki rows ko is shart par jodo". Result rows ki ginti badh bhi sakti hai.'),
  info: [
    { type: 'p', text: x('First, why joins are needed. If we wrote the customer\'s name, email and address on every order, changing one customer\'s name would mean updating 5,000 rows, and one would be missed. So we split data into separate tables (normalization) and combine them when needed — that\'s a join.', 'Pehle ye samjho ki join zaroori kyun hai. Agar hum har order ke saath customer ka naam, email, address sab likh dete, to ek customer ka naam badalne par 5000 rows update karni padti aur kisi ek mein galti reh jaati. Isliye hum data ko alag tables mein todte hain (normalization) aur zaroorat par jodte hain — yahi join hai.') },
    { type: 'p', text: x('Mental model: a join is a **cross product + filter**. Think of it as "pair every row of one table with every row of the other (cartesian product), then remove the wrong pairs with the `ON` condition". Postgres never actually does this (it uses hash or merge joins), but for semantics this model is perfect. It also explains why rows explode when the `ON` condition is weak.', 'Mental model: join ek **cross product + filter** hai. Sochne ka tareeka — "dono tables ki har row ko har row se jodo (cartesian product), phir `ON` condition se galat jodiyan hata do". Postgres asal mein ye kabhi nahi karta (wo hash ya merge join use karta hai), par semantics samajhne ke liye ye model perfect hai. Aur isi model se samajh aata hai ki agar `ON` condition kamzor hai to rows kyun phatt jaati hain.') },
    { type: 'callout', tone: 'trap', title: x('Fan-out — the most expensive join mistake', 'Fan-out — sabse mehngi join galti'), text: x('If a customer has 3 orders, that customer appears 3 times in `customers JOIN orders`. Now `sum(customers.credit_limit)` is 3x too big. This bug shows up constantly in production reports and is hard to catch because the number looks "roughly right".', 'Agar ek customer ke 3 orders hain, to `customers JOIN orders` mein wo customer 3 baar aayega. Ab agar tum `sum(customers.credit_limit)` karoge to wo 3x ho jaayega. Ye bug production reports mein bahut aata hai aur pakadna mushkil hai kyunki number "lagbhag sahi" lagta hai.') }
  ]
},

{
  id: 'join-trap-where', section: 'joins', layout: 'default',
  kicker: 'Stop & Think',
  title: x('These two queries give different results. Which, and why?', 'Ye do queries alag result denge. Kaun sa, aur kyun?'),
  blocks: [
    { type: 'cols', ratio: '1-1', cols: [
      [ { type: 'code', lang: 'sql', lines: [
          '-- Query A',
          'SELECT c.name, o.id',
          'FROM customers c',
          'LEFT JOIN orders o',
          '  ON o.customer_id = c.id',
          " AND o.status = 'paid';"
        ] } ],
      [ { type: 'code', lang: 'sql', lines: [
          '-- Query B',
          'SELECT c.name, o.id',
          'FROM customers c',
          'LEFT JOIN orders o',
          '  ON o.customer_id = c.id',
          "WHERE o.status = 'paid';"
        ] } ]
    ] },
    { type: 'p', tone: 'muted', text: x('Think of the answer, then press `i`. This is one of SQL\'s top-5 mistakes.', 'Jawab socho, phir `i` dabao. Ye SQL ki top-5 galtiyon mein se ek hai.') }
  ],
  info: [
    { type: 'p', text: x('**Query A** returns every customer. Those with paid orders show the order; the rest show NULL. Because `AND o.status = \'paid\'` is in the `ON` clause — it\'s part of the match condition, and a LEFT JOIN never removes left-side rows.', '**Query A** har customer dega. Jinke paid orders hain unke saath order dikhega, baaki ke saath NULL. Kyunki `AND o.status = \'paid\'` `ON` clause mein hai — wo match ki shart ka hissa hai, aur LEFT JOIN baayen ki rows wapas nahi hataata.') },
    { type: 'p', text: x('**Query B** returns only customers with paid orders — the LEFT JOIN has silently become an INNER JOIN. Because `WHERE o.status = \'paid\'` runs after the join, and rows where `o.status` is NULL (no match) evaluate `= \'paid\'` to UNKNOWN and get filtered out.', '**Query B** sirf wo customers dega jinke paid orders hain — matlab LEFT JOIN chupchaap INNER JOIN ban gaya. Kyunki join ke baad `WHERE o.status = \'paid\'` chalta hai, aur jin rows mein `o.status` NULL hai (koi match nahi mila), wo `= \'paid\'` par UNKNOWN de kar chhant jaati hain.') },
    { type: 'callout', tone: 'key', title: x('The rule to remember', 'Yaad rakhne wala niyam'), text: x('For a LEFT JOIN, conditions on the **right table** go in `ON`. Conditions on the **left table** go in `WHERE`. Put a right-table condition in `WHERE` and the LEFT JOIN loses its meaning. One exception: `WHERE o.id IS NULL` — that deliberately creates an anti-join.', 'LEFT JOIN ki **daayen table** ki condition `ON` mein jaati hai. **Baayen table** ki condition `WHERE` mein. Agar tum daayen table ki condition `WHERE` mein daaloge to LEFT JOIN ka matlab hi khatam ho jaayega. Ek apwaad: `WHERE o.id IS NULL` — wo jaan-boojhkar anti-join banata hai.') }
  ]
},
{
  id: 'join-self-cross', section: 'joins', layout: 'default',

    { type: 'code', lang: 'sql', lines: [

      '',
      x('-- NATURAL JOIN — NEVER WRITE THIS', '-- NATURAL JOIN — KABHI MAT LIKHNA'),
      'SELECT * FROM orders NATURAL JOIN customers;',
      x('-- it joins on every same-named column. Someone adds created_at', '-- har same-naam column par join kar deta hai. Kisi ne created_at add kiya'),

    ] },
    { type: 'callout', tone: 'warn', title: x('The danger of CROSS JOIN', 'CROSS JOIN ka khatra'), text: x('10,000 × 10,000 = 100 million rows. And if you write `JOIN` but forget the `ON` (or write `ON true`), it silently becomes a CROSS JOIN. The query hangs and you\'ll think the database is slow.', '10,000 × 10,000 = 10 crore rows. Aur agar tumne `JOIN` likha par `ON` bhool gaye (ya `ON true` likh diya), to wo chupchaap CROSS JOIN ban jaata hai. Query hang ho jaayegi aur tum sochoge database slow hai.') }
  ],
  takeaway: x('Never NATURAL JOIN. USING is fine. Self joins are very handy for managers/hierarchies.', 'NATURAL JOIN kabhi nahi. USING theek hai. Self join manager/hierarchy ke liye bahut kaam ka.')
},
{
  id: 'join-lateral', section: 'joins', layout: 'default',
  kicker: x('Advanced, but very useful', 'Advanced par bahut kaam ka'),
  title: x('LATERAL — "top N for each row"', 'LATERAL — "har row ke liye top N"'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- Each customer\'s last 3 orders', '-- Har customer ke aakhri 3 orders'),
      'SELECT c.name, o.id, o.placed_at',

      'CROSS JOIN LATERAL (',

      '  LIMIT 3',
      ') o;',
      '',

      'SELECT c.name, o.id',

    { type: 'callout', tone: 'tip', title: x('LATERAL vs a window function', 'Kab LATERAL vs window function'), text: x('Both can do "top N per group". **LATERAL is often faster** when there are many groups and N is small — it uses the index to fetch just 3 rows per group. A **window function** is better when you have to scan all rows anyway. Learn both, then compare with EXPLAIN.', 'Dono "top N per group" kar sakte hain. **LATERAL aksar tez hota hai** jab groups zyada hain aur N chhota hai — kyunki wo har group ke liye index use karke sirf 3 rows uthaata hai. **Window function** tab behtar jab tumhe saari rows waise bhi scan karni hain. Dono seekho, phir EXPLAIN se compare karo.') }
  ],
  takeaway: x('A normal subquery can\'t see the outer row. LATERAL can — that\'s the whole difference.', 'Normal subquery baahar ki row nahi dekh sakti. LATERAL dekh sakti hai — yahi poora farak hai.')
},

{

{
  id: 'window-ranking', section: 'window', layout: 'default',
  kicker: 'Ranking',
  title: x('ROW_NUMBER vs RANK vs DENSE_RANK — all three differ', 'ROW_NUMBER vs RANK vs DENSE_RANK — teenon alag hain'),
  blocks: [
    { type: 'table', compact: true,
      head: ['Score', 'row_number()', 'rank()', 'dense_rank()', 'ntile(2)'],
      rows: [
        ['100', '1', '1', '1', '1'],
        ['100', '2', '1', '1', '1'],
        ['90', '3', '**3**', '**2**', '2'],

      ], align: ['l','c','c','c','c'] },
    { type: 'ul', tight: true, items: [
      x('`row_number()` — always 1,2,3,4. Distinct even on ties. **This is what you need for "the first row of each group".**', '`row_number()` — hamesha 1,2,3,4. Tie par bhi alag. **"Har group ki pehli row" ke liye yahi chahiye.**'),
      x('`rank()` — same rank on ties, then a gap. Like sports rankings.', '`rank()` — tie par same rank, phir gap. Sports ranking jaisa.'),
      x('`dense_rank()` — same rank on ties, no gap. For "top 3 distinct prices".', '`dense_rank()` — tie par same rank, gap nahi. "Top 3 distinct prices" ke liye.'),
      x('`ntile(n)` — split rows into n equal buckets (quartiles, percentiles).', '`ntile(n)` — rows ko n barabar buckets mein baanto (quartiles, percentiles).'),
      '`percent_rank()`, `cume_dist()` — percentile position.'

    { type: 'code', lang: 'sql', lines: [
      x('-- Top 3 customers in each city — the most common pattern', '-- Har city ke top 3 customers — sabse aam pattern'),
      'SELECT * FROM (',
      '  SELECT c.city, c.name, sum(o.total) AS spend,',
      '         dense_rank() OVER (PARTITION BY c.city ORDER BY sum(o.total) DESC) AS r',
      '  FROM customers c JOIN orders o ON o.customer_id = c.id',
      '  GROUP BY c.city, c.id, c.name',
      ') t WHERE r <= 3;'
    ] },
    { type: 'callout', tone: 'trap', title: x('Window functions can\'t go in WHERE', 'Window function WHERE mein nahi chal sakta'), text: x('`WHERE rank() OVER (...) <= 3` — error. Window functions are evaluated after SELECT, long after WHERE. So always wrap in a subquery or CTE and filter outside. Every beginner trips on this once.', '`WHERE rank() OVER (...) <= 3` — error. Kyunki window functions SELECT ke baad evaluate hote hain, WHERE se bahut baad. Isliye hamesha subquery ya CTE mein wrap karke bahar filter karo. Ye har beginner ek baar zaroor thokta hai.') }
  ],
  takeaway: x('Need the first row → row_number. Ties should be equal → rank/dense_rank. Wrap in a CTE to filter.', 'Pehli row chahiye → row_number. Ties ko barabar rakhna hai → rank/dense_rank. Filter karne ke liye CTE mein wrap karo.')
},
{
  id: 'window-lag', section: 'window', layout: 'code',
  kicker: x('The most useful', 'Sabse kaam ke'),
  title: x('LAG, LEAD, FIRST_VALUE — look at the previous and next rows', 'LAG, LEAD, FIRST_VALUE — pichhli aur agli row dekho'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- Month-over-month growth', '-- Mahine-dar-mahine growth'),
      'WITH monthly AS (',
      "  SELECT date_trunc('month', placed_at) AS month, sum(total) AS revenue",
      "  FROM orders WHERE status = 'paid' GROUP BY 1",
      ')',
      'SELECT month, revenue,',
      '  lag(revenue) OVER (ORDER BY month)                    AS prev_month,',
      '  revenue - lag(revenue) OVER (ORDER BY month)          AS change,',
      '  round(100.0 * (revenue - lag(revenue) OVER (ORDER BY month))',
      '        / nullif(lag(revenue) OVER (ORDER BY month), 0), 1) AS pct_change',
      'FROM monthly ORDER BY month;',
      '',
      x('-- Days between two orders', '-- Do orders ke beech kitne din gap'),
      'SELECT customer_id, placed_at,',
      '  placed_at - lag(placed_at) OVER (PARTITION BY customer_id ORDER BY placed_at)',
      '    AS gap_since_last',
      'FROM orders;',
      '',
      '-- first_value / last_value / nth_value',
      'first_value(product) OVER (PARTITION BY customer_id ORDER BY placed_at)',
      '  AS first_ever_product'
    ] },
    { type: 'callout', tone: 'tip', title: x('This gets asked a lot', 'Ye aksar puchha jaata hai'), text: x('"How much did it grow since last month" — this question comes up again and again in interviews and real dashboards. Without `lag()` you need a self-join, which is slower and error-prone.', '"Pichhle mahine se kitna badha" — interviews mein aur asli dashboards mein ye sawaal bar-bar aata hai. `lag()` ke bina isko self-join se karna padta hai, jo dheema aur galat-prone hai.') }
  ],
  takeaway: x('`lag` = previous row. `lead` = next row. These two solve 80% of time-series questions.', '`lag` = pichhli row. `lead` = agli row. Time-series ke 80% sawaal inhi do se hal ho jaate hain.')
},
{
  id: 'window-frames', section: 'window', layout: 'code',
  kicker: x('The most confusing part', 'Sabse uljhaanewala hissa'),
  title: x('Window frames — and a default that fools everyone', 'Window frames — aur ek default jo sabko dhokha deta hai'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- The default frame when there is an ORDER BY:', '-- Frame ka default jab ORDER BY hai:'),
      'RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW',
      x('-- Meaning: from the start up to now = RUNNING TOTAL', '-- Matlab: shuru se lekar abhi tak = RUNNING TOTAL'),
      '',
      x('-- The default frame when there is NO ORDER BY:', '-- Frame ka default jab ORDER BY NAHI hai:'),
      'RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING',
      x('-- Meaning: the whole partition = GRAND TOTAL', '-- Matlab: poora partition = GRAND TOTAL'),
      '',
      x('-- So these two are COMPLETELY different:', '-- Isiliye ye do BILKUL alag hain:'),
      x('sum(total) OVER (PARTITION BY city)                    -- the city\'s total', 'sum(total) OVER (PARTITION BY city)                    -- city ka total'),
      'sum(total) OVER (PARTITION BY city ORDER BY placed_at) -- running total!',
      '',
      x('-- Moving average — the last 3 rows', '-- Moving average — pichhli 3 rows'),
      'avg(total) OVER (ORDER BY placed_at ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)',
      '',
      x('-- A 7-day moving window (RANGE with an interval)', '-- 7 din ka moving window (RANGE with interval)'),
      "avg(total) OVER (ORDER BY placed_at",
      "                 RANGE BETWEEN interval '7 days' PRECEDING AND CURRENT ROW)"
    ] },
    { type: 'callout', tone: 'trap', title: 'ROWS vs RANGE', text: x('`ROWS` counts physical rows. `RANGE` works on **values** — rows with the same value come in together (peers). If 3 orders have exactly the same `placed_at`, `RANGE` counts all three at once while `ROWS` goes one by one. This is the most common reason running totals come out wrong. **If in doubt, write `ROWS`.**', '`ROWS` physical rows ginta hai. `RANGE` **values** ke hisaab se chalta hai — matlab same value wali saari rows ek saath aati hain (peers). Agar 3 orders ka `placed_at` bilkul same hai, to `RANGE` teenon ko ek saath count karega par `ROWS` ek-ek karke. Running total galat aane ka ye sabse common kaaran hai. **Agar samajh na aaye to `ROWS` likho.**') }
  ],
  takeaway: x('Adding ORDER BY changes the frame. That one line is the root of 90% of window-function confusion.', 'ORDER BY daalte hi frame badal jaata hai. Ye ek line 90% window-function confusion ki jad hai.')
},
{
  id: 'window-practical', section: 'window', layout: 'default',
  kicker: 'Real World',
  title: x('Five patterns you\'ll actually write', 'Paanch patterns jo tum asal mein likhoge'),
  blocks: [
    { type: 'ol', tight: true, items: [
      x('**Top N per group** — `row_number() OVER (PARTITION BY x ORDER BY y DESC)` then `<= N`', '**Top N per group** — `row_number() OVER (PARTITION BY x ORDER BY y DESC)` phir `<= N`'),
      '**Running total / cumulative** — `sum(v) OVER (ORDER BY t)`',
      '**Month-over-month growth** — `lag(v) OVER (ORDER BY month)`',
      x('**Each row\'s share of its group (%)** — `v / sum(v) OVER (PARTITION BY g)`', '**Har row ka group mein hissa (%)** — `v / sum(v) OVER (PARTITION BY g)`'),
      x('**Finding/removing duplicates** — `row_number() OVER (PARTITION BY email ORDER BY id)` then delete `> 1`', '**Duplicates dhoondhna/hataana** — `row_number() OVER (PARTITION BY email ORDER BY id)` phir `> 1` delete')
    ] },
    { type: 'code', lang: 'sql', lines: [
      x('-- Remove duplicates, keep the oldest row', '-- Duplicates hatao, sabse purani row rakho'),
      'DELETE FROM customers WHERE id IN (',
      '  SELECT id FROM (',
      '    SELECT id, row_number() OVER (PARTITION BY lower(email) ORDER BY id) AS rn',
      '    FROM customers',
      '  ) t WHERE rn > 1',
      ');',
      '',
      x('-- Sessionization: a 30-minute gap = a new session', '-- Sessionization: 30 min gap = naya session'),
      'SELECT user_id, event_at,',
      '  sum(new_session) OVER (PARTITION BY user_id ORDER BY event_at) AS session_id',
      'FROM (',
      '  SELECT user_id, event_at,',
      "    CASE WHEN event_at - lag(event_at) OVER (PARTITION BY user_id ORDER BY event_at)",
      "              > interval '30 minutes' THEN 1 ELSE 0 END AS new_session",
      '  FROM events',
      ') t;'
    ] }
  ],
  takeaway: x('Window functions aren\'t "nice to have". Without them this work moves into application code — where it\'s slower and buggier.', 'Window functions "nice to have" nahi hain. Inke bina ye kaam application code mein aate hain — aur wahan dheeme aur buggy hote hain.')
},

{

    { type: 'p', text: x('**Tables:** `customers`, `plans`, `subscriptions`, `delivery_boys`, `deliveries`, `invoices`, `invoice_lines`. Optional: `plan_prices` (if you need price history).', '**Tables:** `customers`, `plans`, `subscriptions`, `delivery_boys`, `deliveries`, `invoices`, `invoice_lines`. Optional: `plan_prices` (agar price history chahiye).') },
    { type: 'p', text: x('**Key decisions worth checking:** (1) `subscriptions` has a `plan_id` FK **and** `price_at_signup numeric(10,2)` — when the plan price changes, existing subscriptions keep their price. That\'s the same "historical fact" lesson. (2) A `UNIQUE` on `(subscription_id, delivery_date)` in `deliveries` — one delivery per day. (3) A CHECK constraint on `deliveries.status`. (4) Rather than a separate skip table, keeping `status = \'skipped\'` in `deliveries` is simpler — but then each day\'s rows must be created in advance (by a scheduled job). (5) `invoice_lines` should reference `deliveries`, so invoices are auditable.', '**Key decisions jo dekhne layak hain:** (1) `subscriptions` mein `plan_id` FK **aur** `price_at_signup numeric(10,2)` — plan ka price badalne par purani subscription ka price nahi badalna chahiye. Yahi wahi "historical fact" wala sabak hai. (2) `deliveries` mein `(subscription_id, delivery_date)` par `UNIQUE` — ek din ek hi delivery. (3) `deliveries.status` par CHECK constraint. (4) Skip ko alag table banane ki bajaye `deliveries` mein `status = \'skipped\'` rakhna aasan hai — par tab har din ki row pehle se banani padegi (ek scheduled job se). (5) `invoice_lines` `deliveries` ko reference kare, taaki invoice audit ho sake.') },
    { type: 'p', text: x('**Indexes:** `deliveries (delivery_date)` — the daily dispatch list; `deliveries (subscription_id, delivery_date)` — unique + lookup; `deliveries (delivery_boy_id, delivery_date)` — each boy\'s route; `subscriptions (customer_id)`; `subscriptions (status) WHERE status = \'active\'` — a partial index, since only active ones are queried.', '**Indexes:** `deliveries (delivery_date)` — roz ka dispatch list; `deliveries (subscription_id, delivery_date)` — unique + lookup; `deliveries (delivery_boy_id, delivery_date)` — har boy ka route; `subscriptions (customer_id)`; `subscriptions (status) WHERE status = \'active\'` — partial index, kyunki active hi query hote hain.') },

{
  id: 'index-why', section: 'index', layout: 'diagram',
  kicker: 'Big Idea',
  title: x('An index — exactly like the index at the back of a book', 'Index — kitaab ke aakhir wala index, bilkul wahi cheez'),
  blocks: [
    { type: 'diagram', id: 'seqVsIndex' }
  ],
  takeaway: x('An index turns a scan into a lookup. The price: every write updates the index too, and it uses disk space.', 'Index scan ko lookup bana deta hai. Keemat: har write par index bhi update hota hai, aur disk jagah bhi.'),
  info: [
    { type: 'p', text: x('Think of it like this: you need to find the word "MVCC" in an 800-page book. Without an index you read every page from 1 to 800 — that\'s a **sequential scan**. With an index you flip to the back, see "MVCC → pages 412, 589", and go straight there — that\'s an **index scan**.', 'Sochne ka tareeka: ek 800 page ki kitaab mein "MVCC" shabd dhoondhna hai. Bina index ke tum page 1 se 800 tak har page padhoge — ye **sequential scan** hai. Index ke saath tum aakhir mein jaakar "MVCC → page 412, 589" dekhoge aur seedha wahan jaoge — ye **index scan** hai.') },
    { type: 'p', text: x('Now an important point: if what you want is on **60% of the pages**, jumping back and forth 480 times via the index is **slower** than just reading the whole book. That\'s why Postgres sometimes chooses a seq scan even when an index exists — and it\'s usually right. An index wins when you want **a small fraction of rows** (typically < 5–10%).', 'Par ab ek important baat: agar tumhe kitaab ke **60% pages** par kuchh dhoondhna hai, to index dekhkar 480 baar aage-peechhe bhaagna poori kitaab seedha padhne se **dheema** hoga. Yahi wajah hai ki Postgres kabhi-kabhi index hote hue bhi seq scan chunta hai — aur wo faisla aksar sahi hota hai. Index tab jeetta hai jab tum **thodi si rows** chahte ho (typically < 5-10%).') },
    { type: 'callout', tone: 'trap', title: x('The biggest misconception', 'Sabse badi galatfehmi'), text: x('"Add an index and it\'ll be fast." An index only helps when the query can use it **and** is selective. An index on a 100-row table is useless. An index for `WHERE is_active = true` is useless if 95% of rows are active. And on a table with 20 indexes, every INSERT does 20x the work.', '"Index laga do, tez ho jaayega." Index sirf tab tez karta hai jab query uska use kar sake **aur** selective ho. 100 rows wali table par index bekaar hai. `WHERE is_active = true` par index bekaar hai agar 95% rows active hain. Aur 20 indexes wali table par har INSERT 20 gunaa kaam karta hai.') }
  ]
},
{
  id: 'index-btree', section: 'index', layout: 'diagram',
  kicker: 'How It Actually Works',
  title: x('B-tree — Postgres\'s default index, from the inside', 'B-tree — Postgres ka default index, andar se'),
  blocks: [
    { type: 'diagram', id: 'btree' }
  ],
  takeaway: x('Finding one value among 100 million rows = just 3–4 page reads. That\'s why indexes feel like "magic".', '1 crore rows mein ek value dhoondhna = sirf 3-4 page reads. Isiliye index "jaadu" lagta hai.'),
  info: [
    { type: 'p', text: x('A B-tree is a balanced tree. The "B" doesn\'t mean "binary" — it stands for "balanced" (or Bayer, the inventor). Each node is an 8 KB page holding hundreds of keys, so the tree is very **wide and shallow**: even at 1 billion rows the depth is only 4–5 levels. Each level is one page read, and the upper levels always stay in RAM.', 'B-tree ek balanced tree hai. "B" ka matlab "binary" nahi hai — ye "balanced" (ya Bayer, inventor ka naam) hai. Har node ek 8 KB page hai jismein sainkadon keys aa jaati hain. Isliye tree bahut **chauda aur chhota** hota hai: 10 crore rows par bhi gehrai sirf 4-5 levels hoti hai. Har level ek disk page read hai, aur upar ke levels hamesha RAM mein rehte hain.') },
    { type: 'p', text: x('Leaf pages hold sorted keys, each with a **ctid** (a physical row pointer: page number + row number). Leaf pages are also linked to each other — which is why range scans (`BETWEEN`, `>`, `ORDER BY`) are so cheap: reach a leaf once, then keep walking.', 'Leaf pages mein sorted keys hoti hain aur har key ke saath ek **ctid** (physical row pointer: page number + row number). Leaf pages aapas mein linked bhi hote hain — isiliye range scan (`BETWEEN`, `>`, `ORDER BY`) bahut sasta hai: ek baar leaf tak pahuncho, phir saath-saath chalte jao.') },
    { type: 'p', text: x('These two facts explain **every strength** of a B-tree: (a) because it\'s sorted, `=`, `<`, `>`, `BETWEEN`, `LIKE \'abc%\'` and `ORDER BY` all work; (b) because of the ctid, there\'s one extra hop from index to heap (unless it\'s an index-only scan).', 'Ye do baatein B-tree ki **saari khoobiyan** samjha deti hain: (a) sorted hone ki wajah se `=`, `<`, `>`, `BETWEEN`, `LIKE \'abc%\'`, aur `ORDER BY` — sab kaam karte hain; (b) ctid ki wajah se index se heap tak ek extra hop lagta hai (jab tak index-only scan na ho).') },
    { type: 'callout', tone: 'tip', title: x('Why `LIKE \'%abc\'` doesn\'t work', 'Kyun `LIKE \'%abc\'` kaam nahi karta'), text: x('Because a B-tree is sorted from the **beginning** of the value. Everything starting with "Ro" sits together. But values ending in "hit" are scattered across the whole tree — finding them means reading the whole tree, which is worse than a seq scan.', 'Kyunki B-tree **shuruaat** se sorted hai. "Ro" se shuru hone wale sab ek saath hain. Par "hit" par khatam hone wale poore tree mein bikhre hue hain — unhe dhoondhne ke liye poora tree padhna padega, jo seq scan se bura hai.') }
  ]
},
{
  id: 'index-create', section: 'index', layout: 'default',
  kicker: 'Practice',
  title: x('Creating an index — and seeing the first difference', 'Index banana — aur pehla farak dekhna'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- First, without an index', '-- Pehle bina index ke'),
      'EXPLAIN ANALYZE SELECT * FROM orders WHERE customer_id = 12345;',
      '-- Seq Scan on orders  (cost=0..38000 rows=20) (actual time=0.1..842 ms rows=11)',
      '',
      'CREATE INDEX orders_customer_id_idx ON orders (customer_id);',
      '',
      'EXPLAIN ANALYZE SELECT * FROM orders WHERE customer_id = 12345;',
      '-- Index Scan using orders_customer_id_idx  (actual time=0.03..0.07 ms rows=11)',
      '-- 842 ms  ->  0.07 ms  =  12,000x',
      '',
      x('-- In production, ALWAYS use CONCURRENTLY', '-- Production mein HAMESHA CONCURRENTLY'),
      'CREATE INDEX CONCURRENTLY orders_customer_id_idx ON orders (customer_id);',
      '',
      x('-- Inspecting / dropping', '-- Dekhna / hataana'),
      '\\d orders',
      'DROP INDEX CONCURRENTLY orders_customer_id_idx;',
      'SELECT pg_size_pretty(pg_relation_size(\'orders_customer_id_idx\'));'
    ] },
    { type: 'callout', tone: 'warn', title: x('Why CONCURRENTLY matters', 'CONCURRENTLY zaroori kyun'), text: x('A normal `CREATE INDEX` locks the whole table — no INSERT/UPDATE/DELETE can run meanwhile. On a big table that\'s a 20-minute outage. `CONCURRENTLY` scans the table twice (slower) but takes no blocking lock. The price: it can\'t run inside a transaction, and if it fails it leaves an "invalid" index behind that you must `DROP` and rebuild.', 'Normal `CREATE INDEX` poore table par lock leta hai — us dauraan koi INSERT/UPDATE/DELETE nahi chalega. Ek bade table par ye 20 minute ka outage hai. `CONCURRENTLY` do baar table scan karta hai (dheema) par lock nahi leta. Keemat: transaction ke andar nahi chal sakta, aur fail hone par ek "invalid" index chhod jaata hai jise `DROP` karke dobara banana padta hai.') }
  ],
  takeaway: x('`CREATE INDEX` in development. Always `CREATE INDEX CONCURRENTLY` in production.', 'Development mein `CREATE INDEX`. Production mein hamesha `CREATE INDEX CONCURRENTLY`.')
},
{
  id: 'index-composite', section: 'index', layout: 'default',
  kicker: x('The most important index concept', 'Sabse zaroori index concept'),
  title: x('Composite indexes and the leftmost-prefix rule', 'Composite index aur leftmost prefix rule'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      'CREATE INDEX ON orders (customer_id, status, placed_at);',
      '',
      x('-- These queries can use the index:', '-- Ye queries index use kar sakti hain:'),
      x('WHERE customer_id = 5                                    -- ✓ (first column)', 'WHERE customer_id = 5                                    -- ✓ (pehla column)'),
      x('WHERE customer_id = 5 AND status = \'paid\'                -- ✓ (first two)', "WHERE customer_id = 5 AND status = 'paid'                -- ✓ (pehle do)"),
      x('WHERE customer_id = 5 AND status = \'paid\' AND placed_at > \'2026-01-01\'  -- ✓ (all three)', "WHERE customer_id = 5 AND status = 'paid' AND placed_at > '2026-01-01'  -- ✓ (teenon)"),
      x('WHERE customer_id = 5 ORDER BY status, placed_at         -- ✓ (sorting for free)', 'WHERE customer_id = 5 ORDER BY status, placed_at         -- ✓ (sort free mein)'),
      '',
      x('-- These CANNOT (or only weakly):', '-- Ye NAHI (ya bahut kamzor):'),
      x('WHERE status = \'paid\'                                    -- ✕ first column skipped', "WHERE status = 'paid'                                    -- ✕ pehla column chhoot gaya"),
      "WHERE placed_at > '2026-01-01'                           -- ✕",
      "WHERE status = 'paid' AND placed_at > '2026-01-01'       -- ✕"
    ] },
    { type: 'callout', tone: 'key', title: x('The phone-directory analogy', 'Phone directory wali analogy'), text: x('A directory sorted by (city, area, name). Finding people in "Surat" is easy. "Surat + Adajan" is easy too. But "everyone in Adajan, in any city"? You\'d have to read the whole directory — because Adajan is scattered inside every city. **You can\'t skip an index\'s first column.**', 'Ek directory jo (city, area, name) se sorted hai. "Surat" ke log dhoondhna aasan. "Surat + Adajan" bhi aasan. Par "saare Adajan wale, chahe koi bhi city ho"? Poori directory padhni padegi — kyunki Adajan har city ke andar bikhra hua hai. **Index ka pehla column skip nahi kar sakte.**') },
    { type: 'p', tone: 'muted', text: x('Postgres is a little clever: it can sometimes do something like an "index skip scan" via a bitmap scan, but don\'t rely on it.', 'Postgres thoda smart hai: wo "index skip scan" jaisa kaam kabhi-kabhi bitmap scan se kar leta hai, par uspar bharosa mat karo.') }
  ],
  takeaway: x('Column order matters. Equality columns first, the range column last.', 'Column order matter karta hai. Equality columns pehle, range column aakhir mein.'),
  info: [
    { type: 'p', text: x('The practical rule for column order: **equality (`=`) columns first, then the range column (`>`, `<`, `BETWEEN`), then the `ORDER BY` column**. After a range condition the index scan "opens up" — later columns become filters only; they can\'t be used to seek.', 'Column order chunne ka practical rule: **equality (`=`) wale columns pehle, phir range (`>`, `<`, `BETWEEN`) wala column, phir `ORDER BY` wala column**. Kyunki range condition ke baad index ka scan "khul" jaata hai — uske baad ke columns sirf filter ban jaate hain, seek nahi kar sakte.') },
    { type: 'p', text: x('Example: `WHERE customer_id = 5 AND placed_at > X ORDER BY placed_at`. Best index: `(customer_id, placed_at)`. The reverse, `(placed_at, customer_id)`, is much weaker because `placed_at` is a range — starting with it means scanning lots of rows.', 'Misaal: `WHERE customer_id = 5 AND placed_at > X ORDER BY placed_at`. Best index: `(customer_id, placed_at)`. Ulta `(placed_at, customer_id)` bahut kamzor hoga kyunki `placed_at` range hai — usse shuru karne par tumhe bahut saari rows scan karni padengi.') },
    { type: 'p', text: x('Also: once you have an index on `(a, b)`, a separate index on `(a)` is **not needed** — it\'s redundant and only slows writes. A separate index on `(b)` may still be needed. Scan your index list for redundant ones — it\'s an easy performance win.', 'Doosri baat: `(a, b)` par index hone ke baad `(a)` par alag index ki **zaroorat nahi** hai — wo redundant hai aur sirf writes dheema karta hai. Par `(b)` par alag index chahiye ho sakta hai. Apne indexes ki list dekhkar aise redundant indexes dhoondho — ye ek aasan performance win hai.') }
  ]
},
{

{

{
  id: 'index-types', section: 'index', layout: 'default',

  title: x('Beyond B-tree — and which one when', 'B-tree ke alawa — aur kab kaunsa'),
  blocks: [

  info: [
    { type: 'p', text: x('BRIN is worth understanding because it\'s very underrated. For each "block range" (128 pages by default) BRIN stores only the **min and max**. So a 100 GB table\'s BRIN index is just a few MB. At query time it skips block ranges whose min–max can\'t match.', 'BRIN ko samajhna faaydemand hai kyunki wo bahut underrated hai. BRIN har "block range" (default 128 pages) ke liye sirf **min aur max** value store karta hai. Matlab 100 GB ke table ka BRIN index sirf kuchh MB ka hota hai. Query ke waqt wo un block ranges ko skip kar deta hai jinka min-max range match nahi karta.') },
    { type: 'p', text: x('But BRIN has one **hard requirement**: the data must be physically sorted (or nearly). Log tables, events, IoT readings — where rows are inserted in time order — are where BRIN shines. If the data is in random order BRIN is useless, because every block range\'s min–max covers everything.', 'Par BRIN ki ek **zaroori shart** hai: data physically sorted hona chahiye (ya lagbhag). Log tables, events, IoT readings — jahan rows time ke kram mein hi insert hoti hain — wahan BRIN kamaal karta hai. Agar data random order mein hai to BRIN bekaar hai, kyunki har block range ka min-max poora range cover karega.') },
    { type: 'p', text: x('GIN vs GiST: GIN is an "inverted index" — a list of rows for each value. Very fast for lookups but expensive to update (hence the `fastupdate` pending list). GiST is a generalized search tree — cheaper to update, a little slower to look up, and it supports operations like "nearest neighbour" that GIN can\'t.', 'GIN vs GiST ka farak: GIN "inverted index" hai — har value ke liye rows ki list. Ye lookup mein bahut tez hai par update mein mehnga (isiliye `fastupdate` pending list hoti hai). GiST ek generalized search tree hai — update mein sasta, lookup mein thoda dheema, aur "nearest neighbour" jaise operations support karta hai jo GIN nahi kar sakta.') }

{
  id: 'index-only-scan', section: 'index', layout: 'default',

  title: x('Index-only scans and INCLUDE — don\'t even visit the heap', 'Index-only scan aur INCLUDE — heap tak jaana hi mat'),
  blocks: [

    { type: 'callout', tone: 'key', title: x('The hidden condition of index-only scans', 'Index-only scan ka chhupa hua condition'), text: x('An index doesn\'t record whether a row is "visible" (MVCC). So Postgres checks the **visibility map** — if a page is "all-visible", it doesn\'t need to visit the heap. And the visibility map is updated by **VACUUM**. So if VACUUM hasn\'t run, even an index-only scan does heap fetches and the benefit disappears. That\'s a direct link between VACUUM and performance.', 'Index mein ye nahi likha hota ki row "visible" hai ya nahi (MVCC). Isliye Postgres **visibility map** dekhta hai — agar page "all-visible" hai to heap tak jaane ki zaroorat nahi. Aur visibility map ko **VACUUM** update karta hai. Matlab: agar VACUUM nahi chala to index-only scan bhi heap fetches karega aur faayda khatam. Ye VACUUM aur performance ka ek seedha connection hai.') }

{

  title: x('How the planner thinks — like an auto-rickshaw driver', 'Planner kaise sochta hai — ek auto driver ki tarah'),

{
  id: 'explain-nodes-scan', section: 'explain', layout: 'default',

  title: x('Scan nodes — where the data comes from', 'Scan nodes — data kahan se aa raha hai'),
  blocks: [
    { type: 'table', compact: true,

        ['`Bitmap Heap Scan` + `Bitmap Index Scan`', x('Build a bitmap of matching ctids first, then read the heap in order', 'Pehle matching ctids ka bitmap banao, phir heap ko kram se padho'), x('✓ Fine — for a medium number of rows', '✓ Theek — madhyam ginti ki rows ke liye')],

{
  id: 'explain-nodes-join', section: 'explain', layout: 'default',

  blocks: [

      { k: 'Nested Loop', v: x('A lookup on the right for every left row. Check `loops=` — if it\'s in the thousands with a Seq Scan inside, **that\'s the problem**.', 'Baayen ki har row par daayen mein lookup. `loops=` dekho — agar hazaron hain aur andar Seq Scan hai to **yahi problem hai**.') },
      { k: 'Hash Join + Hash', v: x('Builds a hash table of the smaller side. `Batches: 1` is good; `Batches: 8` means `work_mem` ran short and it spilled to disk.', 'Chhoti side ki hash table banti hai. `Batches: 1` achha; `Batches: 8` matlab `work_mem` kam pada aur disk par spill hua.') },
      { k: 'Merge Join', v: x('Both sorted, walked together. Best on large sorted data.', 'Dono sorted, saath-saath. Bade sorted data par best.') },
      { k: 'Sort', v: x('`Sort Method: quicksort Memory: 25kB` is good. `external merge Disk: 82MB` means it\'s sorting on disk — raise `work_mem` or add an index.', '`Sort Method: quicksort Memory: 25kB` achha. `external merge Disk: 82MB` matlab disk par sort ho raha hai — `work_mem` badhao ya index do.') },
      { k: 'HashAggregate', v: x('GROUP BY via hashing. Fast.', 'GROUP BY hash se. Tez.') },
      { k: 'GroupAggregate', v: x('GROUP BY on sorted input. Needs a sort.', 'GROUP BY sorted input par. Sort chahiye.') },

{
  id: 'explain-stats', section: 'explain', layout: 'code',

  title: x('Where the planner\'s knowledge comes from', 'Planner ka gyaan kahan se aata hai'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [

      'SELECT attname, n_distinct, null_frac, avg_width,',

      '',
