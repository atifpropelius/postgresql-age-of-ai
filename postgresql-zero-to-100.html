/* ═══════════════ 16 · PERFORMANCE TUNING ═════════════════════════════════ */
{
  id: 'perf-workflow', section: 'perf', layout: 'default',
  kicker: 'Big Idea',
  title: x('"The database is slow" — now what?', '"Database slow hai" — ab kya karoge?'),
  blocks: [
    { type: 'steps', items: [
      { label: x('Ask: what is slow?', 'Poochho: kya slow hai?'), text: x('One query, one page, or everything? "Everything is slow" and "one query is slow" have completely different cures', 'Ek query, ek page, ya sab kuchh? "Sab slow" aur "ek query slow" ke ilaaj bilkul alag hain') },
      { label: x('Since when?', 'Kab se?'), text: x('Suddenly (a deploy? data growth? a plan flip?) or gradually (bloat? a missing index?)', 'Achanak (deploy? data growth? plan flip?) ya dheere-dheere (bloat? index missing?)') },
      { label: x('Check the server', 'Server dekho'), text: x('CPU, RAM, disk I/O, connections. If the server itself is saturated, query tuning won\'t help', 'CPU, RAM, disk I/O, connections. Server hi bhara hai to query tuning bekaar hai') },
      { label: x('Check pg_stat_activity', 'pg_stat_activity dekho'), text: x('Who is running what, who is waiting on a lock, and for how long', 'Kaun kya chala raha hai, kaun lock ka intezaar kar raha hai, kitni der se') },
      { label: x('Check pg_stat_statements', 'pg_stat_statements dekho'), text: x('The top 10 queries by total time', 'Total time ke hisaab se top 10 queries') },
      { label: x('Pick one query, run EXPLAIN', 'Ek query pakdo, EXPLAIN karo'), text: x('Now it\'s the Section 15 workflow', 'Ab Section 15 wala workflow') },
      { label: x('Fix, measure, write it down', 'Fix karo, maapo, likho'), text: x('One change, one measurement, one note', 'Ek badlav, ek measurement, ek note') }
    ] },
    { type: 'callout', tone: 'key', title: x('The most important question first', 'Sabse important sawaal pehle'), text: x('"Should this query even run at all?" Often the best fix isn\'t tuning — it\'s running the query less (caching), having its result ready in advance (a materialized view), or removing it entirely (an N+1 fix).', '"Kya ye query bilkul chalni bhi chahiye?" Aksar sabse achha fix query tuning nahi hota — wo hota hai us query ko kam baar chalana (caching), ya uska result pehle se ready rakhna (materialized view), ya usse poori tarah hata dena (N+1 fix).') }
  ],
  takeaway: x('Server → connections → top queries → one query. Top down. Never the other way round.', 'Server → connections → top queries → ek query. Upar se neeche. Ulta mat karo.')
},
{
  id: 'perf-pgss', section: 'perf', layout: 'code',
  kicker: x('The most essential extension', 'Sabse zaroori extension'),
  title: x('pg_stat_statements — every production DB should have it', 'pg_stat_statements — ye har production DB mein hona chahiye'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- In postgresql.conf: shared_preload_libraries = \'pg_stat_statements\'', "-- postgresql.conf mein: shared_preload_libraries = 'pg_stat_statements'"),
      x('-- then restart, then:', '-- phir restart, phir:'),
      'CREATE EXTENSION pg_stat_statements;',
      '',
      x('-- Top 10 most expensive queries (by TOTAL time, not mean!)', '-- Top 10 sabse mehngi queries (TOTAL time se, mean se nahi!)'),
      'SELECT',
      '  round(total_exec_time::numeric, 1)      AS total_ms,',
      '  calls,',
      '  round(mean_exec_time::numeric, 2)       AS mean_ms,',
      '  round(100 * total_exec_time / sum(total_exec_time) OVER (), 1) AS pct,',
      '  rows,',
      '  left(query, 80) AS query',
      'FROM pg_stat_statements',
      'ORDER BY total_exec_time DESC LIMIT 10;',
      '',
      '-- Cache hit ratio per query',
      'SELECT query, shared_blks_hit, shared_blks_read,',
      '  round(100.0 * shared_blks_hit / nullif(shared_blks_hit + shared_blks_read, 0), 1) AS hit_pct',
      'FROM pg_stat_statements ORDER BY shared_blks_read DESC LIMIT 10;',
      '',
      x('-- Reset the counters (fresh measurement after a deploy)', '-- Counters reset karo (deploy ke baad fresh measurement)'),
      'SELECT pg_stat_statements_reset();'
    ] },
    { type: 'callout', tone: 'tip', title: x('Why this extension matters most', 'Ye extension kyun sabse zaroori hai'), text: x('Without it you\'re in the dark. People keep tuning the query they "think" is slow while the real pain is elsewhere. `pg_stat_statements` normalizes queries (strips parameters) and aggregates them, so you discover that a tiny query running 5 million times is actually your biggest cost.', 'Iske bina tum andhere mein ho. Log "shaayad" wali query tune karte rehte hain jabki asli dard kahin aur hota hai. `pg_stat_statements` queries ko normalize karke (parameters hata kar) jodta hai, isliye tumhe pata chalta hai ki ek chhoti query jo 50 lakh baar chal rahi hai, wo asal mein sabse bada kharcha hai.') }
  ],
  takeaway: x('Sort by `total_exec_time`. `mean_exec_time` misleads.', '`total_exec_time` se sort karo. `mean_exec_time` dhoka deta hai.')
},
{
  id: 'perf-n-plus-1', section: 'perf', layout: 'code',
  kicker: x('The most common performance bug', 'Sabse aam performance bug'),

      x('-- Fix 2: IN batch (what an ORM\'s "eager load" / "include" does)', '-- Fix 2: IN batch (ORM ka "eager load" / "include" yahi karta hai)'),
      x('SELECT * FROM customers WHERE id = ANY($1);   -- one call, an array of ids', 'SELECT * FROM customers WHERE id = ANY($1);   -- ek hi call, array of ids'),
      '',
      x('-- Fix 3: JSON aggregation — nested data in one query', '-- Fix 3: JSON aggregate — nested data ek hi query mein'),
      'SELECT o.id, o.total,',

{
  id: 'perf-pooling', section: 'perf', layout: 'diagram',

  blocks: [
    { type: 'diagram', id: 'pooling' }
  ],
  takeaway: x('Rule of thumb: `max_connections` ≈ (CPU cores × 2) + disk spindles. Almost never more than 100–200.', 'Rule of thumb: `max_connections` ≈ (CPU cores × 2) + disk spindles. 100–200 se zyada lagbhag kabhi nahi.'),
  info: [
    { type: 'p', text: x('PgBouncer has three modes. **Session pooling**: a client connection gets one server connection for the whole session — safest, least benefit. **Transaction pooling**: a server connection is held only during a transaction — **the most widely used**, big benefit. **Statement pooling**: per statement — very restrictive, rarely used.', 'PgBouncer ke teen modes hain. **Session pooling**: ek client connection ko poore session ke liye ek server connection milta hai — sabse safe, sabse kam faayda. **Transaction pooling**: server connection sirf transaction ke dauraan milta hai — **sabse zyada use hota hai**, bahut zyada faayda. **Statement pooling**: har statement par — bahut restrictive, kam use hota hai.') },
    { type: 'p', text: x('Know what transaction pooling breaks: session-level features. `SET` (session variables), prepared statements (unless the server-side protocol handles them), `LISTEN/NOTIFY`, advisory locks taken outside a transaction, and temporary tables. If your ORM uses prepared statements, newer PgBouncer versions (1.21+) handle them, but older ones don\'t — a classic production surprise.', 'Transaction pooling mein kya toot-ta hai, ye zaroor jaano: session-level cheezein. `SET` (session variables), prepared statements (jab tak server-side protocol handle na kare), `LISTEN/NOTIFY`, advisory locks jo transaction ke bahar liye gaye hon, aur temporary tables. Agar tumhara ORM prepared statements use karta hai to PgBouncer ke naye versions (1.21+) usko handle kar lete hain, par purane nahi — aur ye ek classic production surprise hai.') },
    { type: 'p', text: x('You also need an app-side pool (HikariCP, pgxpool, node-postgres Pool, SQLAlchemy pool). A common mistake: making the app pool too big. 10 app pods × 50 connections = 500 connections. Postgres suffers. Keep app pools small (5–20 per pod) and put PgBouncer in between.', 'App-side pool bhi chahiye (HikariCP, pgxpool, node-postgres Pool, SQLAlchemy pool). Ek aam galti: app pool ka size bahut bada rakh dena. 10 app pods × 50 connections = 500 connections. Postgres pareshan. App pool chhota rakho (5-20 per pod) aur beech mein PgBouncer lagao.') }
  ]
},

      { k: 'Non-repeatable read', v: x('Read the same row twice and get different values.', 'Ek hi row do baar padho, values alag aayein.') },
      { k: 'Phantom read', v: x('Run the same query twice and new rows appear.', 'Ek hi query do baar chalao, nayi rows aa jaayein.') },
      { k: 'Serialization anomaly', v: x('Each transaction is fine alone, but together they produce a result no serial order could.', 'Sab individually theek, par mila kar aisa result jo kisi bhi serial order se nahi aa sakta.') }
    ] },
    { type: 'code', lang: 'sql', lines: [
      'BEGIN ISOLATION LEVEL REPEATABLE READ;',
      'BEGIN ISOLATION LEVEL SERIALIZABLE;',
      "SET default_transaction_isolation = 'read committed';"
    ] }
  ],
  takeaway: x('The default is Read Committed. For financial/booking logic, consider SERIALIZABLE + a retry loop.', 'Default Read Committed hai. Financial/booking logic ke liye SERIALIZABLE + retry loop socho.'),
  info: [
    { type: 'p', text: x('A very important and surprising Read Committed behaviour: **the snapshot is fixed within one statement, but each new statement gets a fresh snapshot**. So running the same `SELECT count(*)` twice in one transaction can give two different answers. Most people assume the world freezes at `BEGIN` — it doesn\'t.', 'Read Committed ka ek bahut important aur chaunka dene wala behaviour: **ek hi statement ke andar bhi snapshot ek hi hota hai, par do statements ke beech naya snapshot milta hai**. Matlab ek transaction mein do baar wahi `SELECT count(*)` chalao aur do alag answers aa sakte hain. Zyadatar log sochte hain ki `BEGIN` karte hi duniya ruk jaati hai — nahi rukti.') },
    { type: 'p', text: x('Postgres\'s `SERIALIZABLE` uses **Serializable Snapshot Isolation (SSI)**. It doesn\'t take locks — it lets things run, and if at the end the result couldn\'t match any serial order, it fails one transaction: `ERROR: could not serialize access due to read/write dependencies`. Which means: **if you use SERIALIZABLE, you must write retry logic.** Without retries it\'s useless.', 'Postgres ka `SERIALIZABLE` **Serializable Snapshot Isolation (SSI)** use karta hai. Ye locks nahi lagata — ye chalne deta hai aur agar aakhir mein pata chale ki result serial order se match nahi karta to ek transaction ko fail kar deta hai: `ERROR: could not serialize access due to read/write dependencies`. Iska matlab: **agar tum SERIALIZABLE use kar rahe ho to tumhe retry logic likhna hi padega.** Bina retry ke wo bekaar hai.') },
    { type: 'p', text: x('Practical advice: 95% of code works fine under Read Committed if you use atomic UPDATEs (`SET stock = stock - 1 WHERE stock > 0`) and `SELECT FOR UPDATE` in the right places. Use SERIALIZABLE when the logic is complex (invariants across several tables) and mistakes are costly.', 'Practical salaah: 95% code Read Committed par theek chalta hai agar tum atomic UPDATEs (`SET stock = stock - 1 WHERE stock > 0`) aur `SELECT FOR UPDATE` sahi jagah use karo. SERIALIZABLE tab lo jab logic complex ho (kai tables ke beech invariants) aur galti ki keemat zyada ho.') }
  ]
},
{
  id: 'tx-mvcc', section: 'tx', layout: 'diagram',
  kicker: 'How It Actually Works',
  title: x('MVCC — the heart of Postgres', 'MVCC — Postgres ka dil'),
  blocks: [
    { type: 'diagram', id: 'mvcc' }
  ],
  takeaway: x('Readers don\'t block writers. That\'s Postgres\'s biggest strength — and bloat is its price.', 'Readers writers ko block nahi karte. Ye Postgres ki sabse badi khoobi hai — aur bloat uski keemat.'),
  info: [
    { type: 'p', text: x('Every row has two hidden columns: `xmin` (which transaction created it) and `xmax` (which transaction deleted/replaced it). You can see them: `SELECT xmin, xmax, ctid, * FROM orders LIMIT 5;`. When a transaction starts it gets a **snapshot** — "which transaction IDs had committed by then". For each row, Postgres then checks: "is its xmin visible in my snapshot, and is its xmax not yet visible?"', 'Har row mein do chhupe columns hote hain: `xmin` (kis transaction ne banaya) aur `xmax` (kis transaction ne hataya/badla). Tum inhe dekh sakte ho: `SELECT xmin, xmax, ctid, * FROM orders LIMIT 5;`. Jab ek transaction shuru hoti hai to use ek **snapshot** milta hai — matlab "kaunsi transaction IDs us waqt tak commit ho chuki thi". Phir har row ke liye Postgres check karta hai: "kya iska xmin mere snapshot mein visible hai, aur kya iska xmax abhi tak visible nahi hua?"') },
    { type: 'p', text: x('`UPDATE` doesn\'t actually "update" anything. It sets the old row\'s `xmax` and writes a **new row**. That\'s why an UPDATE in Postgres costs about as much as an INSERT, and why updating the same row over and over bloats the table. (HOT updates reduce this pain — section 18.)', '`UPDATE` asal mein "update" karta hi nahi. Wo purani row ka `xmax` set karta hai aur ek **nayi row** likhta hai. Isiliye Postgres mein UPDATE lagbhag INSERT jitna mehnga hai, aur isiliye ek hi row ko baar-baar update karne se table bloat hota hai. (HOT updates is dard ko kam karte hain — section 18.)') },
    { type: 'p', text: x('Why this design was chosen: **readers never take locks**. Oracle does MVCC too, but via an undo log. SQL Server uses locks by default — there, a long report can block the whole table. In Postgres the report keeps running and writes keep running too. The price: old versions sit on disk until VACUUM comes along.', 'Ye design kyun chuna gaya: kyunki isse **readers ko kabhi lock nahi lagta**. Oracle bhi MVCC karta hai par undo log se. SQL Server default mein locks use karta hai — wahan ek lambi report poore table ko block kar sakti hai. Postgres mein report chalti rahegi aur writes bhi chalte rahenge. Keemat: purani versions disk par padi rehti hain jab tak VACUUM na aaye.') }
  ]
},
{
  id: 'tx-locking', section: 'tx', layout: 'default',

  blocks: [
    { type: 'code', lang: 'sql', lines: [

{
  id: 'tx-lock-types', section: 'tx', layout: 'default',

      rows: [
        ['`ACCESS SHARE`', 'SELECT', x('Only ACCESS EXCLUSIVE', 'Sirf ACCESS EXCLUSIVE')],
        ['`ROW SHARE`', 'SELECT FOR UPDATE/SHARE', 'EXCLUSIVE, ACCESS EXCLUSIVE'],
        ['`ROW EXCLUSIVE`', 'INSERT, UPDATE, DELETE', x('SHARE and above', 'SHARE aur upar')],

        ['`EXCLUSIVE`', x('REFRESH MAT VIEW (without CONCURRENTLY)', 'REFRESH MAT VIEW (bina CONCURRENTLY)'), x('Almost everything', 'Lagbhag sab kuchh')],

      '       blocking.pid AS blocking_pid,',
      '       blocking.query AS blocking_query,',
      '       now() - blocking.query_start AS blocking_duration',
      'FROM pg_stat_activity blocked',
      'JOIN pg_stat_activity blocking',
      '  ON blocking.pid = ANY(pg_blocking_pids(blocked.pid))',
      'WHERE cardinality(pg_blocking_pids(blocked.pid)) > 0;',
      '',
      x('-- Last resort', '-- Aakhri upaay'),
      x('SELECT pg_cancel_backend(12345);    -- cancel the query (gentle)', 'SELECT pg_cancel_backend(12345);    -- query cancel (nazuk)'),
      x('SELECT pg_terminate_backend(12345); -- kill the connection (harsh)', 'SELECT pg_terminate_backend(12345); -- connection maaro (kathor)')
    ] },
    { type: 'callout', tone: 'trap', title: x('The lock-queue domino effect', 'Lock queue ka domino effect'), text: x('Locks form a queue. If a long `SELECT` is running and you issue `ALTER TABLE`, the ALTER waits. And **every new SELECT queues up behind the ALTER** — because it lines up behind the ACCESS EXCLUSIVE request. One small ALTER takes the whole app down. Hence `lock_timeout`, always.', 'Lock queue hai. Agar ek lambi `SELECT` chal rahi hai aur tum `ALTER TABLE` maarte ho, to ALTER intezaar karega. Aur **ALTER ke peechhe har nayi SELECT bhi ruk jaayegi** — kyunki wo ACCESS EXCLUSIVE ke peechhe queue mein lag jaati hai. Ek chhota ALTER poore app ko gira deta hai. Isiliye `lock_timeout` hamesha.') }
  ],
  takeaway: x('ALTER/DROP/TRUNCATE = ACCESS EXCLUSIVE = everything stops. Always run them with `lock_timeout`.', 'ALTER/DROP/TRUNCATE = ACCESS EXCLUSIVE = sab ruk jaata hai. Inhe hamesha `lock_timeout` ke saath chalao.')

{
  id: 'tx-deadlock', section: 'tx', layout: 'diagram',
  kicker: 'Deadlock',
  title: 'Do transactions, aamne-saamne',
  blocks: [
    { type: 'diagram', id: 'deadlock' }
  ],
  takeaway: x('A deadlock isn\'t a bug, it\'s a behaviour. The app must know how to retry.', 'Deadlock bug nahi, ek behaviour hai. App ko usse retry karna aana chahiye.'),
  info: [
    { type: 'p', text: x('Every second (`deadlock_timeout`, default 1s) Postgres checks whether a cycle has formed. If it finds one, it picks one transaction and kills it — which is good, otherwise both would wait forever. The error code is `40P01`.', 'Postgres har second (`deadlock_timeout`, default 1s) check karta hai ki koi cycle to nahi bana. Cycle mile to wo ek transaction ko chun kar maar deta hai — jo ek achhi baat hai, warna dono hamesha ke liye atak jaate. Error code `40P01` hota hai.') },
    { type: 'p', text: x('Three ways to avoid it: **(1) Consistent lock order** — always lock rows in the same order, e.g. `ORDER BY id`. This is the most effective cure. **(2) Keep transactions short** — the less time you hold locks, the fewer collisions. **(3) Retry in the app** — rerun the transaction on deadlock and serialization failures, with exponential backoff.', 'Bachne ke teen tareeke: **(1) Consistent lock order** — hamesha rows ko ek hi kram mein lock karo, jaise `ORDER BY id`. Ye sabse asardaar ilaaj hai. **(2) Transactions chhoti rakho** — jitna kam waqt lock pakdoge utna kam takraav. **(3) App mein retry** — deadlock aur serialization failures par transaction ko dobara chalao, exponential backoff ke saath.') },
    { type: 'p', text: x('A practical example that happens a lot: in a bulk update, each transaction touches rows in a different order (say, coming from a hash map). Just `sort` the IDs — the deadlocks disappear. It\'s a one-line fix people hunt for weeks.', 'Ek practical misaal jo bahut hoti hai: bulk update mein rows ka order har transaction mein alag hota hai (jaise ek hash map se aaya). Bas `sort` kar do IDs ko — deadlocks gayab ho jaate hain. Ye ek line ka fix hai jo log hafton dhoondhte rehte hain.') }
  ]
},
{
  id: 'tx-idle', section: 'tx', layout: 'default',
  kicker: 'Production killer',
  title: x('"idle in transaction" — Postgres\'s most hidden poison', '"idle in transaction" — Postgres ka sabse chhupa hua zeher'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- This query should run daily on every production DB', '-- Ye query har production DB par roz chalni chahiye'),
      'SELECT pid, usename, state,',
      '       now() - state_change AS idle_duration,',
      '       now() - xact_start   AS xact_duration,',
      '       left(query, 60)',
      'FROM pg_stat_activity',

      'ORDER BY xact_start;',
      '',

    { type: 'ul', items: [
      x('**What it is:** a connection ran `BEGIN`, did something, and is now doing nothing — but never ran `COMMIT`.', '**Kya hai:** Ek connection ne `BEGIN` kiya, kuchh kiya, aur ab kuchh nahi kar raha — par `COMMIT` bhi nahi kiya.'),
      x('**Why it happens:** the app opened a transaction and then made an HTTP call. Or an exception fired and no rollback happened. Or a debugger breakpoint is sitting there.', '**Kyun hota hai:** App ne transaction khola aur phir ek HTTP call kar di. Ya exception aa gaya aur rollback nahi hua. Ya debugger par breakpoint laga hai.'),
      x('**What it breaks:** (1) Locks stay held. (2) **Autovacuum can\'t clean dead rows newer than that transaction** — across the whole database, not just that table. (3) A connection slot stays occupied.', '**Kya bigadta hai:** (1) Locks pakde rehte hain. (2) **Autovacuum us transaction se purani dead rows saaf nahi kar sakta** — poore database mein, sirf us table mein nahi. (3) Connection slot ghira rehta hai.'),

  takeaway: x('Setting `idle_in_transaction_session_timeout` takes 2 minutes and saves months of pain.', '`idle_in_transaction_session_timeout` set karna 2 minute ka kaam hai aur mahine ka dard bacha deta hai.')
},
{
  id: 'tx-retry', section: 'tx', layout: 'default',
  kicker: 'App code pattern',
  title: x('Retry logic — which errors to retry', 'Retry logic — kaunse errors retry karne chahiye'),
  blocks: [
    { type: 'code', lang: 'txt', lines: [
      'async function withRetry(fn, attempts = 3) {',
      '  for (let i = 0; i < attempts; i++) {',
      '    try {',
      '      return await fn();',
      '    } catch (e) {',
      '      // 40001 = serialization_failure, 40P01 = deadlock_detected',
      '      const retryable = e.code === "40001" || e.code === "40P01";',
      '      if (!retryable || i === attempts - 1) throw e;',
      '      await sleep(50 * Math.pow(2, i) + Math.random() * 50); // backoff + jitter',
      '    }',
      '  }',
      '}'
    ] },
    { type: 'table', compact: true,
      head: ['SQLSTATE', x('Meaning', 'Matlab'), 'Retry?'],
      rows: [

        ['`40P01`', 'deadlock_detected', x('✓ Yes', '✓ Haan')],

/* ═══════════════ 18 · VACUUM AUR BLOAT ═══════════════════════════════════ */
{
  id: 'vacuum-why', section: 'vacuum', layout: 'diagram',
  kicker: x('Postgres\'s biggest gotcha', 'Postgres ka sabse bada gotcha'),
  title: x('Dead tuples and bloat', 'Dead tuples aur bloat'),
  blocks: [
    { type: 'diagram', id: 'vacuum' }
  ],
  takeaway: x('MVCC isn\'t free. VACUUM is the bill — and if you don\'t pay it, interest accrues.', 'MVCC free nahi hai. VACUUM uska bill hai — aur agar bill na bharo to interest lagta hai.'),
  info: [
    { type: 'p', text: x('The full list of what VACUUM does is worth memorising: **(1)** frees dead tuples\' space for reuse (the file doesn\'t shrink — the space stays reserved for that table). **(2)** Updates the **visibility map**, which makes index-only scans possible. **(3)** **Freezes** old transaction IDs, which prevents transaction ID wraparound. **(4)** Run with `ANALYZE`, it also refreshes statistics.', 'VACUUM kya-kya karta hai, ye poori list yaad rakhne layak hai: **(1)** dead tuples ki jagah dobara istemaal ke liye free karta hai (file chhoti nahi hoti — wo jagah usi table ke liye reserve rehti hai). **(2)** **Visibility map** update karta hai, jo index-only scans ko possible banata hai. **(3)** **Freeze** karta hai purani transaction IDs ko, jo transaction ID wraparound se bachata hai. **(4)** `ANALYZE` ke saath chalao to statistics bhi update karta hai.') },
    { type: 'p', text: x('Bloat\'s real cost isn\'t just disk. A bloated table has fewer live rows per page, so every query reads more pages, so shared_buffers holds less useful data, so the cache hit ratio drops, so disk I/O rises. A 5x bloated table is roughly 5x slower.', 'Bloat ka asli nuksaan sirf disk nahi hai. Ek bloated table ka matlab hai ki ek page mein kam live rows hain, isliye har query ko zyada pages padhne padte hain, isliye shared_buffers mein kam kaam ka data aata hai, isliye cache hit ratio girta hai, isliye disk I/O badhta hai. Ek 5x bloated table lagbhag 5x dheemi hoti hai.') }
  ]
},
{
  id: 'vacuum-auto', section: 'vacuum', layout: 'code',
  kicker: 'Autovacuum',
  title: x('Autovacuum — when it runs and why it falls short', 'Autovacuum — kab chalta hai aur kyun kam pad jaata hai'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      x('-- Autovacuum\'s trigger formula:', '-- Autovacuum ka trigger formula:'),
      '-- dead_tuples > autovacuum_vacuum_threshold',
      '--               + autovacuum_vacuum_scale_factor * total_rows',

      'ALTER TABLE orders SET (',

      '  autovacuum_vacuum_threshold = 1000,',

    ] },
    { type: 'callout', tone: 'warn', title: x('What blocks autovacuum', 'Autovacuum ko kya rokta hai'), text: x('**(1)** A long-running or `idle in transaction` session — dead rows newer than it can\'t be cleaned. **(2)** A stale replication slot (that nobody is consuming). **(3)** `autovacuum_max_workers` (default 3) running out. **(4)** Too much cost-based delay. Check these four places — they cover 90% of bloat incidents.', '**(1)** Lambi chalti transaction ya `idle in transaction` — uss se purani dead rows saaf nahi ho sakti. **(2)** Purana replication slot (jo koi consume nahi kar raha). **(3)** `autovacuum_max_workers` (default 3) kam pad jaana. **(4)** Cost-based delay bahut zyada hona. In chaar jagah dekhna — yahi 90% bloat incidents hain.') }

{
  id: 'vacuum-freeze', section: 'vacuum', layout: 'code',
  kicker: 'Transaction ID wraparound',
  title: x('The problem that shuts a database down', 'Wo problem jo database ko band kar deti hai'),
  blocks: [
    { type: 'p', text: x('Transaction IDs are 32-bit — about 4.2 billion. When they run out, wraparound happens and old rows start to look like they\'re "from the future" — meaning the data would **vanish**. To prevent this, Postgres marks old rows as "frozen". If VACUUM doesn\'t run for long enough, Postgres **stops accepting new writes** — to protect itself.', 'Transaction IDs 32-bit hain — lagbhag 4.2 arab. Jab ye khatam hote hain to wraparound hota hai aur purani rows "bhavishya se" lagne lagti hain — matlab data **gayab** ho jaata. Isse bachne ke liye Postgres purani rows ko "frozen" mark karta hai. Agar VACUUM kaafi der tak na chale to Postgres **naye writes band kar deta hai** — apne aap ko bachane ke liye.') },
    { type: 'code', lang: 'sql', lines: [
      x('-- How much danger you\'re in — monitor this on every production DB', '-- Kitna khatra hai — ye har production DB par monitor karo'),
      'SELECT relname,',
      '  age(relfrozenxid) AS xid_age,',
      '  round(100.0 * age(relfrozenxid) / 2000000000, 1) AS pct_to_wraparound',
      'FROM pg_class WHERE relkind = \'r\'',
      'ORDER BY age(relfrozenxid) DESC LIMIT 10;',
      '',
      x('-- Warning messages in the logs:', '-- Warning messages logs mein:'),
      '-- WARNING: database "shop" must be vacuumed within 10000000 transactions',
      '-- ERROR: database is not accepting commands to avoid wraparound data loss',

{
  id: 'vacuum-hot', section: 'vacuum', layout: 'default',
  kicker: 'Optimization',
  title: x('HOT updates and fillfactor — a trick to reduce bloat', 'HOT updates aur fillfactor — bloat kam karne ka trick'),
  blocks: [
    { type: 'p', text: x('**HOT** = Heap-Only Tuple. If an UPDATE (a) doesn\'t change any indexed column **and** (b) the new row fits on the same page, Postgres doesn\'t touch the indexes at all — it builds a chain inside the page. That\'s very cheap.', '**HOT** = Heap-Only Tuple. Agar ek UPDATE (a) kisi indexed column ko nahi badalta **aur** (b) nayi row usi page par fit ho jaati hai, to Postgres indexes ko update hi nahi karta — wo page ke andar ek chain bana deta hai. Ye bahut sasta hai.') },
    { type: 'code', lang: 'sql', lines: [
      x('-- Check the HOT update ratio (higher = better)', '-- HOT update ratio dekho (zyada = achha)'),
      'SELECT relname, n_tup_upd, n_tup_hot_upd,',
      '  round(100.0 * n_tup_hot_upd / nullif(n_tup_upd, 0), 1) AS hot_pct',
      'FROM pg_stat_user_tables WHERE n_tup_upd > 0 ORDER BY n_tup_upd DESC;',
      '',
      x('-- Fillfactor: leave space in each page so HOT updates can happen', '-- Fillfactor: page mein jagah chhodo taaki HOT update ho sake'),
      x('ALTER TABLE sessions SET (fillfactor = 70);   -- 30% left free', 'ALTER TABLE sessions SET (fillfactor = 70);   -- 30% jagah khaali'),
      x('VACUUM FULL sessions;   -- to rewrite the existing pages (takes a lock!)', 'VACUUM FULL sessions;   -- purane pages ko rewrite karne ke liye (lock lega!)'),
      '',
      x('-- Rule: fillfactor 70-85 for heavily updated tables', '-- Rule: bahut UPDATE hone wali tables par fillfactor 70-85'),
      x('--       100 (the default) is right for append-only tables (logs)', '--       append-only tables (logs) par 100 (default) hi theek')
    ] },
    { type: 'callout', tone: 'tip', title: x('Two practical lessons', 'Do practical sabak'), text: x('**(1)** Do **not** index a column you update very often (`last_seen_at`, `view_count`) — the index kills HOT updates. **(2)** If a table has a low hot_pct and lots of updates, lower its fillfactor. These two small changes can halve bloat.', '**(1)** Jis column ko tum bahut baar update karte ho (`last_seen_at`, `view_count`) uspar index **mat** banao — index hone se HOT update khatam ho jaata hai. **(2)** Agar ek table par hot_pct kam hai aur updates bahut hain, to fillfactor ghatao. Ye do chhote badlav bloat ko aadha kar sakte hain.') }
  ],
  takeaway: x('Frequently updated column + index = a bloat factory. Index deliberately.', 'Frequently-updated column + index = bloat factory. Sochkar index lagao.')
},

    { type: 'callout', tone: 'trap', title: x('VACUUM FULL is a production killer', 'VACUUM FULL production killer hai'), text: x('`VACUUM FULL` takes an ACCESS EXCLUSIVE lock on the whole table and builds a new copy of it — so it needs double the disk space and the table is unavailable for hours. **In production use the `pg_repack` extension** — it does the same job without a long lock.', '`VACUUM FULL` poore table par ACCESS EXCLUSIVE lock leta hai aur table ki ek nayi copy banata hai — matlab double disk space chahiye aur poora table ghanton tak unavailable. **Production mein `pg_repack` extension use karo** — wo wahi kaam bina lambi lock ke karta hai.') }

{
  id: 'wal-what', section: 'durability', layout: 'diagram',
  kicker: 'Durability',
  title: x('WAL — "write down what you\'ll do, then do it"', 'WAL — "pehle likho ki kya karoge, phir karo"'),
  blocks: [
    { type: 'diagram', id: 'wal' }
  ],
  takeaway: x('COMMIT means "the WAL reached disk", not "the table file was updated".', 'COMMIT ka matlab hai "WAL disk par pahunch gaya", na ki "table file update ho gayi".'),
  info: [
    { type: 'p', text: x('WAL stands for **Write-Ahead Log**, and the principle is simple: before any change is written to a data file, a record of it is written to the WAL. Why? Writing to random places in data files is expensive (the disk head jumps around), while the WAL is a **sequential, append-only** file — the fastest disk operation there is.', 'WAL ka poora naam **Write-Ahead Log** hai, aur principle bilkul saaf hai: koi bhi badlav data file mein likhne se pehle uska record WAL mein likha jaayega. Kyun? Kyunki data files mein random jagah par likhna mehnga hai (disk head idhar-udhar), jabki WAL ek **sequential append-only** file hai — sabse tez disk operation.') },
    { type: 'p', text: x('This gives you three things at once: **durability** (recover from the WAL after a crash), **performance** (many changes per fsync) and **replication** (ship the WAL over the network and another server applies the same changes). One mechanism, three big benefits — a beautiful design.', 'Isse teen cheezein ek saath mil jaati hain: **durability** (crash ke baad WAL se recovery), **performance** (ek fsync mein kai changes), aur **replication** (WAL ko network par bhej do, doosra server wahi changes apply kar lega). Ek hi mechanism, teen bade faayde — ye bahut khoobsurat design hai.') },
    { type: 'p', text: x('`synchronous_commit` is an important knob. `on` (default) means COMMIT returns once the WAL is fsynced to disk — safest. `off` means COMMIT returns immediately and the WAL is written shortly after — much faster, but a crash can lose the last few transactions (no corruption, just recent commits missing). For analytics or logging tables, `SET LOCAL synchronous_commit = off` is a genuine optimization.', '`synchronous_commit` ek important knob hai. `on` (default) matlab COMMIT tab lautta hai jab WAL disk par fsync ho chuka — sabse safe. `off` matlab COMMIT turant lautta hai aur WAL thodi der baad likhta hai — bahut tez, par crash par aakhri kuchh transactions kho sakte hain (data corrupt nahi hota, sirf recent commits gayab). Analytics ya logging tables ke liye `SET LOCAL synchronous_commit = off` ek asli optimization hai.') }
  ]
},
{
  id: 'wal-checkpoint', section: 'durability', layout: 'code',
  kicker: 'Checkpoints',
  title: x('Checkpoints — when the dirty pages in RAM go to disk', 'Checkpoint — jab RAM ka kachra disk par jaata hai'),
  blocks: [
    { type: 'p', text: x('A checkpoint is the moment Postgres writes all dirty pages to the data files and says "everything up to here is safe; older WAL is no longer needed".', 'Checkpoint wo kshan hai jab Postgres saare dirty pages ko data files mein likh deta hai aur kehta hai "yahan tak sab safe hai, isse purana WAL ab zaroori nahi".') },
    { type: 'code', lang: 'sql', lines: [
      x('-- Important settings', '-- Zaroori settings'),
      x('checkpoint_timeout = 15min            -- default 5min — raise it', 'checkpoint_timeout = 15min            -- default 5min — badhao'),
      x('max_wal_size = 4GB                    -- default 1GB — raise it', 'max_wal_size = 4GB                    -- default 1GB — badhao'),
      x('checkpoint_completion_target = 0.9    -- spread the I/O, avoid spikes', 'checkpoint_completion_target = 0.9    -- I/O phailao, spike mat banao'),
      'min_wal_size = 1GB',
      '',
      x('-- Check checkpoint health', '-- Checkpoint ki sehat dekho'),
      'SELECT * FROM pg_stat_bgwriter;',
      x('-- checkpoints_timed  (good — happened on schedule)', '-- checkpoints_timed  (achha — time par hua)'),
      x('-- checkpoints_req    (bad — WAL filled up and forced it)', '-- checkpoints_req    (bura — WAL bhar gaya, majboori mein hua)'),
      '',
      x('-- If checkpoints_req is high, raise max_wal_size', '-- Agar checkpoints_req zyada hai to max_wal_size badhao'),
      '',
      x('-- To see checkpoints in the log', '-- Log mein checkpoint dekhna ho'),
      'log_checkpoints = on'
    ] },
    { type: 'callout', tone: 'warn', title: 'Checkpoint spike', text: x('If checkpoints are rare, lots of dirty pages have to be written at once — a disk I/O spike, and every query slows down during it. `checkpoint_completion_target = 0.9` spreads that spike across the whole interval. If you see a latency spike every 5 minutes, this should be your first suspect.', 'Agar checkpoint bahut kam baar hota hai to ek saath bahut saare dirty pages likhne padte hain — disk I/O ka spike, aur us dauraan saari queries dheemi. `checkpoint_completion_target = 0.9` isi spike ko poore interval mein phailata hai. Agar tumhe har 5 minute par latency spike dikhe, to sabse pehla shak yahi hona chahiye.') }
  ],
  takeaway: x('If `checkpoints_req` > `checkpoints_timed`, raise `max_wal_size`.', '`checkpoints_req` > `checkpoints_timed` dikhe to `max_wal_size` badhao.')
},

  blocks: [

      'CREATE OR REPLACE PROCEDURE purge_old_events()',
      'LANGUAGE plpgsql AS $$',
      'DECLARE n int;',
      'BEGIN',
      '  LOOP',
      '    DELETE FROM events WHERE id IN (',
      "      SELECT id FROM events WHERE created_at < now() - interval '90 days' LIMIT 10000",
      '    );',
      '    GET DIAGNOSTICS n = ROW_COUNT;',
      '    EXIT WHEN n = 0;',
      x('    COMMIT;              -- <- COMMIT works in a PROCEDURE, not in a FUNCTION', '    COMMIT;              -- <- PROCEDURE mein COMMIT chal sakta hai, FUNCTION mein nahi'),

      '  END LOOP;',
      'END;',
      '$$;',
      '',
      'CALL purge_old_events();'
    ] },
    { type: 'callout', tone: 'key', title: 'Function vs Procedure', text: x('A **function** returns a value and can run inside a query — but it can\'t `COMMIT` (it\'s already inside a transaction). A **procedure** runs via `CALL`, returns no value (or via `INOUT`), but **can control transactions** — which makes it perfect for batched maintenance jobs.', '**Function** ek value return karta hai aur ek query ke andar chal sakta hai — par uske andar `COMMIT` nahi ho sakta (wo pehle se ek transaction mein hai). **Procedure** `CALL` se chalta hai, value return nahi karta (ya `INOUT` se karta hai), par **transaction control kar sakta hai** — isliye batched maintenance jobs ke liye perfect hai.') }

{
  id: 'jsonb-gotchas', section: 'jsonb', layout: 'default',

  title: x('The hidden costs of JSONB', 'JSONB ke chhupe hue kharche'),
  blocks: [
    { type: 'ul', items: [
      { text: x('**The whole document is rewritten** — updating one field makes Postgres rewrite the entire JSONB (MVCC + TOAST). Big documents + frequent updates = heavy bloat', '**Poora document rewrite hota hai** — ek field update karne par Postgres poora JSONB dobara likhta hai (MVCC + TOAST). Bade documents + baar-baar update = bhaari bloat'), icon: 'no' },
      { text: x('**TOAST** — values over 2 KB go to a separate TOAST table, compressed. Every read pays for decompression', '**TOAST** — 2 KB se bade values alag TOAST table mein jaate hain, compress hote hain. Har read par decompress ka kharcha'), icon: 'no' },
      { text: x('**Weak statistics** — the planner doesn\'t know distributions inside JSONB well, so row estimates can be wrong', '**Statistics kamzor hain** — planner JSONB ke andar ki distribution achhe se nahi jaanta, isliye row estimates galat ho sakte hain'), icon: 'no' },
      { text: x('**Zero type safety** — `user_id` is a number today, a string tomorrow. Nothing stops it', '**Type safety zero** — aaj `user_id` number hai, kal string. Koi nahi rokega'), icon: 'no' },

  ],
  takeaway: x('JSONB gives flexibility, but takes away validation, statistics and update efficiency.', 'JSONB flexibility deta hai, par validation, statistics aur update efficiency cheen leta hai.')

    { type: 'diagram', id: 'partitioning' }
  ],
  takeaway: x('Partitioning\'s biggest benefit isn\'t speed — it\'s **maintenance**. Removing old data becomes instant.', 'Partitioning ka sabse bada faayda speed nahi — **maintenance** hai. Purana data hatana instant ho jaata hai.'),
  info: [
    { type: 'p', text: x('People think partitioning "makes queries faster". That\'s half true. If your query filters on the partition key, pruning helps — but a good index gives nearly the same benefit. **The real benefit is maintenance:** (1) `DROP TABLE events_2025_01` is instant, while `DELETE ... WHERE created_at < X` runs for hours and leaves bloat. (2) VACUUM runs per partition — smaller and faster. (3) Each partition has its own index — smaller, fits in RAM. (4) For bulk loads you can detach a partition, work on it, and attach it back.', 'Log sochte hain partitioning "queries tez karti hai". Wo aadha sach hai. Agar tumhari query partition key par filter karti hai to pruning se faayda hota hai — par ek achha index bhi lagbhag wahi faayda de deta hai. **Asli faayda maintenance mein hai:** (1) `DROP TABLE events_2025_01` instant hai, jabki `DELETE ... WHERE created_at < X` ghanton chalega aur bloat chhodega. (2) VACUUM har partition par alag chalta hai — chhota aur tez. (3) Har partition ka apna index hai — chhota aur RAM mein fit. (4) Bulk load ke liye ek partition detach karke kaam karke wapas attach kar sakte ho.') },
    { type: 'p', text: x('When to partition: the table is heading past ~100 GB, **or** your data is time-based and you regularly delete old data, **or** autovacuum is falling behind on that table. Partitioning small tables only adds complexity.', 'Kab partition karna chahiye: table ~100 GB se upar ja raha ho, **ya** tumhara data time-based hai aur tum purana data regularly delete karte ho, **ya** autovacuum uss table par pichhad raha ho. Chhote tables ko partition karna sirf complexity badhata hai.') }
  ]
},
{
  id: 'partition-how', section: 'partition', layout: 'code',
  kicker: 'Practice',
  title: x('Declarative partitioning — three strategies', 'Declarative partitioning — teen strategies'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [

      '  user_id bigint NOT NULL,',
      '  payload jsonb,',
      '  created_at timestamptz NOT NULL,',
      x('  PRIMARY KEY (id, created_at)      -- the partition key MUST be in the PK', '  PRIMARY KEY (id, created_at)      -- partition key PK mein hona ZAROORI hai'),
      ') PARTITION BY RANGE (created_at);',
      '',
      "CREATE TABLE events_2026_09 PARTITION OF events",
      "  FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');",
      "CREATE TABLE events_2026_10 PARTITION OF events",

      '',

    { type: 'callout', tone: 'warn', title: x('The biggest constraint', 'Sabse badi constraint'), text: x('**The partition key must be part of every UNIQUE / PRIMARY KEY.** So `PRIMARY KEY (id)` won\'t work if you partition on `created_at` — you must write `PRIMARY KEY (id, created_at)`. It also means global uniqueness can\'t be enforced. That\'s partitioning\'s biggest trade-off and it shapes your design.', '**Partition key har UNIQUE / PRIMARY KEY mein hona zaroori hai.** Matlab `PRIMARY KEY (id)` nahi chalega agar partition `created_at` par hai — `PRIMARY KEY (id, created_at)` likhna padega. Iska matlab ye bhi hai ki global uniqueness enforce nahi ho sakti. Ye partitioning ka sabse bada trade-off hai aur design par asar daalta hai.') }

{
  id: 'ops-incident', section: 'ops', layout: 'code',

  title: x('"The database is down" — the first 10 minutes', '"Database down hai" — pehle 10 minute'),

{

      { text: x('**Migrations that take locks** — the ORM doesn\'t know `ALTER` is dangerous on a big table', '**Migrations jo lock leti hain** — ORM ko nahi pata ki `ALTER` bade table par khatarnaak hai'), icon: 'no' },
      { text: x('**Wrong transaction boundaries** — the whole HTTP request inside one transaction', '**Transaction boundaries galat** — poori HTTP request ek transaction mein'), icon: 'no' },

      '    await tx.update(...);',

      '});',

      '',

    { type: 'ol', items: [

      { text: x('**Job queue with SKIP LOCKED** — a simple, dependable queue via `FOR UPDATE SKIP LOCKED`', '**Job queue with SKIP LOCKED** — `FOR UPDATE SKIP LOCKED` se ek simple, bharosemand queue'), sub: x('At small-to-medium scale you don\'t need Redis/RabbitMQ at all', 'Chhote-madhyam scale par Redis/RabbitMQ ki zaroorat hi nahi') },

    ] },

{
  id: 'ai-pgvector', section: 'ai', layout: 'code',

  title: x('Setup and a first vector query', 'Setup aur pehla vector query'),

{
  id: 'ai-rag', section: 'ai', layout: 'diagram',
  kicker: 'RAG',
  title: x('Retrieval-Augmented Generation — the full architecture', 'Retrieval-Augmented Generation — poora architecture'),
  blocks: [
    { type: 'diagram', id: 'rag' }
  ],
  takeaway: x('80% of RAG is retrieval quality, not the LLM. And retrieval is a database problem.', 'RAG ka 80% kaam retrieval quality hai, LLM nahi. Aur retrieval ek database problem hai.'),
  info: [
    { type: 'p', text: x('RAG in one line: **before asking the LLM, have it read the relevant documents.** Without that, the LLM guesses from its training memory (hallucination). With it, the LLM answers from the text you provided and can cite sources.', 'RAG ko ek line mein: **LLM se poochhne se pehle, use zaroori documents padha do.** Iske bina LLM apni training memory se guess karta hai (hallucination). Iske saath wo tumhare diye hue text se jawab banata hai aur source bhi bata sakta hai.') },
    { type: 'p', text: x('There are two separate phases and it\'s important to understand them. **Ingest** (once, or in the background): documents → chunks → embeddings → Postgres. This is slow and expensive (embedding API calls), so batch it and cache it. **Query** (on every question): question → embedding (1 API call) → vector search (1 SQL query) → top-k chunks → LLM prompt. This must be fast — 50–200 ms.', 'Do phases alag-alag hain aur ye samajhna zaroori hai. **Ingest** (ek baar ya background): documents → chunks → embeddings → Postgres. Ye dheema aur mehnga hai (embedding API calls), isliye batch mein karo aur cache karo. **Query** (har sawaal par): sawaal → embedding (1 API call) → vector search (1 SQL query) → top-k chunks → LLM prompt. Ye tez hona chahiye — 50-200 ms.') },
    { type: 'p', text: x('The key insight: when retrieval is a SQL query, you get **for free** — tenant filtering (`WHERE tenant_id = $2`), permission filtering (RLS), date filtering, source filtering, and joins (a chunk plus its document\'s title, author, URL). In a dedicated vector DB all of this is either limited or has to be built separately.', 'Sabse important insight: jab retrieval ek SQL query hai, to tumhe **free mein** mil jaata hai — tenant filtering (`WHERE tenant_id = $2`), permission filtering (RLS), date filtering, source filtering, aur joins (chunk ke saath uske document ka title, author, URL). Ek dedicated vector DB mein ye sab ya to limited hai ya alag se banana padta hai.') }
  ]
},

{
  id: 'ai-hybrid', section: 'ai', layout: 'code',
  kicker: 'Best practice',
  title: x('Hybrid search — keyword + semantic in one query', 'Hybrid search — keyword + semantic, ek hi query mein'),
  blocks: [
    { type: 'code', lang: 'sql', lines: [
      '-- Reciprocal Rank Fusion (RRF) — industry standard',
      'WITH semantic AS (',
      '  SELECT id, row_number() OVER (ORDER BY embedding <=> $1) AS rank',
      '  FROM documents WHERE tenant_id = $3',
      '  ORDER BY embedding <=> $1 LIMIT 50',
      '),',
      'keyword AS (',
      '  SELECT id, row_number() OVER (',
      "    ORDER BY ts_rank(search_vector, websearch_to_tsquery('english', $2)) DESC) AS rank",
      '  FROM documents',
      "  WHERE tenant_id = $3 AND search_vector @@ websearch_to_tsquery('english', $2)",
      '  LIMIT 50',
      ')',
      'SELECT d.id, d.content,',
      '  coalesce(1.0/(60 + s.rank), 0) + coalesce(1.0/(60 + k.rank), 0) AS score',
      'FROM documents d',
      'LEFT JOIN semantic s ON s.id = d.id',
      'LEFT JOIN keyword  k ON k.id = d.id',
      'WHERE s.id IS NOT NULL OR k.id IS NOT NULL',
      'ORDER BY score DESC LIMIT 10;'
    ] },
    { type: 'callout', tone: 'key', title: x('Why hybrid matters', 'Hybrid kyun zaroori hai'), text: x('Vector search **misses exact things** — product codes (`SKU-4471`), error codes (`ERR_2043`), names, numbers. Keyword search **misses meaning** — "how do I get a refund" vs "money back". Combining them covers each one\'s gaps. Every serious RAG system is hybrid.', 'Vector search **exact cheezein miss karta hai** — product codes (`SKU-4471`), error codes (`ERR_2043`), naam, numbers. Keyword search **matlab miss karta hai** — "refund kaise milega" vs "paisa wapas". Dono ko jodne par dono ki kami bhar jaati hai. Har serious RAG system hybrid karta hai.') },
    { type: 'p', tone: 'muted', text: x('And the next step: **reranking** — re-score the top 50 results with a cross-encoder model (like Cohere Rerank). It improves quality considerably, at the cost of some latency.', 'Aur agla step: **reranking** — top 50 results ko ek cross-encoder model (jaise Cohere Rerank) se dobara score karao. Ye quality kaafi badha deta hai, thodi latency ki keemat par.') }
  ],
  takeaway: x('Vector search alone = an incomplete system. Hybrid (vector + FTS) + rerank = production quality.', 'Sirf vector search = adhoora system. Hybrid (vector + FTS) + rerank = production quality.')
},

{
  id: 'q-three', section: 'capstone', layout: 'default',
  kicker: x('Three questions — explain in your own words', 'Teen sawaal — apne shabdon mein samjhao'),
  title: x('These three questions test your real understanding', 'Ye teen sawaal tumhari asli samajh check karte hain'),
  blocks: [
    { type: 'ol', items: [
      { text: x('**Basic Understanding** — What is an index? Explain it with a kirana-store or book analogy, then explain how it works and what it costs. Also describe a situation where Postgres won\'t use an index even though one exists.', '**Basic Understanding** — Index kya hai? Ek kirana store ya kitaab wali analogy se samjhao, phir batao ki wo kaam kaise karta hai aur uski keemat kya hai. Aur ek aisi situation batao jahan index hone ke baawjood Postgres use nahi karega.'), sub: 'Level: recognize + understand' },
      { text: x('**Why** — Why doesn\'t the old row disappear immediately when you `UPDATE` in Postgres? What effects does this have on concurrency, VACUUM, table size and performance? Why might this design have been chosen?', '**Why** — Postgres mein `UPDATE` karne par purani row turant kyun nahi mitti? Iska concurrency, VACUUM, table size, aur performance par kya-kya asar padta hai? Ye design chuna kyun gaya hoga?'), sub: 'Level: understand + connect' },
      { text: x('**Real-World Scenario** — Your e-commerce app\'s checkout API suddenly takes 8 seconds. Yesterday it took 200 ms. Nothing was deployed. Users are complaining. What will you check, in what order, and why? At each step, say what you\'d conclude from what you see.', '**Real-World Scenario** — Tumhare e-commerce app mein checkout API achanak 8 second le rahi hai. Kal tak 200 ms thi. Koi deploy nahi hua. Users complain kar rahe hain. Tum kya-kya check karoge, kis kram mein, aur kyun? Har step par batao ki kya dekhne par kya nateeja nikaloge.'), sub: 'Level: troubleshoot + design' }
    ] },
    { type: 'callout', tone: 'tip', text: x('Answer in writing, not out loud. Then press `i` and compare with the answer guide. For every point you missed, go back to that section.', 'Likhkar jawab do, bolkar nahi. Phir `i` dabakar answer guide se milao. Jo point tumne miss kiya, us section par wapas jao.') }
  ],
  info: [
    { type: 'p', text: x('**Question 1 — a good answer includes:** (a) Analogy: the index at the back of a book / a list of where items sit in a kirana store. (b) Mechanism: a B-tree — sorted, wide and shallow, 3–4 hops to a leaf, the leaf gives a ctid, then the heap. (c) Cost: disk space, an index update on every write, VACUUM work, planning time. (d) When it won\'t be used: on a small table (seq scan is cheaper), low selectivity (too many rows match), a function/cast on the column, a LIKE with a leading `%`, skipping the first column of a composite index, or stale statistics giving the planner a wrong estimate. **Bonus:** pointing out that "an index will make it fast" is a misconception — indexes speed up selective queries, not all queries.', '**Sawaal 1 — achhe jawab mein ye hona chahiye:** (a) Analogy: kitaab ke aakhir ka index / kirana store mein saamaan ki jagah ki list. (b) Mechanism: B-tree, sorted, chauda aur chhota tree, 3-4 hop mein leaf, leaf se ctid, phir heap. (c) Keemat: disk jagah, har write par index update, VACUUM ka kaam, planning time. (d) Kab use nahi hoga: chhoti table par (seq scan sasta), low selectivity (bahut zyada rows match), column par function/cast laga ho, leading `%` wala LIKE, composite index ka pehla column skip kiya ho, ya statistics purani ho aur planner ka estimate galat ho. **Bonus:** ye batana ki "index se tez ho jaayega" ek galatfehmi hai — index selective queries ko tez karta hai, sab ko nahi.') },
    { type: 'p', text: x('**Question 2 — a good answer includes:** (a) MVCC — UPDATE sets the old row\'s `xmax` and writes a new row; the old version survives because another running transaction may still be able to see it (its snapshot is older). (b) Effect on concurrency: readers take no locks, writers don\'t block readers — that\'s the whole point. (c) VACUUM: cleans dead tuples, updates the visibility map (for index-only scans), and freezes (preventing wraparound). (d) Table size: bloat — the table grows, fewer live rows per page, the cache hit ratio drops, queries slow down. (e) Performance: an UPDATE costs about as much as an INSERT; updating an indexed column prevents a HOT update. (f) Why this design: snapshot isolation without blocking readers — the alternatives (Oracle\'s undo log, SQL Server\'s locking) have different trade-offs. **Bonus:** a long transaction or an inactive replication slot stops VACUUM — the source of the biggest bloat incidents.', '**Sawaal 2 — achhe jawab mein ye hona chahiye:** (a) MVCC — UPDATE purani row ka `xmax` set karta hai aur nayi row likhta hai; purani version isliye rehti hai kyunki koi doosri chal rahi transaction abhi bhi use dekh sakti hai (uska snapshot purana hai). (b) Concurrency par asar: readers ko lock nahi lagta, writers readers ko block nahi karte — yahi iska asli maqsad hai. (c) VACUUM: dead tuples saaf karna, visibility map update karna (index-only scan ke liye), aur freeze karna (wraparound se bachav). (d) Table size: bloat — table badhta hai, pages mein kam live rows, cache hit girta hai, queries dheemi. (e) Performance: UPDATE lagbhag INSERT jitna mehnga; indexed column update karne par HOT update nahi hota. (f) Design choice ki wajah: snapshot isolation bina readers ko block kiye — alternative (Oracle ka undo log, SQL Server ka locking) mein alag trade-offs hain. **Bonus:** lambi transaction ya inactive replication slot VACUUM ko rok deta hai — isi se sabse bade bloat incidents aate hain.') },
    { type: 'p', text: x('**Question 3 — a good answer follows this order:** (1) **Scope** — is only checkout slow, or everything? Only some users, or all? (2) **Infra** — CPU, RAM, disk I/O, disk space. If the server itself is saturated, query tuning won\'t help. (3) **`pg_stat_activity`** — how many connections, what\'s running long, how many are `idle in transaction`, who is blocked by whom (`pg_blocking_pids`). (4) **`pg_stat_statements`** — `mean_exec_time` of the checkout queries yesterday vs today; did `calls` rise (traffic spike or N+1)? (5) **`EXPLAIN (ANALYZE, BUFFERS)`** on that query — estimated vs actual rows; if they\'re 10x apart, **the statistics are stale** (check `last_autoanalyze`, run `ANALYZE`) — **and that\'s the most likely answer in this scenario: data growth flipped the plan**. (6) **Bloat / vacuum** — `n_dead_tup`, `last_autovacuum`. (7) **Locks** — a long transaction or a migration? (8) **Replica lag** — if reads go to a replica. (9) **App side** — connection pool exhausted? A slow external API? **Finally:** change one thing, measure again, and write down what changed. **Bonus:** saying that "nothing was deployed" doesn\'t mean nothing changed — data grows, statistics go stale, and the planner changes its mind.', '**Sawaal 3 — achhe jawab ka kram:** (1) **Scope** — sirf checkout slow hai ya sab? Sirf kuchh users ya sab? (2) **Infra** — CPU, RAM, disk I/O, disk space. Agar server hi bhara hai to query tuning bekaar. (3) **`pg_stat_activity`** — kitne connections, kaun lamba chal raha hai, `idle in transaction` kitne, kaun kis par blocked (`pg_blocking_pids`). (4) **`pg_stat_statements`** — checkout ki queries ka `mean_exec_time` kal vs aaj; `calls` badhe kya (traffic spike ya N+1). (5) **`EXPLAIN (ANALYZE, BUFFERS)`** us query par — estimate vs actual rows; agar 10x farak hai to **statistics purani hai** (`last_autoanalyze` dekho, `ANALYZE` chalao) — **aur yahi is scenario ka sabse sambhavit jawab hai: data badhne se plan flip ho gaya**. (6) **Bloat / vacuum** — `n_dead_tup`, `last_autovacuum`. (7) **Locks** — koi lambi transaction ya migration? (8) **Replica lag** — agar reads replica se aate hain. (9) **App side** — connection pool exhausted? Koi external API slow? **Aakhir mein:** ek cheez badlo, dobara maapo, aur likho ki kya badla. **Bonus:** ye kehna ki "koi deploy nahi hua" ka matlab ye nahi ki kuchh nahi badla — data badhta hai, statistics purani hoti hain, aur planner apna faisla badal deta hai.') }
  ]
},

    { type: 'p', text: x('Remember it as a question: **"which layer is this problem in?"** Wrong results → the SQL or MVCC/isolation layer. A slow query → the planner or disk layer (indexes, statistics, buffers). A query that\'s slow only sometimes → the locks or vacuum layer. Lost data → the WAL/backup layer. Everything slow → config, connections, or hardware.', 'Ise ek sawaal ke roop mein yaad rakho: **"ye problem kis layer par hai?"** Galat result aa raha hai → SQL ya MVCC/isolation layer. Query dheemi hai → planner ya disk layer (index, statistics, buffers). Query kabhi-kabhi dheemi hai → locks ya vacuum layer. Data kho gaya → WAL/backup layer. Sab kuchh dheema hai → config, connections, ya hardware.') },
    { type: 'p', text: x('And an even smaller framework — **every Postgres decision rests on three questions**: (1) *Is it correct?* (constraints, transactions, isolation) (2) *Is it fast?* (indexes, plans, statistics) (3) *Will it survive?* (WAL, backup, vacuum, replication). Whenever you\'re confused, ask which of these three questions you\'re trying to answer.', 'Aur ek doosra framework jo isse bhi chhota hai — **har Postgres faisla teen sawaalon par tika hai**: (1) *Kya ye sahi hai?* (constraints, transactions, isolation) (2) *Kya ye tez hai?* (indexes, plan, statistics) (3) *Kya ye tikega?* (WAL, backup, vacuum, replication). Kabhi confusion ho to poochho ki tum in teenon mein se kis sawaal ka jawab dhoondh rahe ho.') },
    { type: 'p', text: x('And the third, smallest of all: **Postgres is a program that imposes discipline on your data.** Every feature — types, constraints, transactions, MVCC, WAL — is some form of that one sentence. Whenever something doesn\'t make sense, ask: "what discipline is this feature enforcing, and what does it cost?"', 'Aur teesra, sabse chhota: **Postgres ek program hai jo tumhare data par discipline lagata hai.** Har feature — types, constraints, transactions, MVCC, WAL — isi ek vaakya ka koi na koi roop hai. Agar kabhi kuchh samajh na aaye, to poochho: "ye feature kis discipline ko enforce kar raha hai, aur uski keemat kya hai?"') }

var state = { i: -1, drawer: null, help: false, theme: 'light', blank: false };
var REDUCED = false;

var stage      = document.getElementById('stage');
var counterEl  = document.getElementById('counter');
var barEl      = document.querySelector('.progress > i');
var liveEl     = document.getElementById('live');
var scrim      = document.getElementById('scrim');
var toastEl    = document.getElementById('toast');

function sectionOf(s) {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === s.section) return SECTIONS[i];
  return { num: '', title: '' };
}

/* ── slide cache (keyed by index and language) ───────────────────────────── */
var slideCache = new Map();
function mountSlide(i) {
  var key = i + '|' + LANG;
  if (slideCache.has(key)) {
    var cached = slideCache.get(key);
    slideCache.delete(key); slideCache.set(key, cached);   // LRU touch
    return cached;
  }
  var el = buildSlide(SLIDES[i], i);
  slideCache.set(key, el);
  if (slideCache.size > 12) slideCache.delete(slideCache.keys().next().value);
  return el;
}

/* ── autofit: guarantee the slide never overflows the stage ──────────────── */
var FIT_MIN = 0.54;
var isNarrow = function () { return matchMedia('(max-width: 860px), (max-height: 420px)').matches; };

function autofit(el) {
  if (!el || el.dataset.fitted === '1' || isNarrow()) return;
  var body = el.querySelector('.s-body');
  if (!body) return;
  var best = 1;
  el.style.setProperty('--fit', '1');
  if (body.scrollHeight > body.clientHeight + 1) {
    var lo = FIT_MIN, hi = 1;
    best = FIT_MIN;
    for (var n = 0; n < 6; n++) {
      var mid = (lo + hi) / 2;
      el.style.setProperty('--fit', mid.toFixed(3));
      if (body.scrollHeight <= body.clientHeight + 1) { best = mid; lo = mid; }
      else hi = mid;
    }
    if (best <= FIT_MIN + 0.001) el.dataset.overflow = '1';
  }
  el.style.setProperty('--fit', best.toFixed(3));
  el.dataset.fitted = '1';
}

/* ── navigation ──────────────────────────────────────────────────────────── */
var navToken = 0;
function go(n) {
  n = clamp(n, 0, SLIDES.length - 1);
  var firstMount = !stage.querySelector('.slide.is-active');
  if (n === state.i && !firstMount) return;

  var dir = n > state.i ? 1 : -1;
  var token = ++navToken;
  var outgoing = stage.querySelector('.slide.is-active');
  var el = mountSlide(n);

  state.i = n;
  stage.style.setProperty('--dir', dir);
  el.classList.remove('is-leaving', 'is-active');
  if (el.parentNode !== stage) stage.append(el);
  autofit(el);

  if (firstMount || REDUCED) {
    // No outgoing slide to cross-fade with, so show it now rather than waiting
    // two frames — otherwise the very first paint is an empty stage.
    el.classList.add('is-active');
  } else {
    // Double rAF so the browser registers the "from" state before the class flip.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (token !== navToken) return;
        el.classList.add('is-active');
      });
    });
  }

  if (outgoing && outgoing !== el) {
    outgoing.classList.remove('is-active');
    outgoing.classList.add('is-leaving');
    var done = function () { if (outgoing.parentNode === stage && !outgoing.classList.contains('is-active')) outgoing.remove(); };
    outgoing.addEventListener('transitionend', done, { once: true });
    setTimeout(done, 420);
  }

  paintProgress();
  syncHash();
  store.set('pgcc.slide', n);
  if (state.drawer === 'info') renderInfo(n);
  if (state.drawer === 'index') markIndexCurrent(n, { scroll: true });
  refocusIfNeeded(el);
  announce();
}

function paintProgress() {
  barEl.style.setProperty('--p', (state.i + 1) / SLIDES.length);
  var sec = sectionOf(SLIDES[state.i]);
  counterEl.replaceChildren(
    h('span', { class: 'c-part' }, t(sec.title)),
    h('span', null, (state.i + 1) + ' / ' + SLIDES.length));
}

var hashLock = false;
function syncHash() {
  var want = '#' + SLIDES[state.i].id;
  if (location.hash === want) return;
  hashLock = true;
  try { history.replaceState(null, '', want); }
  catch (e) { location.hash = want; }
  setTimeout(function () { hashLock = false; }, 0);
}
addEventListener('hashchange', function () {
  if (hashLock) return;
  var i = indexFromHash();
  if (i >= 0) go(i);
});
function indexFromHash() {
  var hsh = location.hash.replace(/^#/, '');
  if (!hsh) return -1;
  for (var i = 0; i < SLIDES.length; i++) if (SLIDES[i].id === hsh) return i;
  var m = /^slide-(\d+)$/.exec(hsh);
  if (m) return clamp(+m[1] - 1, 0, SLIDES.length - 1);
  return -1;
}

var annT;
function announce(msg) {
  clearTimeout(annT);
  annT = setTimeout(function () {
    liveEl.textContent = msg || (t(UI.slideWord) + ' ' + (state.i + 1) + ' ' +

}

function refocusIfNeeded(el) {

function renderInfo(i) {

function renderIndex() {
  var body = document.getElementById('drawer-index-body');

  var cur = null, list = null;

  d.setAttribute('aria-hidden', 'false');
  d.classList.add('is-open');
  BTN[which].setAttribute('aria-expanded', 'true');

  var modal = isNarrow();
  d.setAttribute('aria-modal', String(modal));
  if (modal) {
    scrim.hidden = false;
    requestAnimationFrame(function () { scrim.classList.add('is-on'); });
    setInert(document.querySelector('.viewport'), true);
  }
  d.querySelector('.drawer-head h2').focus({ preventScroll: true });
  if (which === 'index') markIndexCurrent(state.i, { scroll: true });
  document.body.classList.remove('chrome-idle');
}

function hideDrawer(which) {
  var d = DRAWER_EL[which];
  d.classList.remove('is-open');
  d.setAttribute('aria-hidden', 'true');
  BTN[which].setAttribute('aria-expanded', 'false');
}

function closeDrawer() {
  var which = state.drawer;
  if (!which) return;
  hideDrawer(which);
  state.drawer = null;
  scrim.classList.remove('is-on');
  setInert(document.querySelector('.viewport'), false);
  setTimeout(function () { if (!state.drawer) scrim.hidden = true; }, 300);
  if (lastTrigger && document.contains(lastTrigger) && !DRAWER_EL.info.contains(lastTrigger)
      && !DRAWER_EL.index.contains(lastTrigger)) {
    lastTrigger.focus({ preventScroll: true });
  } else {
    var act = stage.querySelector('.slide.is-active');
    if (act) act.focus({ preventScroll: true });
  }
  lastTrigger = null;
}

function toggleDrawer(which) {
  if (state.drawer === which) closeDrawer(); else openDrawer(which);
}

/* ── help overlay (genuinely modal) ──────────────────────────────────────── */
function paintHelp() {
  var grid = document.getElementById('help-grid');
  var frag = document.createDocumentFragment();
  KEYMAP.forEach(function (row) {
    var dt = h('dt', null);
    t(row[0]).split(/\s{2,}/).forEach(function (k) { dt.append(h('kbd', null, k)); });
    frag.append(dt, h('dd', null, T(row[1])));
  });
  grid.replaceChildren(frag);
  document.getElementById('help-title').textContent = t(UI.shortcuts);
  var btn = helpEl.querySelector('[data-close-help]');
  if (btn) btn.textContent = t(UI.close);
}

function openHelp() {
  paintHelp();
  state.help = true;
  helpEl.hidden = false;
  setInert(document.querySelector('.viewport'), true);
  helpEl.querySelector('[data-close-help]').focus({ preventScroll: true });
  document.body.classList.remove('chrome-idle');
}
function closeHelp() {
  state.help = false;
  helpEl.hidden = true;
  if (!state.drawer) setInert(document.querySelector('.viewport'), false);
  var act = stage.querySelector('.slide.is-active');
  if (act) act.focus({ preventScroll: true });
}
function toggleHelp() { state.help ? closeHelp() : openHelp(); }

/* ── language ────────────────────────────────────────────────────────────── */
function setLang(lang) {
  if (lang === LANG) return;
  LANG = lang;
  document.documentElement.lang = lang === 'hi' ? 'hi-Latn' : 'en';
  document.documentElement.dataset.lang = lang;
  store.set('pgcc.language', lang);

  var drawerBody = state.drawer ? document.getElementById('drawer-' + state.drawer + '-body') : null;
  var keepScroll = drawerBody ? drawerBody.scrollTop : 0;

  var el = mountSlide(state.i);
  el.classList.add('is-active');
  autofit(el);
  stage.replaceChildren(el);

  if (state.drawer === 'info') { renderInfo(state.i); document.getElementById('drawer-info-body').scrollTop = keepScroll; }
  if (state.drawer === 'index') { renderIndex(); markIndexCurrent(state.i); document.getElementById('drawer-index-body').scrollTop = keepScroll; }
  if (state.help) paintHelp();

  paintChrome();
  paintProgress();
  showToast(lang === 'en' ? 'English' : 'Hinglish');
  announce(t(UI.langOn));
}

function paintChrome() {
  document.querySelectorAll('[data-setlang]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.setlang === LANG));
  });
  document.getElementById('drawer-info-title').textContent = t(UI.deepDive);
  document.getElementById('drawer-index-title').textContent = t(UI.contents);
  document.getElementById('drawer-info-foot').innerHTML = t(UI.infoFoot);
  document.getElementById('drawer-index-foot').innerHTML = t(UI.indexFoot);
}

/* ── theme ───────────────────────────────────────────────────────────────── */
function setTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  store.set('pgcc.theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.setAttribute('content',
      getComputedStyle(document.documentElement).getPropertyValue('--c-bg').trim());
  }
}
function toggleTheme() {
  var next = state.theme === 'dark' ? 'light' : 'dark';
  setTheme(next);
  showToast(t(next === 'dark' ? UI.themeDark : UI.themeLight));
}

/* ── toast ───────────────────────────────────────────────────────────────── */
var toastT;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function () { toastEl.hidden = true; }, 1400);
}

/* ── fullscreen and blank ────────────────────────────────────────────────── */
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch (e) {}
}
function toggleBlank() {
  state.blank = !state.blank;
  document.body.classList.toggle('is-blank', state.blank);
}

/* ── keyboard ────────────────────────────────────────────────────────────── */
var NEXT = { ArrowRight: 1, PageDown: 1, ' ': 1, Spacebar: 1, n: 1, N: 1 };
var PREV = { ArrowLeft: 1, PageUp: 1, Backspace: 1, p: 1, P: 1 };
var SCROLLY = { ArrowUp: 1, ArrowDown: 1, ' ': 1, Spacebar: 1, PageUp: 1, PageDown: 1, Home: 1, End: 1 };
var TOGGLES = { i: 1, I: 1, m: 1, M: 1, l: 1, L: 1, t: 1, T: 1, f: 1, F: 1, b: 1, B: 1, '.': 1, '?': 1 };
var numBuf = '', numT;

function isTyping(el) {
  return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function commitJump() {
  var n = parseInt(numBuf, 10);
  numBuf = '';
  toastEl.hidden = true;
  if (n) go(n - 1);
}

function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isTyping(e.target) || e.defaultPrevented) return;
  var k = e.key;
  if (e.repeat && TOGGLES[k]) return;

  if (k === 'Escape') {
    if (state.help) { closeHelp(); e.preventDefault(); }
    else if (state.drawer) { closeDrawer(); e.preventDefault(); }
    else if (state.blank) { toggleBlank(); e.preventDefault(); }
    return;
  }
  if (k === '?') { e.preventDefault(); toggleHelp(); return; }
  if (state.help) return;                       // the help overlay is modal

  if (k === 'i' || k === 'I') { e.preventDefault(); toggleDrawer('info');  return; }
  if (k === 'm' || k === 'M') { e.preventDefault(); toggleDrawer('index'); return; }
  if (k === 'l' || k === 'L') { e.preventDefault(); setLang(LANG === 'en' ? 'hi' : 'en'); return; }
  if (k === 't' || k === 'T') { e.preventDefault(); toggleTheme(); return; }
  if (k === 'f' || k === 'F') { e.preventDefault(); toggleFullscreen(); return; }
  if (k === 'b' || k === 'B' || k === '.') { e.preventDefault(); toggleBlank(); return; }

  // Focus inside a drawer: vertical and paging keys belong to that panel, so we
  // return WITHOUT preventDefault and let the browser scroll it natively.
  // Left/Right deliberately still navigate — reading the deep dive while
  // stepping through slides is the entire point of the panel.
  if (e.target && e.target.closest && e.target.closest('.drawer') && SCROLLY[k]) return;

  if (NEXT[k]) { e.preventDefault(); go(state.i + 1); return; }
  if (PREV[k]) { e.preventDefault(); go(state.i - 1); return; }
  if (k === 'Home') { e.preventDefault(); go(0); return; }
  if (k === 'End')  { e.preventDefault(); go(SLIDES.length - 1); return; }

  if (k >= '0' && k <= '9') {
    numBuf += k;
    showToast(numBuf + ' →');
    clearTimeout(numT);
    numT = setTimeout(commitJump, 800);
    e.preventDefault();
    return;
  }
  if (k === 'Enter' && numBuf) { clearTimeout(numT); commitJump(); e.preventDefault(); }
}

/* ── pointer, swipe, idle chrome ─────────────────────────────────────────── */
var sx = 0, sy = 0, tracking = false;
function wireSwipe() {
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    if (e.target.closest && e.target.closest('.scroll-x, .drawer')) return;
    sx = e.clientX; sy = e.clientY; tracking = true;
  }, { passive: true });
  stage.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.6) go(state.i + (dx < 0 ? 1 : -1));
  }, { passive: true });
}

var chromeT;
function wakeChrome() {
  document.body.classList.remove('chrome-idle');
  clearTimeout(chromeT);
  chromeT = setTimeout(function () {
    if (!state.drawer && !state.help && !isNarrow()) document.body.classList.add('chrome-idle');
  }, 2600);
}

function wireChrome() {
  document.querySelectorAll('[data-setlang]').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.setlang); });
  });
  BTN.info.addEventListener('click', function () { toggleDrawer('info'); });
  BTN.index.addEventListener('click', function () { toggleDrawer('index'); });
  document.getElementById('btn-theme').addEventListener('click', toggleTheme);
  document.getElementById('btn-help').addEventListener('click', toggleHelp);
  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', closeDrawer);
  });
  helpEl.querySelector('[data-close-help]').addEventListener('click', closeHelp);
  helpEl.addEventListener('click', function (e) { if (e.target === helpEl) closeHelp(); });
  scrim.addEventListener('click', closeDrawer);
  addEventListener('keydown', onKey);
  addEventListener('pointermove', wakeChrome, { passive: true });
  addEventListener('keydown', wakeChrome);
  addEventListener('resize', function () {
    // A resize can cross the narrow-screen boundary, which changes layout rules.
    slideCache.forEach(function (el) { delete el.dataset.fitted; });
    autofit(stage.querySelector('.slide.is-active'));
  });
}

/* ── print: mount every slide as its own page ────────────────────────────── */
function mountAll() {
  if (document.body.dataset.all === '1') return;
  var root = document.getElementById('print-root');

  // #print-root is display:none on screen, so measuring inside it would report
  // zero height and never shrink anything. Measure each slide in a real, laid-out
  // .stage instead. The unit system is resolution-independent and the print page
  // is the same 16:9 box, so the fit measured here is exactly right on paper.
  var probe = null;
  if (!isNarrow()) {
    probe = h('div', { class: 'stage', style: 'position:fixed;left:-99999px;top:0;visibility:hidden' });
    document.body.append(probe);
  }

  var pages = SLIDES.map(function (s, i) {
    var fit = '1';
    if (probe) {
      var measured = buildSlide(s, i);
      measured.classList.add('is-active');
      probe.replaceChildren(measured);
      autofit(measured);
      fit = measured.style.getPropertyValue('--fit') || '1';
    }
    var el = buildSlide(s, i);
    el.classList.add('print-slide', 'is-active');
    el.style.setProperty('--fit', fit);
    el.dataset.fitted = '1';
    return el;
  });

  if (probe) probe.remove();
  root.replaceChildren.apply(root, pages);
  document.body.dataset.all = '1';
}
function unmountAll() {
  if (document.body.dataset.all !== '1') return;
  document.getElementById('print-root').replaceChildren();
  delete document.body.dataset.all;
}

/* ═══════════════════════════════════════════════════════════════════════════
   H · VALIDATOR — behind ?debug=1
   ═══════════════════════════════════════════════════════════════════════════ */
function validate() {
  var errs = [], warns = [];
  var ids = Object.create(null);
  var secIds = Object.create(null);
  SECTIONS.forEach(function (s) { secIds[s.id] = 1; });

  function walkTX(v, path) {
    if (v == null || typeof v === 'string' || typeof v !== 'object' || Array.isArray(v)) return;
    if (!('en' in v)) errs.push(path + ': TX missing .en');
    if (!('hi' in v)) errs.push(path + ': TX missing .hi → ' + String(v.en).slice(0, 48));
    if (v.en && v.hi && v.en === v.hi && String(v.en).split(/\s+/).length > 5) {
      warns.push(path + ': en === hi on a long string — untranslated?');
    }
  }
  function walkBlocks(blocks, path) {
    (blocks || []).forEach(function (b, i) {
      var p = path + '[' + i + '](' + b.type + ')';
      if (!BLOCK[b.type]) errs.push(p + ': unknown block type');
      if (b.type === 'diagram' && !DIAGRAMS[b.id]) errs.push(p + ': no DIAGRAMS.' + b.id);
      if (b.type === 'code') {
        b.lines.forEach(function (l, n) {
          if (/<\/script/i.test(t(l))) errs.push(p + ' line ' + n + ': literal closing script tag');
          walkTX(l, p + '.lines[' + n + ']');
        });
      }
      ['text', 'title', 'caption', 'label'].forEach(function (k) {
        if (k in b) walkTX(b[k], p + '.' + k);
      });
      // Item shapes differ per block: a bare TX (ul/ol), {k,v} (defs),
      // {label,text} (steps), {text,sub} (ul), {value,label} (stats — `value`
      // is a rendered number, never translated).
      (b.items || []).forEach(function (it, j) {
        var ip = p + '.items[' + j + ']';
        if (it == null) return;
        if (typeof it === 'string' || 'en' in it || 'hi' in it) { walkTX(it, ip); return; }
        ['k', 'v', 'label', 'text', 'sub'].forEach(function (k) {
          if (it[k] != null) walkTX(it[k], ip + '.' + k);
        });
      });
      (b.head || []).forEach(function (c, j) { walkTX(c, p + '.head[' + j + ']'); });
      (b.rows || []).forEach(function (r, j) {
        r.forEach(function (c, k) { walkTX(c, p + '.rows[' + j + '][' + k + ']'); });
      });
      if (Array.isArray(b.cols)) {
        b.cols.forEach(function (c, j) { walkBlocks(c, p + '.cols[' + j + ']'); });
      }
    });
  }

  SLIDES.forEach(function (s, i) {
    var p = 'SLIDES[' + i + '] "' + s.id + '"';
    if (!s.id) errs.push(p + ': missing id');
    if (ids[s.id]) errs.push(p + ': duplicate id');
    ids[s.id] = 1;
    if (!secIds[s.section]) errs.push(p + ': unknown section "' + s.section + '"');
    walkTX(s.title, p + '.title');
    walkTX(s.kicker, p + '.kicker');
    walkTX(s.takeaway, p + '.takeaway');
    if (!s.info || !s.info.length) warns.push(p + ': no deep-dive content');
    walkBlocks(s.blocks, p + '.blocks');
    walkBlocks(s.info, p + '.info');
  });

  // Overflow lint: mount every slide in both languages offscreen.
  var keep = LANG;
  var probe = h('div', { class: 'stage', style: 'position:fixed;left:-99999px;top:0' });
  document.body.append(probe);
  ['en', 'hi'].forEach(function (lang) {
    LANG = lang;
    SLIDES.forEach(function (s, i) {
      var el = buildSlide(s, i);
      el.classList.add('is-active');
      probe.replaceChildren(el);
      autofit(el);
      var fit = parseFloat(el.style.getPropertyValue('--fit')) || 1;
      if (el.dataset.overflow) errs.push('SLIDES[' + i + '] "' + s.id + '" [' + lang + ']: OVERFLOWS');
      else if (fit < 0.86) warns.push('SLIDES[' + i + '] "' + s.id + '" [' + lang + ']: fit ' + fit.toFixed(2) + ' — trim content');
    });
  });
  probe.remove();
  LANG = keep;

  errs.forEach(function (e) { console.error('✗ ' + e); });
  warns.forEach(function (w) { console.warn('⚠ ' + w); });
  console.info('✓ validate: ' + SLIDES.length + ' slides, ' +
    Object.keys(DIAGRAMS).length + ' diagrams, ' + errs.length + ' errors, ' + warns.length + ' warnings');
}

/* ═══════════════════════════════════════════════════════════════════════════
   I · BOOT
   ═══════════════════════════════════════════════════════════════════════════ */
function boot() {
  REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTheme(store.get('pgcc.theme', 'light') === 'dark' ? 'dark' : 'light');
  LANG = store.get('pgcc.language', 'en') === 'hi' ? 'hi' : 'en';
  document.documentElement.lang = LANG === 'hi' ? 'hi-Latn' : 'en';
  document.documentElement.dataset.lang = LANG;

  wireChrome();
  wireSwipe();
  paintChrome();

  addEventListener('beforeprint', mountAll);
  addEventListener('afterprint', unmountAll);
  try {
    matchMedia('print').addEventListener('change', function (e) {
      e.matches ? mountAll() : unmountAll();
    });
  } catch (e) {}

  var params = new URLSearchParams(location.search);
  var start = indexFromHash();
  if (start < 0) start = parseInt(store.get('pgcc.slide', '0'), 10) || 0;
  go(clamp(start, 0, SLIDES.length - 1));

  if (params.get('all') === '1') mountAll();
  if (params.get('debug') === '1') validate();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
