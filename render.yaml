services:
  - type: web
    name: postgresql-age-of-ai-presentation
    runtime: static
    rootDir: supabase-talk
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /system
        destination: /system/
      - type: rewrite
        source: /system/
        destination: /system/index.html
